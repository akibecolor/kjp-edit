<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kjp-edit</title>
<!--
  統合 UI。`/` と `/layout` の両方がこれを返す。
  以前は index.html（カード + グラフ + checkout + スマホ）と
  layout-prototype.html（差分 + コンソール + 並列ペイン）に割れていて、
  機能が揃っているのに片方ずつしか使えなかった。それを1枚にしたもの。

  レイアウトは viewport で切り替える:
    広い (>1100px): [worktree + ファイラ | 差分 / コンソール | グラフ] のドック。
                    スプリッタで可変、ペインごとに最大化・最小化
    狭い (<=1100px): 縦に積む。スプリッタは消える。
                    「レイアウトの保持は諦めて縦に並べる」方針（docs/scope.md）

  ⚠️ 自動更新は**id 単位の差分更新**にすること。ペインの id は worktree の path
     （序数ではない）。以前は集合キーが変わると全ペインを作り直していたので、
     worktree が1本増えるだけで走っているコンソールが全滅し、しかも
     abort していなかったのでサーバ側の子プロセスが 600 秒残り、
     4回の増減で実行枠（8）を使い切っていた（レビューで実測）。
  ⚠️ ペインを捨てる前に必ず `abort()` する（dropPanes を通す）。
  ⚠️ 端末描画は requestAnimationFrame でまとめる。1件ごとに scrollHeight を
     読むと強制同期レイアウトで**総文字数に対して二次**になり、
     12,000 行で 54 秒・単一ブロック 28.9 秒（停止も更新も効かない）になった。
-->
<style>
  :root {
    --bg: #1e1e1e; --fg: #d4d4d4; --dim: #808080; --line: #333;
    --card: #252526; --head: #2d2d30; --accent: #4fc1ff;
    --danger: #f14c4c; --warn: #cca700; --ok: #4ec9b0;
    --bar: 34px; --split: 6px; --row: 22px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #fff; --fg: #1f1f1f; --dim: #6a6a6a; --line: #dcdcdc;
      --card: #f6f6f6; --head: #ececec; --accent: #0066bf; }
  }
  /* ⚠️ min-width/min-height: 0 は全体に効かせる。grid/flex アイテムの既定 auto が
     中身の幅で列を押し広げ、overflow:auto を無効化する。 */
  * { box-sizing: border-box; min-width: 0; min-height: 0; }
  html, body { height: 100%; }
  /* ⚠️ flex column にする。以前は .shell の高さを calc(100% - バー) で決め打ちして
     いたので、#alerts の高さぶんがそのまま viewport の外へ押し出され、
     body が overflow:hidden なのでスクロールもできなかった
     （警告7件で下端 187px が永久に見えない。レビューで実測）。 */
  body { margin: 0; background: var(--bg); color: var(--fg); overflow: hidden;
    display: flex; flex-direction: column; height: 100%;
    font: 12px/1.5 ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace; }

  .topbar { height: var(--bar); flex: 0 0 auto; display: flex; align-items: center; gap: .6rem;
    padding: 0 .6rem; background: var(--head); border-bottom: 1px solid var(--line);
    flex-wrap: nowrap; overflow: hidden; }
  .topbar > * { flex: 0 0 auto; }
  .topbar b { font-size: 13px; }
  .topbar .path { color: var(--dim); flex: 1 1 auto; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .cap { border-radius: 3px; padding: 0 .4em; font-size: 11px; border: 1px solid; }
  .cap.w { color: var(--warn); border-color: var(--warn); }
  .cap.x { color: var(--danger); border-color: var(--danger); }
  .topbar button { font: inherit; font-size: 11px; background: var(--card); color: var(--fg);
    border: 1px solid var(--line); border-radius: 3px; padding: .2rem .5rem;
    min-height: 26px; cursor: pointer; }

  /* 安全に関わる警告は畳めない位置に置く */
  #alerts:empty { display: none; }
  #alerts { flex: 0 0 auto; max-height: 22vh; overflow: auto;
    border-bottom: 1px solid var(--line); background: var(--bg); }
  .alert { border-left: 3px solid var(--warn); padding: .3rem .6rem; margin: .2rem .4rem;
    background: var(--card); font-size: 12px; overflow-wrap: anywhere; }
  .alert.danger { border-left-color: var(--danger); }

  .shell { flex: 1 1 auto; min-height: 0; display: flex; }
  .col, .row { display: flex; }
  .col { flex-direction: column; }
  .row { flex-direction: row; }
  #left { flex: 0 0 230px; }
  #center { flex: 1 1 auto; flex-direction: column; }
  #right { flex: 0 0 430px; }
  #diffs { flex: 1 1 58%; }
  #consoles { flex: 1 1 42%; }

  .split { flex: 0 0 var(--split); position: relative; }
  .split::after { content: ''; position: absolute; inset: 0; background: var(--line); }
  .split:hover::after, .split.dragging::after { background: var(--accent); }
  .split.x { cursor: col-resize; } .split.y { cursor: row-resize; }
  .split.x::after { left: 2px; right: 2px; } .split.y::after { top: 2px; bottom: 2px; }

  .pane { display: flex; flex-direction: column; background: var(--card);
    border: 1px solid var(--line); border-radius: 3px; overflow: hidden;
    flex: 1 1 auto; margin: 2px; }
  .pane > header { display: flex; align-items: center; gap: .3rem; flex: 0 0 auto;
    padding: .25rem .45rem; background: var(--head); border-bottom: 1px solid var(--line);
    font-size: 11px; white-space: nowrap; cursor: pointer; }
  /* ⚠️ タイトルは縮む側、タグとボタンは縮まない側。分けないと狭いペインで
     タグがタイトル文字に重なって読めなくなる。 */
  .pane > header .ttl { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
  .pane > header .grow { flex: 1 1 auto; }
  .pane > header .tag { flex: 0 0 auto; }
  .pane > header button { font: inherit; background: transparent; color: var(--dim);
    border: 0; cursor: pointer; padding: 0 .3rem; border-radius: 2px;
    flex: 0 0 auto; white-space: nowrap; min-height: 22px; }
  .pane > header button:hover { color: var(--fg); background: rgba(127,127,127,.2); }
  .pane > .body { flex: 1 1 auto; overflow: auto; }
  .pane.max { position: fixed; inset: var(--bar) 0 0 0; z-index: 50; margin: 0; border-radius: 0; }
  .pane.min { flex: 0 0 auto; }
  .pane.min > .body { display: none; }

  .tag { border: 1px solid var(--line); border-radius: 3px; padding: 0 .3em;
    color: var(--dim); font-size: 10px; }
  .tag.br { color: var(--accent); border-color: var(--accent); }
  .tag.dirty { color: var(--warn); border-color: var(--warn); }
  .tag.danger { color: var(--danger); border-color: var(--danger); }

  /* worktree カード */
  .cards { display: grid; gap: .4rem; padding: .4rem; }
  .card { background: var(--bg); border: 1px solid var(--line); border-radius: 3px;
    padding: .4rem .5rem; }
  .card h3 { margin: 0 0 .25rem; font-size: 12px; display: flex; gap: .3rem;
    align-items: center; flex-wrap: wrap; }
  .ab { color: var(--dim); font-size: 11px; overflow-wrap: anywhere; }
  .ab b { color: var(--fg); font-weight: 600; }
  .wr { display: flex; gap: .25rem; align-items: center; margin-top: .3rem; flex-wrap: wrap; }
  .wr select { font: inherit; font-size: 11px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 3px; max-width: 10rem; }
  .wr button { font: inherit; font-size: 11px; padding: .1rem .5rem; background: var(--card);
    color: var(--fg); border: 1px solid var(--line); border-radius: 3px;
    cursor: pointer; flex: 0 0 auto; white-space: nowrap; }
  .wrmsg { font-size: 11px; color: var(--dim); overflow-wrap: anywhere; }
  .wrmsg.bad { color: var(--danger); }

  /* ファイラ */
  .tree { padding: .3rem 0; }
  .tree div { padding: .05rem .5rem; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .tree .d { color: var(--fg); }
  .tree .f { color: var(--dim); cursor: pointer; }
  .tree .f:hover { background: rgba(127,127,127,.15); }
  .tree .st { color: var(--accent); display: inline-block; width: 1.1em; }

  /* 差分 */
  .tabs { display: flex; flex: 0 0 auto; background: var(--head);
    border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs button { font: inherit; font-size: 11px; background: transparent; border: 0;
    border-right: 1px solid var(--line); color: var(--dim);
    padding: .2rem .5rem; cursor: pointer; white-space: nowrap; }
  .tabs button.on { background: var(--card); color: var(--fg); }
  .diff { white-space: pre; font-size: 12px; }
  .diff div { padding: 0 .5rem; }
  .diff .h { color: var(--dim); background: rgba(127,127,127,.10); }
  .diff .hunk { color: var(--accent); background: rgba(79,193,255,.08); }
  .diff .add { color: #4ec9b0; background: rgba(78,201,176,.10); }
  .diff .del { color: #f14c4c; background: rgba(241,76,76,.10); }
  @media (prefers-color-scheme: light) {
    .diff .add { color: #0a7a5e; } .diff .del { color: #b3261e; }
  }
  /* ⚠️ overflow-wrap が無いと `--allow-transcript-text` のような長い語で
     行が箱より広くなり、狭い画面で**注意書き自体が読めなくなる**（実測）。
     省略の告知が読めないのは、告知が無いのと同じ。 */
  .note { color: var(--dim); padding: .5rem; font-size: 11px; overflow-wrap: anywhere; }
  .note.warn { color: var(--warn); }

  /* コンソール */
  .cmdbar { display: flex; gap: .25rem; padding: .25rem .3rem; flex: 0 0 auto;
    border-bottom: 1px solid var(--line); background: var(--head);
    align-items: center; flex-wrap: wrap; }
  .cmdbar input { flex: 1 1 7rem; font: inherit; font-size: 11px; background: var(--bg);
    color: var(--fg); border: 1px solid var(--line); border-radius: 3px; padding: .15rem .3rem; }
  .cmdbar select { flex: 0 1 auto; max-width: 9rem; font: inherit; font-size: 11px;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 3px; }
  /* ボタンは縮ませない。狭いと「実/行」と縦に割れて読めなくなる */
  .cmdbar button { font: inherit; font-size: 11px; padding: .1rem .45rem; background: var(--card);
    color: var(--fg); border: 1px solid var(--line); border-radius: 3px;
    cursor: pointer; flex: 0 0 auto; white-space: nowrap; }
  .cmdbar button:disabled { color: var(--dim); cursor: default; }
  .argvpeek { color: var(--dim); font-size: 10px; padding: .1rem .5rem; flex: 0 0 auto;
    border-bottom: 1px dashed var(--line); overflow-wrap: anywhere; }
  .argvpeek.bad { color: var(--danger); }
  .term { padding: .3rem .5rem; white-space: pre-wrap; word-break: break-word;
    font-size: 11px; line-height: 1.45; }
  .term .p { color: var(--ok); } .term .w { color: var(--warn); }
  .term .e { color: var(--danger); } .term .d { color: var(--dim); }
  /* 自分が送った行。出力と混ざると「誰が言ったか」が読めなくなる */
  .term .i { color: var(--accent); }

  /* 🚨 `hidden` 属性を作者スタイルで上書きしないための保険。
     `.cmdbar { display: flex }` のような規則は UA の `[hidden]{display:none}` に
     **勝つ**ので、`el.hidden = true` にしても消えない。
     実際に「送れないのに入力欄が出ている（押しても無反応）」状態を作った。 */
  [hidden] { display: none !important; }

  /* グラフ */
  .grow { display: grid; grid-template-columns: auto auto auto 1fr;
    align-items: center; height: var(--row); gap: .35rem; }
  .grow:hover { background: rgba(127,127,127,.12); }
  .grow svg { display: block; }
  /* ⚠️ バッジを .subject の中に入れてはいけない。overflow:hidden で
     クリップされ、狭い画面で**完全に見えなくなる**（横スクロールでも到達できない）。 */
  .wtcell, .refcell { display: flex; gap: .2rem; align-items: center;
    overflow: hidden; white-space: nowrap; }
  .subject { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* ⚠️ flex-shrink させない。ref が多いコミットで**全部 8px に潰れて
     0〜1文字しか読めなくなる**（レビューで51個を実測）。
     溢れは切り詰めて「+N」で示す方が情報が残る。 */
  .ref { border: 1px solid var(--line); border-radius: 3px; padding: 0 .3em;
    font-size: 10px; max-width: 11em; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; flex: 0 0 auto; }
  .ref.wt { color: var(--accent); border-color: var(--accent); }
  .empty { color: var(--dim); padding: .5rem; }

  /* ---- 狭い画面: レイアウトの保持を諦めて縦に積む ---- */
  @media (max-width: 1100px) {
    body { overflow: auto; }
    /* ⚠️ block ではなく flex column にする。block だと order が効かず、
       DOM 順のせいで**グラフが一番下**になって長いスクロールが必要になる。
       スマホで一番見たいのは worktree の状態とグラフなので前に出す。 */
    .shell { display: flex; flex-direction: column; height: auto; }
    .col, .row { display: flex; flex-direction: column; }
    #left { order: 1; } #right { order: 2; } #center { order: 3; }
    .split { display: none; }
    #left, #right, #center, #diffs, #consoles { flex: none; }
    .pane { margin: .4rem; }
    .pane > .body { max-height: 60vh; }
    .pane.max { position: static; inset: auto; }
    .cards { grid-template-columns: 1fr; }
    /* ref バッジは 390px では1〜2文字に潰れて情報にならない。
       worktree HEAD バッジ（核心情報）を残して ref は落とす。 */
    .refcell { display: none; }
  }
</style>

<div class="topbar">
  <b>kjp-edit</b>
  <span class="path" id="repo"></span>
  <span class="cap" id="cap" hidden></span>
  <button id="refresh">再読込</button>
  <button id="reset">レイアウト</button>
  <span class="path" id="at" style="flex:0 0 auto"></span>
</div>

<section id="alerts"></section>

<div class="shell" id="shell">
  <div class="col" id="left"></div>
  <div class="split x"></div>
  <div class="col" id="center">
    <div class="row" id="diffs"></div>
    <div class="split y"></div>
    <div class="row" id="consoles"></div>
  </div>
  <div class="split x"></div>
  <div class="col" id="right"></div>
</div>

<script type="module">
// 行割れ・マルチバイト割れの処理は共有モジュール（unit テストと同じコード）
import { parseNdjson } from './ndjson.mjs';
// argv の分割も共有モジュール（app.html の中だとテストできない）
import { splitArgv } from './argv.mjs';

const LANE_W = 10, ROW_H = 22, DOT_R = 3.2;
const $ = s => document.querySelector(s);
const el = (t, c, x) => {
  const n = document.createElement(t);
  if (c) n.className = c;
  if (x !== undefined) n.textContent = x;
  return n;
};

let session = { allowWrite: false, allowExec: false, token: null, tokenHeader: 'x-kjp-token' };
let state = null;

/* ===== スプリッタ / ペイン ===== */
function wireSplit(sp) {
  const dir = sp.classList.contains('x') ? 'x' : 'y';
  sp.addEventListener('pointerdown', e => {
    const prev = sp.previousElementSibling, next = sp.nextElementSibling;
    if (!prev || !next) return;
    e.preventDefault();
    sp.classList.add('dragging');
    sp.setPointerCapture(e.pointerId);
    const at = ev => (dir === 'x' ? ev.clientX : ev.clientY);
    const size = n => (dir === 'x'
      ? n.getBoundingClientRect().width : n.getBoundingClientRect().height);
    const start = at(e), p0 = size(prev), n0 = size(next), MIN = 60;
    const move = ev => {
      let d = at(ev) - start;
      d = Math.max(-(p0 - MIN), Math.min(n0 - MIN, d));
      prev.style.flex = `0 0 ${p0 + d}px`;
      next.style.flex = `0 0 ${n0 - d}px`;
    };
    const up = () => {
      sp.classList.remove('dragging');
      sp.removeEventListener('pointermove', move);
      sp.removeEventListener('pointerup', up);
      sp.removeEventListener('pointercancel', up);
    };
    sp.addEventListener('pointermove', move);
    sp.addEventListener('pointerup', up);
    sp.addEventListener('pointercancel', up);
  });
}

/** ペインを作る。ヘッダのクリックで開閉、⛶ で最大化。 */
function pane(id, title, tags = []) {
  const p = el('div', 'pane');
  p.dataset.paneId = id;
  const h = el('header');
  const ttl = el('span', 'ttl', title);
  const tagBox = el('span', 'tags');
  tagBox.style.display = 'flex';
  tagBox.style.gap = '.3rem';
  for (const [cls, text] of tags) tagBox.append(el('span', `tag ${cls}`, text));
  const bmin = el('button', null, '–'); bmin.title = '最小化';
  const bmax = el('button', null, '⛶'); bmax.title = '最大化';
  h.append(ttl, el('span', 'grow'), tagBox, bmin, bmax);
  const body = el('div', 'body');
  p.append(h, body);

  h.addEventListener('click', ev => {
    if (ev.target === bmin || ev.target === bmax) return;
    p.classList.toggle('min');
  });
  bmin.addEventListener('click', ev => { ev.stopPropagation(); p.classList.toggle('min'); });
  bmax.addEventListener('click', ev => {
    ev.stopPropagation();
    const was = p.classList.contains('max');
    for (const o of document.querySelectorAll('.pane.max')) o.classList.remove('max');
    if (!was) p.classList.add('max');
  });
  return { p, body, ttl, tagBox };
}

function setTags(tagBox, tags) {
  tagBox.replaceChildren();
  for (const [cls, text] of tags) tagBox.append(el('span', `tag ${cls}`, text));
}

$('#reset').addEventListener('click', () => {
  for (const n of document.querySelectorAll('.col,.row,.pane')) {
    n.style.flex = ''; n.classList.remove('max', 'min');
  }
});

/* ===== グラフ ===== */
function rowSvg(row) {
  const lanes = Math.max(row.input.length, row.output.length, row.lane + 1);
  const w = Math.max(lanes, 1) * LANE_W + LANE_W;
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', w); svg.setAttribute('height', ROW_H);
  const x = i => i * LANE_W + LANE_W / 2 + 2;
  const add = (n, a) => {
    const e = document.createElementNS(NS, n);
    for (const [k, v] of Object.entries(a)) e.setAttribute(k, v);
    svg.appendChild(e); return e;
  };
  const fed = new Set();
  row.input.forEach((node, i) => {
    const t = node.id === row.hash ? row.lane
      : row.output.findIndex(o => o.id === node.id);
    if (node.id !== row.hash && t !== -1) fed.add(t);
    add('path', {
      d: `M ${x(i)} 0 L ${x(i)} ${ROW_H / 2 - 5} L ${x(t === -1 ? i : t)} ${ROW_H / 2}`,
      stroke: node.color, fill: 'none', 'stroke-width': 1.5,
    });
  });
  const mp = new Set(row.mergeParentLanes ?? []);
  row.output.forEach((node, i) => {
    const fresh = mp.has(i) && !fed.has(i);
    const from = (i === row.firstParentLane || fresh) ? row.lane : i;
    add('path', {
      d: `M ${x(from)} ${ROW_H / 2} L ${x(i)} ${ROW_H / 2 + 5} L ${x(i)} ${ROW_H}`,
      stroke: node.color, fill: 'none', 'stroke-width': 1.5,
    });
  });
  for (const i of mp) {
    if (!fed.has(i) || i === row.firstParentLane) continue;
    add('path', {
      d: `M ${x(row.lane)} ${ROW_H / 2} L ${x(i)} ${ROW_H / 2 + 5}`,
      stroke: row.output[i]?.color ?? row.color, fill: 'none', 'stroke-width': 1.5,
    });
  }
  const isHead = row.worktrees.length > 0;
  add('circle', {
    cx: x(row.lane), cy: ROW_H / 2, r: isHead ? DOT_R + 1.3 : DOT_R,
    fill: isHead ? 'var(--card)' : row.color, stroke: row.color,
    'stroke-width': isHead ? 2.2 : 1,
  });
  return svg;
}

function when(iso) {
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 60) return `${m}分前`;
  const h = Math.round(m / 60);
  return h < 24 ? `${h}時間前` : `${Math.round(h / 24)}日前`;
}

/* ===== 差分 ===== */
function renderDiff(text) {
  const box = el('div', 'diff');
  const lines = text.split('\n');
  if (lines.length && lines.at(-1) === '') lines.pop();
  for (const line of lines) {
    let cls = '';
    if (line.startsWith('@@')) cls = 'hunk';
    else if (/^(\+\+\+|---|diff |index |new file|deleted file|similarity |rename )/.test(line)) cls = 'h';
    else if (line.startsWith('+')) cls = 'add';
    else if (line.startsWith('-')) cls = 'del';
    box.append(el('div', cls, line === '' ? ' ' : line));
  }
  if (!lines.length) box.append(el('div', 'h', '(差分なし)'));
  return box;
}

async function loadDiff(holder, base, ref, path) {
  holder.replaceChildren(el('div', 'note', `読み込み中: ${path}`));
  try {
    const q = new URLSearchParams({ base, ref, path });
    const res = await fetch(`/api/v0/diff?${q}`);
    const d = await res.json();
    if (!res.ok) throw new Error(d.error ?? `HTTP ${res.status}`);
    if (d.binary) { holder.replaceChildren(el('div', 'note', 'バイナリファイル')); return; }
    holder.replaceChildren(renderDiff(d.text ?? ''));
  } catch (e) {
    holder.replaceChildren(el('div', 'note warn', `取得できませんでした: ${e.message}`));
  }
}

/* ===== コンソール ===== */
const MAX_CONSOLE_PANES = 4, MAX_DIFF_PANES = 2;
const IS_WIN = /win/i.test(navigator.platform ?? '');
const PRESETS = [
  'git status --short',
  'git log --oneline -10',
  'git diff --stat',
  IS_WIN ? 'cmd /c npm test' : 'npm test',
  'claude -p "この worktree の変更を要約して"',
];

/**
 * 会話モードの argv。
 *
 * ⚠️ **PTY は要らない。** `--input-format stream-json` で素のパイプ越しに
 *    多ターンの会話が成立する（実測で確認: 同一プロセス・同一セッションで
 *    2ターン目が1ターン目を覚えている）。出力も JSON 行なので
 *    既にある ndjson の配管に乗る。
 * ⚠️ 権限は `plan` にしておく。会話しながら勝手に書き換えられると、
 *    観測しているつもりが変更になる。書かせたいなら明示的に argv を編集する。
 */
const CHAT_ARGV = [
  'claude', '-p',
  '--input-format', 'stream-json',
  '--output-format', 'stream-json',
  '--verbose',
  '--replay-user-messages',
  '--permission-mode', 'plan',
];

/** 会話モードの1ターンを stream-json の1行にする（サーバは解釈しない） */
function chatLine(text) {
  return `${JSON.stringify({
    type: 'user',
    message: { role: 'user', content: [{ type: 'text', text }] },
  })}\n`;
}

/**
 * 会話モードの出力（stream-json）を読める形にする。
 *
 * ⚠️ **`out` は行の途中で切れて届く。** 行単位に組み直してから JSON にする
 *    （chunk 境界の扱いは v0/ndjson.mjs と同じ問題）。
 * ⚠️ 解釈できない行は**捨てずにそのまま出す。** 形式は Claude Code の
 *    内部形式なので変わる。黙って消すと「応答が来ていない」ように見える。
 */
function makeChatFilter(line) {
  let buf = '';
  return raw => {
    buf += raw;
    const parts = buf.split('\n');
    buf = parts.pop();
    for (const l of parts) {
      if (!l.trim()) continue;
      let r;
      try { r = JSON.parse(l); } catch { line('', `${l}\n`); continue; }
      if (r.type === 'assistant') {
        const t = (r.message?.content ?? [])
          .filter(b => b.type === 'text').map(b => b.text).join('');
        if (t.trim()) line('', `${t.trim()}\n`);
        for (const b of r.message?.content ?? []) {
          if (b.type === 'tool_use') line('d', `  · ${b.name}\n`);
        }
      } else if (r.type === 'result') {
        line(r.is_error ? 'e' : 'p', `── ${r.is_error ? '✖ エラー' : '✔ 応答おわり'} ──\n`);
      } else if (r.type === 'system' && r.subtype === 'init') {
        line('d', `（セッション ${String(r.session_id ?? '').slice(0, 8)} で開始）\n`);
      }
      // それ以外（rate_limit_event / user の replay など）は出さない
    }
  };
}

/** 端末の上限。超えたら先頭を捨てる（捨てたことは画面に出す）。 */
const TERM_MAX_SPANS = 4000;

/**
 * 実行セッションを購読する。**新規実行と再購読の両方**を担う。
 * @param {?{id: string, from: number}} attach 再購読するセッション（新規なら null）
 */
async function runExec(termEl, scrollEl, wt, argv, onState,
  { attach = null, keepAlive = false, chat = false } = {}) {
  // ⚠️ 出力1件ごとに DOM に append して scrollHeight を読むと、
  //    **強制同期レイアウトが総文字数に比例**して全体が二次になる。
  //    レビューの実測で 12,000 行 = 54 秒、うち 28.9 秒が単一ブロック
  //    （その間 停止ボタンも自動更新も効かない）。
  //    → イベントを溜めて requestAnimationFrame で1回だけ流す。
  //    → atBottom は毎回測らず scroll イベントで真偽値として持つ。
  let follow = true;
  const onScroll = () => {
    follow = scrollEl.scrollTop + scrollEl.clientHeight >= scrollEl.scrollHeight - 24;
  };
  scrollEl.addEventListener('scroll', onScroll, { passive: true });

  let queue = [], flushing = false;
  const flush = () => {
    flushing = false;
    if (!queue.length) return;
    const frag = document.createDocumentFragment();
    for (const [cls, s] of queue) frag.append(el('span', cls, s));
    queue = [];
    termEl.append(frag);
    // 上限を超えたら先頭を捨てる。「全部見えている」という誤認を防ぐため告知する
    if (termEl.childNodes.length > TERM_MAX_SPANS) {
      const drop = termEl.childNodes.length - TERM_MAX_SPANS;
      for (let i = 0; i < drop; i++) termEl.firstChild?.remove();
      if (!termEl.dataset.trimmed) {
        termEl.dataset.trimmed = '1';
        termEl.prepend(el('span', 'w', `⚠ 出力が多いので古い行を捨てています（直近 ${TERM_MAX_SPANS} 要素）\n`));
      }
    }
    if (follow) scrollEl.scrollTop = scrollEl.scrollHeight;
  };
  const line = (cls, s) => {
    queue.push([cls, s]);
    if (!flushing) { flushing = true; requestAnimationFrame(flush); }
  };

  const ac = new AbortController();
  // ⚠️ **abort はもう「停止」ではない。** #17 でサーバが切断で子を殺すのを
  //    やめたので、abort は「見るのをやめる」だけ。止めるには kill を呼ぶ。
  //    ここを混同すると「停止を押したのに走り続ける」ことになる。
  let sessionId = attach?.id ?? null;
  let lastSeq = attach?.from ?? 0;
  const kill = async () => {
    if (!sessionId) { ac.abort(); return; }
    try {
      await fetch(`/api/v0/exec/${sessionId}/kill`, {
        method: 'POST',
        headers: { 'content-type': 'application/json', [session.tokenHeader]: session.token ?? '' },
      });
    } catch { /* 既に終わっている */ }
  };
  // 会話モードでは stream-json を読める形に直す
  const chatFilter = chat ? makeChatFilter(line) : null;
  /** 走っているセッションの標準入力に書く */
  const write = async (data, eof = false) => {
    if (!sessionId) return { ok: false, error: 'セッションがまだありません' };
    try {
      const r = await fetch(`/api/v0/exec/${sessionId}/input`, {
        method: 'POST',
        headers: { 'content-type': 'application/json', [session.tokenHeader]: session.token ?? '' },
        body: JSON.stringify(eof ? { eof: true } : { data }),
      });
      if (!r.ok) {
        let msg = `HTTP ${r.status}`;
        try { msg = (await r.json()).error ?? msg; } catch { /* JSON でない */ }
        line('e', `✖ ${msg}\n`);
        return { ok: false, error: msg };
      }
      return { ok: true };
    } catch (e) {
      line('e', `✖ ${e.message}\n`);
      return { ok: false, error: e.message };
    }
  };
  const publish = () => onState({
    running: true, abort: () => ac.abort(), kill, sessionId, chat, write,
    seq: () => lastSeq,
  });
  publish();
  line('d', attach ? `↻ セッション ${attach.id} に再接続\n` : `$ ${argv.join(' ')}\n`);
  try {
    const res = await fetch(attach ? `/api/v0/exec/${attach.id}/stream` : '/api/v0/exec', {
      method: 'POST',
      headers: { 'content-type': 'application/json', [session.tokenHeader]: session.token ?? '' },
      body: JSON.stringify(attach
        ? { from: attach.from ?? 0 }
        : { worktree: wt.path, argv, keepAlive: !!keepAlive }),
      signal: ac.signal,
    });
    if (!res.ok) {
      let msg = `HTTP ${res.status}`;
      try { msg = (await res.json()).error ?? msg; } catch { /* JSON でない */ }
      line('e', `✖ ${msg}\n`);
      return;
    }
    for await (const ev of parseNdjson(res.body)) {
      if (ev.__parseError) { line('e', `(解析できない行: ${ev.__parseError.slice(0, 80)})\n`); continue; }
      // 通番を覚える。再接続で「続きから」貰うために必要
      if (typeof ev.n === 'number' && ev.n > lastSeq) lastSeq = ev.n;
      if (ev.t === 'session') {
        sessionId = ev.id;
        publish();
        if (ev.keepAlive) line('d', '（切断しても最後まで走ります）\n');
        else if (ev.detachedGraceMs) {
          line('d', `（切断しても ${Math.round(ev.detachedGraceMs / 1000)} 秒は走り続けます）\n`);
        }
        continue;
      }
      if (ev.t === 'in') line('i', `▸ ${ev.d}`);
      else if (ev.t === 'note') line('d', `${ev.d}\n`);
      else if (ev.t === 'out') { if (chatFilter) chatFilter(ev.d); else line('', ev.d); }
      else if (ev.t === 'err') line('w', ev.d);
      else if (ev.t === 'exit') {
        const ok = ev.code === 0;
        line(ok ? 'p' : 'e',
          `\n${ok ? '✔' : '✖'} exit=${ev.code}${ev.signal ? ` signal=${ev.signal}` : ''}\n`);
      }
    }
  } catch (e) {
    // ⚠️ **「サーバ側でプロセスを停止」と書いてはいけない。** #17 で
    //    切断では止まらなくなった。嘘を書くと、走り続けているものを
    //    止めたと誤解する（観測ツールとして最悪の誤り）
    if (e.name === 'AbortError') {
      line('w', sessionId
        ? `\n⚠ 見るのをやめました。セッション ${sessionId} はまだ走っています（止めるには「停止」）\n`
        : '\n⚠ 中断しました\n');
    }
    else line('e', `\n✖ ${e.message}\n`);
  } finally {
    flush();                       // 溜まっている分を出し切る
    scrollEl.removeEventListener('scroll', onScroll);
    onState({ running: false });
  }
}

/**
 * @param {object} paneObj ペインオブジェクト。走っている実行を中断できるよう
 *   `abort` を持たせる。⚠️ これが無いとペインを捨てた時に中断できず、
 *   サーバ側の子プロセスが --exec-timeout（既定600秒）まで残り、
 *   4回で MAX_CONCURRENT_EXEC を食い尽くす（レビューで実測）。
 */
function consoleBody(wt, paneObj) {
  const box = el('div');
  box.style.cssText = 'display:flex;flex-direction:column;height:100%';
  if (!session.allowExec) {
    box.append(el('div', 'note warn',
      '実行は無効です。--allow-exec と 24 文字以上の --token を付けて起動すると使えます。'
      + ' 遠隔から引ける状態は remote code execution なので既定でオフです。'));
    return box;
  }
  const bar = el('div', 'cmdbar');
  const sel = el('select');
  for (const p of PRESETS) { const o = el('option', null, p); o.value = p; sel.append(o); }
  const input = el('input');
  input.value = PRESETS[0];
  input.spellcheck = false;
  const run = el('button', null, '実行');
  const chatBtn = el('button', null, '会話');
  chatBtn.title = 'claude と多ターンで会話する（PTY は使いません）';
  const stop = el('button', null, '停止');
  stop.disabled = true;
  bar.append(sel, input, run, chatBtn, stop);

  const peek = el('div', 'argvpeek');
  const scroll = el('div');
  scroll.style.cssText = 'flex:1 1 auto;overflow:auto';
  const term = el('div', 'term');
  scroll.append(term);

  let parsed = { argv: [], warning: null };
  const refresh = () => {
    parsed = splitArgv(input.value);
    peek.className = parsed.warning ? 'argvpeek bad' : 'argvpeek';
    peek.textContent = parsed.warning
      ? `⚠ ${parsed.warning}（実行できません）`
      : parsed.argv.length
        ? `argv: ${JSON.stringify(parsed.argv)}（shell は経由しません）`
        : 'コマンドを入力してください';
    // 空入力や壊れた入力では押せないようにする（押して無反応は壊れて見える）
    if (!box.dataset.running) run.disabled = !parsed.argv.length || !!parsed.warning;
  };
  input.addEventListener('input', refresh);
  sel.addEventListener('change', () => { input.value = sel.value; refresh(); });
  refresh();

  // 走っているセッションへの再接続口。**ここが無いと、切断しても走り続ける
  // ようにした意味が半分無くなる**（戻ってきたのに追いつけない）。
  const resume = el('div', 'note');
  resume.hidden = true;

  // 標準入力の欄（#18）。走っているセッションにだけ出す。
  // ⚠️ **自動更新で作り直さない。** 入力途中の文字が消える
  //    （書き込み操作の入力を作り直さない規則と同じ理由）。
  const inbar = el('div', 'cmdbar');
  inbar.hidden = true;
  const inField = el('input');
  inField.placeholder = '送信する行（Enter）';
  inField.spellcheck = false;
  const sendBtn = el('button', null, '送信');
  const eofBtn = el('button', null, 'EOF');
  eofBtn.title = '標準入力を閉じる（入力待ちのプログラムを終わらせる）';
  inbar.append(inField, sendBtn, eofBtn);

  let cur = null;
  const onState = st => {
    box.dataset.running = st.running ? '1' : '';
    stop.disabled = !st.running;
    input.disabled = st.running;
    run.disabled = st.running || !parsed.argv.length || !!parsed.warning;
    cur = st.running ? st : null;
    // ⚠️ ペインを捨てる前に呼ばれる。**これは kill ではなく購読解除**。
    //    サーバ側は猶予（既定5分）のあいだ走り続け、その間は再接続できる
    paneObj.abort = st.running ? st.abort : null;
    paneObj.sessionId = st.running ? st.sessionId : null;
    if (st.running) resume.hidden = true;
    // 標準入力の欄は走っている間だけ出す
    inbar.hidden = !st.running;
    inField.placeholder = st.chat
      ? 'claude に送るメッセージ（Enter）'
      : '送信する行（Enter）';
    chatBtn.disabled = st.running || !session.allowExec;
  };
  const start = (opts) => {
    if (parsed.warning || !parsed.argv.length) return;
    runExec(term, scroll, wt, parsed.argv, onState, opts);
  };

  const send = async () => {
    const text = inField.value;
    if (!text || !cur?.write) return;
    inField.value = '';
    // 会話モードなら stream-json の1行にする。素のモードは行をそのまま送る
    const r = await cur.write(cur.chat ? chatLine(text) : `${text}\n`);
    // 送れなかったら入力を戻す（打ち直させない）
    if (!r?.ok) inField.value = text;
  };
  sendBtn.addEventListener('click', send);
  inField.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  eofBtn.addEventListener('click', () => cur?.write?.('', true));
  chatBtn.addEventListener('click', () => {
    // 会話は専用の argv で始める（入力欄の内容は使わない）
    runExec(term, scroll, wt, CHAT_ARGV, onState, { chat: true, keepAlive: true });
  });

  /**
   * この worktree で走っているセッションを出す。
   * ⚠️ 自動更新のたびに作り直すが、**入力欄は作り直さない**（選択が飛ぶ）。
   *    ここは表示だけなので作り直して良い。
   */
  paneObj.showSessions = list => {
    const mine = (list ?? []).filter(s => samePathish(s.worktree, wt.path)
      && (s.state === 'starting' || s.state === 'running')
      && s.id !== paneObj.sessionId);
    resume.replaceChildren();
    resume.hidden = mine.length === 0;
    if (!mine.length) return;
    resume.append(document.createTextNode(
      `⚠ このworktreeで ${mine.length} 件のセッションが走っています（別の画面から実行したもの）:`));
    for (const s of mine) {
      const row = el('div', 'ab');
      row.append(document.createTextNode(`${s.argv.join(' ')} — ${Math.round(s.ageMs / 1000)}秒経過`));
      if (s.detachedMs !== null && !s.keepAlive) {
        row.append(el('span', 'note', ` / 切断中 ${Math.round(s.detachedMs / 1000)}秒`));
      }
      const re = el('button', null, '再接続');
      re.addEventListener('click', () => {
        // 通番 0 から = 残っている分を全部再生してもらう
        runExec(term, scroll, wt, s.argv, onState, { attach: { id: s.id, from: 0 } });
      });
      const kb = el('button', null, '停止');
      kb.addEventListener('click', async () => {
        kb.disabled = true;
        try {
          await fetch(`/api/v0/exec/${s.id}/kill`, {
            method: 'POST',
            headers: { 'content-type': 'application/json', [session.tokenHeader]: session.token ?? '' },
          });
        } catch { /* 既に終わっている */ }
      });
      row.append(re, kb);
      resume.append(row);
    }
  };
  run.addEventListener('click', start);
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !run.disabled) start(); });
  // ⚠️ 「停止」は本当に止める（kill）。abort だけでは切断にすぎず、
  //    サーバ側は猶予のあいだ走り続ける
  stop.addEventListener('click', async () => {
    await cur?.kill?.();
    cur?.abort?.();
  });

  box.append(bar, peek, resume, scroll, inbar);
  return box;
}

/**
 * パスのゆるい一致。サーバは `samePath()`（realpath / 大文字小文字 / 区切り）で
 * 厳密に照合しているが、ブラウザ側では realpath が出来ない。
 * ⚠️ **これを認可に使わない。** 表示上「どのペインに出すか」を決めるだけ。
 *    認可はサーバ側の allowlist が持つ。
 */
function samePathish(a, b) {
  if (typeof a !== 'string' || typeof b !== 'string') return false;
  const n = s => s.replace(/[\\/]+/g, '/').replace(/\/+$/, '').toLowerCase();
  return n(a) === n(b);
}

/* ===== checkout ===== */
// checkout の選択を worktree ごとに覚えておく。
// ⚠️ カードは毎回作り直すので、覚えないと 15 秒の自動更新で選択が先頭へ戻る。
//    書き込み操作なので「選んだ直後に更新が挟まると別ブランチに checkout する」
//    という誤爆になる（--allow-write はフックを起動する＝実質コード実行。
//    レビューで実測）。
const checkoutSel = new Map();     // wt.path -> 選択中のブランチ

function checkoutForm(wt, s) {
  const box = el('div', 'wr');
  const sel = el('select');
  // 候補は payload の localBranches だけから作る。グラフの refs から推測すると
  // remote-tracking が混ざり、checkout すると detached HEAD になる。
  const inUse = new Set(s.worktrees.map(w => w.branch).filter(Boolean));
  const cands = (s.localBranches ?? []).filter(r => r && !inUse.has(r));
  const MAX_CANDS = 40;
  for (const r of cands.slice(0, MAX_CANDS)) { const o = el('option', null, r); o.value = r; sel.append(o); }
  // 前回の選択を復元する（自動更新で先頭へ戻らないように）
  const remembered = checkoutSel.get(wt.path);
  if (remembered && cands.includes(remembered)) sel.value = remembered;
  sel.addEventListener('change', () => checkoutSel.set(wt.path, sel.value));
  const btn = el('button', null, 'checkout');
  const msg = el('span', 'wrmsg');
  if (cands.length > MAX_CANDS) {
    // 打ち切りを黙って隠さない
    msg.textContent = `候補 ${cands.length} 本のうち ${MAX_CANDS} 本を表示`;
  }
  if (!cands.length) {
    btn.disabled = true; sel.disabled = true;
    msg.textContent = '切り替え先がありません（全ブランチが使用中）';
  }
  btn.addEventListener('click', async () => {
    btn.disabled = true; msg.className = 'wrmsg'; msg.textContent = '実行中…';
    try {
      const res = await fetch('/api/v0/checkout', {
        method: 'POST',
        headers: { 'content-type': 'application/json', [session.tokenHeader]: session.token ?? '' },
        body: JSON.stringify({ worktree: wt.path, ref: sel.value }),
      });
      const d = await res.json();
      if (!res.ok) throw new Error(d.error ?? `HTTP ${res.status}`);
      // detached になったら黙って成功にしない（そのブランチは以後進まない）
      msg.textContent = d.detached
        ? `→ detached (${d.head?.slice(0, 8)}) ⚠ ${d.warning ?? ''}`
        : `→ ${d.branch ?? d.head?.slice(0, 8)}`;
      if (d.detached) msg.className = 'wrmsg bad';
      await load(true);
    } catch (e) {
      msg.className = 'wrmsg bad'; msg.textContent = e.message; btn.disabled = false;
    }
  });
  box.append(sel, btn, msg);
  return box;
}

/* ===== 差分更新 =====
   ⚠️ 走っているコンソールを壊さないため、ペインは作り直さず中身だけ差し替える。
      コンソールは worktree の集合が変わった時だけ作り直す。 */
const panes = new Map();     // id -> {p, body, ttl, tagBox, abort?, holder?}

function ensurePane(host, id, title, tags) {
  let obj = panes.get(id);
  if (!obj) {
    obj = pane(id, title, tags);
    panes.set(id, obj);
    host.append(obj.p);
  } else {
    obj.ttl.textContent = title;
    setTags(obj.tagBox, tags);
    if (obj.p.parentElement !== host) host.append(obj.p);
  }
  return obj;
}

/**
 * 不要になったペインを片付ける。
 * ⚠️ **捨てる前に必ず abort する。** 中断せずに DOM を捨てると、
 *    サーバは切断を検知できず（res.on('close') が発火しない）、
 *    子プロセスが --exec-timeout まで走り続けて実行枠を食い潰す
 *    （レビューで実測: 4回の worktree 増減で 8枠が尽きる）。
 */
function dropPanes(prefix, keepIds) {
  for (const [id, obj] of [...panes]) {
    if (!id.startsWith(prefix) || keepIds.has(id)) continue;
    try { obj.abort?.(); } catch { /* 既に終わっている */ }
    obj.p.remove();
    panes.delete(id);
  }
}

/** ホスト内のペインを望む順序に並べ替え、間にスプリッタを入れる */
function arrangeRow(host, ids) {
  // スプリッタは作り直してよい（状態を持たないので）
  for (const sp of [...host.querySelectorAll(':scope > .split')]) sp.remove();
  let first = true;
  for (const id of ids) {
    const obj = panes.get(id);
    if (!obj) continue;
    if (!first) {
      const sp = el('div', 'split x');
      host.append(sp);
      wireSplit(sp);
    }
    host.append(obj.p);        // append は既存要素を移動する
    first = false;
  }
}

function wtTags(wt) {
  const tags = [['br', wt.branch ?? wt.name]];
  if (wt.status?.dirty) tags.push(['dirty', 'dirty']);
  if (wt.prunable) tags.push(['danger', 'prunable']);
  if (wt.bare) tags.push(['', 'bare']);
  const q = wt.sequencer ?? {};
  for (const [f, l] of [['rebasing', 'rebasing'], ['merging', 'merging'],
    ['cherryPicking', 'cherry-pick'], ['reverting', 'revert'],
    ['bisecting', 'bisect'], ['sequencing', 'sequencer']]) {
    if (q[f]) tags.push(['danger', l]);
  }
  return tags;
}

/**
 * エージェントの活動。
 *
 * ⚠️ **`--watch-agents` が無いときはペインを作らない。** 空の枠を出すと
 *    「観測しているのに何も出ていない（=止まっている）」と読めてしまう。
 *    無効なときは「機能が無効」であることを1行で言う（黙って消えない）。
 * ⚠️ 出せるのはサーバが払い出したものだけ。自由文は
 *    --allow-transcript-text のときだけ text[] と recent[].command に入る
 *    （抽出は許可リスト方式。v0/transcript.mjs）。
 */
function renderAgents(s) {
  if (!s.agents) {
    dropPanes('agents', new Set());
    return;
  }
  const live = s.agents.filter(a => a.state === 'active').length;
  const tags = live ? [['', `稼働 ${live}`]] : [['', '稼働なし']];
  // ⚠️ 見出しは短くする。左カラムは狭く、`text-overflow: ellipsis` で
  //    「エージェントの活…」になって読めなかった（実測）
  const p = ensurePane($('#left'), 'agents', 'エージェント', tags);
  const box = el('div');
  box.style.padding = '.4rem';
  const wtByPath = new Map(s.worktrees.map(w => [w.path, w]));
  for (const a of s.agents) {
    // ⚠️ 差分として開けるのは base との差分にあるファイルだけ。
    //    「触った」と「差分がある」は別なので、開けないパスをリンクにしない
    //    （押しても何も起きない、という行き止まりを作らない）
    const wt = wtByPath.get(a.path);
    const openable = new Set((wt?.files ?? []).map(f => f.path));
    const d = el('div', 'ab');
    d.style.margin = '.25rem 0';
    const head = el('div');
    head.append(el('b', null, a.name));
    const label = { active: '稼働中', idle: '待機', stale: '古い記録', none: '記録なし' }[a.state] ?? a.state;
    head.append(el('span', `tag ${a.state === 'active' ? 'br' : ''}`, label));
    // ⚠️ 経過時間を必ず添える。「待機」だけでは 1分と3日を区別できない
    // ⚠️ 経過時間・権限・サブは1つの span にまとめる。別々にすると
    //    狭い画面で「/ 権限」と「auto」が別行に割れて読めなくなる（実測）
    const meta = [
      a.lastActivityAt ? when(a.lastActivityAt) : null,
      a.permissionMode ? `権限 ${a.permissionMode}` : null,
      a.sidechains ? `サブ ${a.sidechains}` : null,
    ].filter(Boolean);
    if (meta.length) head.append(el('span', 'note', ` ${meta.join(' / ')}`));
    d.append(head);
    if (a.state === 'none') {
      d.append(el('div', 'note', 'この worktree でエージェントを走らせた記録がありません。'));
      box.append(d);
      continue;
    }
    const counts = Object.entries(a.toolCounts ?? {});
    if (counts.length) {
      d.append(el('div', 'note',
        counts.map(([k, v]) => `${k} ${v}`).join(' · ')
        + (a.talk ? ` · 発話 ${a.talk}` : '')));
    }
    // ⚠️ 連続する同じ内容を畳む。`Bash` を5行並べても情報量は1行ぶんで、
    //    そのぶん**古い活動が押し出されて見えなくなる**（実測でそうなった）
    const runs = [];
    for (const r of a.recent ?? []) {
      const last = runs[runs.length - 1];
      if (last && last.tool === r.tool && last.path === r.path
          && last.outside === r.outside && last.command === r.command) {
        last.n++;
        continue;
      }
      runs.push({ ...r, n: 1 });
    }
    for (const r of runs.slice(0, 6)) {
      const line = el('div', 'ab');
      line.style.margin = '0';
      const what = r.path ?? (r.outside ? '(リポジトリ外)' : '');
      line.append(el('span', 'tag', r.n > 1 ? `${r.tool} ×${r.n}` : r.tool));
      if (what) {
        if (r.path && wt && openable.has(r.path)) {
          const link = el('span', 'f');
          link.textContent = r.path;
          link.style.display = 'inline';
          link.addEventListener('click', () => openDiff(wt, r.path));
          line.append(link);
        } else line.append(el('span', 'note', what));
      }
      if (r.sidechain) line.append(el('span', 'note', ' (サブ)'));
      if (r.command) line.append(el('div', 'note', `$ ${r.command}`));
      d.append(line);
    }
    for (const t of a.text ?? []) {
      const q = el('div', 'note');
      q.textContent = `${t.role === 'assistant' ? '◂' : '▸'} ${t.text}`;
      d.append(q);
    }
    if (a.tailOnly) d.append(el('div', 'note', `⚠ 記録の末尾 ${Math.round((a.bytesRead ?? 0) / 1024)}KB だけを読んでいます`));
    box.append(d);
  }
  // ⚠️ 何を出していないかは必ず言う（黙って省略しない）。ただし1行は短く保つ
  box.append(el('div', 'note', s.agentsText
    ? '発話とコマンド行を出しています。'
    : '発話とコマンド行は出していません。'));
  box.append(el('div', 'note',
    'ツールの結果（読んだファイルの中身・コマンド出力）は出しません。'));
  p.body.replaceChildren(box);
}

function render(s) {
  state = s;
  $('#repo').textContent = `${s.repo}   base: ${s.base}`;
  $('#at').textContent = when(s.generatedAt);

  // 警告（安全に関わるので畳めない位置）
  const alerts = $('#alerts');
  alerts.replaceChildren();
  for (const e of s.errors ?? []) {
    const d = el('div', 'alert');
    d.append(el('b', null, `${e.scope}: `), document.createTextNode(e.message));
    alerts.append(d);
  }
  for (const wt of s.worktrees) {
    for (const w of wt.warnings ?? []) {
      const d = el('div', `alert ${w.level === 'danger' ? 'danger' : ''}`);
      d.append(el('b', null, `${wt.name}: `), document.createTextNode(w.message));
      alerts.append(d);
    }
  }

  // 左: worktree カード + ファイラ
  const dirty = s.worktrees.filter(w => w.status?.dirty).length;
  const wtPane = ensurePane($('#left'), 'worktrees',
    `Worktrees ${s.worktrees.length}`, dirty ? [['dirty', `dirty ${dirty}`]] : []);
  const cards = el('div', 'cards');
  for (const wt of s.worktrees) {
    const c = el('div', 'card');
    const h = el('h3');
    h.append(el('span', null, wt.name));
    for (const [cls, text] of wtTags(wt).slice(1)) h.append(el('span', `tag ${cls}`, text));
    if (wt.branch) h.append(el('span', 'tag br', wt.branch));
    c.append(h);
    const ab = el('div', 'ab');
    ab.textContent = `+${wt.ahead} / -${wt.behind}`
      + (wt.status ? ` · 変更 ${wt.status.changed} · 未追跡 ${wt.status.untracked}` : '')
      + (wt.status?.unmerged ? ` · 未解決 ${wt.status.unmerged}` : '');
    c.append(ab);
    if (wt.prunable) c.append(el('div', 'ab', `失われています: ${wt.prunableReason ?? '理由不明'}`));
    if (session.allowWrite && !wt.bare && !wt.prunable) c.append(checkoutForm(wt, s));
    cards.append(c);
  }
  wtPane.body.replaceChildren(cards);

  // 衝突予測。「同じファイルを触っている」は代理指標なので、実際にマージしてみた結果を出す
  const conf = s.conflicts ?? [];
  const bad = conf.filter(c => !c.clean);
  const cPane = ensurePane($('#left'), 'conflicts', '衝突予測',
    bad.length ? [['danger', `${bad.length} ペア`]] : [['', conf.length ? 'なし' : '候補なし']]);
  const cBox = el('div');
  cBox.style.padding = '.4rem';
  if (!conf.length) {
    cBox.append(el('div', 'note',
      '同じファイルを触っている worktree のペアがありません。'));
  }
  for (const c of conf) {
    // clean は true / false / null（読み切れず不明）の3値
    const mark = c.clean === true ? '✔' : c.clean === false ? '✖' : '?';
    const d = el('div', c.clean === true ? 'ab' : 'alert danger');
    d.style.margin = '.2rem 0';
    d.append(el('b', null, `${mark} ${c.a} × ${c.b}`));
    if (c.clean === true) d.append(document.createTextNode(' — きれいにマージできます'));
    else if (c.clean === null) {
      d.append(document.createTextNode(
        c.truncated ? ' — 差分が大きすぎて判定できませんでした' : ' — 判定できませんでした'));
    } else for (const f of c.files) d.append(el('div', 'ab', `  ${f}`));
    cBox.append(d);
  }
  // 取り込み順序の提案（純ロジック。追加の git 呼び出しは0）
  const plan = s.mergePlan;
  if (plan && (plan.batch.length || plan.deferred.length)) {
    cBox.append(el('div', 'ab', '── 取り込み順序の提案 ──'));
    if (plan.batch.length) {
      const d = el('div', 'ab');
      d.append(el('b', null, '① まとめて取り込める: '),
        document.createTextNode(plan.batch.join(' → ')));
      d.append(el('div', 'note', '（この塊は全ペアを検査済みで、どれも衝突しません）'));
      cBox.append(d);
    }
    for (const df of plan.deferred) {
      const d = el('div', 'ab');
      d.append(el('b', null, `② 手当が必要: ${df.label}`));
      // ⚠️ deferred 同士の衝突も出す。塊との衝突だけ見せると
      //    「順に手当すれば済む」と誤読される（2周目で驚く）
      const withBatch = df.conflictsWithBatch ?? df.conflictsWith ?? [];
      const withDef = df.conflictsWithDeferred ?? [];
      if (withBatch.length) d.append(document.createTextNode(`（①の ${withBatch.join(', ')} と衝突）`));
      if (withDef.length) {
        d.append(el('div', 'ab', `  ⚠ ${withDef.join(', ')} とも衝突します（手当同士がぶつかります）`));
      }
      cBox.append(d);
    }
    for (const u of plan.unknown ?? []) {
      const d = el('div', 'ab');
      d.append(el('b', null, `③ 不明: ${u.label}`),
        document.createTextNode(`（${u.untestedWith.join(', ')} との組み合わせを検査していません）`));
      cBox.append(d);
    }
    cBox.append(el('div', 'note',
      `⚠ これは仮説です。ペア単位で衝突しないことは、まとめて衝突しないことを意味しません`
      + `（3者間で初めて起きる衝突があります）。`
      + `未検査のペアが ${plan.untestedPairs} 組あります（検査済み ${plan.testedPairs} 組）。`));
  }
  if (conf.length) {
    cBox.append(el('div', 'note',
      '⚠ 候補は「同じファイルを触っているペア」から作っています。'
      + ' rename と delete の組み合わせは別パスでも衝突しうるので、これは完全な検出ではありません。'));
  }
  cPane.body.replaceChildren(cBox);

  renderAgents(s);

  const filer = ensurePane($('#left'), 'filer', 'ファイラ（変更ファイル）', []);
  const tree = el('div', 'tree');
  for (const wt of s.worktrees) {
    tree.append(el('div', 'd', `▾ ${wt.name}`));
    if (!wt.files?.length) tree.append(el('div', 'f', '   (差分なし)'));
    for (const f of (wt.files ?? []).slice(0, 12)) {
      const d = el('div', 'f');
      d.append(el('span', 'st', f.status), document.createTextNode(f.path.split('/').pop()));
      d.title = f.path;
      d.addEventListener('click', () => openDiff(wt, f.path));
      tree.append(d);
    }
  }
  filer.body.replaceChildren(tree);

  // 中央上: 差分。
  // ⚠️ ペインの id は**序数ではなく worktree path**。序数だと払い出し順が変わった
  //    ときに「ヘッダは agent-a なのに中身は agent-b」になり、同名ファイルなら
  //    黙って別 worktree の内容に差し替わる（レビューで実測）。
  const withFiles = s.worktrees.filter(w => w.files?.length);
  const picks = withFiles.slice(0, MAX_DIFF_PANES);
  if (!picks.length && s.worktrees.length) picks.push(s.worktrees[0]);
  const diffIds = new Set(picks.map(w => `diff-${w.path}`));
  dropPanes('diff-', diffIds);
  for (const wt of picks) {
    const id = `diff-${wt.path}`;
    const obj = ensurePane($('#diffs'), id, '差分', [['br', wt.branch ?? wt.name]]);
    obj.p.dataset.wt = wt.path;
    obj.wt = wt;
    const files = (wt.files ?? []).slice(0, 6);
    const tabs = el('div', 'tabs');
    const holder = el('div');
    obj.holder = holder;         // ⚠️ DOM を後から探さない（S1: セレクタが wrap を掴んでいた）
    // 復元キーは worktree+path。path だけだと同名ファイルで別 worktree に引き継がれる
    const prev = obj.selWt === wt.path ? obj.sel : null;
    const initial = files.find(f => f.path === prev)?.path ?? files[0]?.path;
    const openIn = path => {
      for (const o of tabs.children) o.classList.toggle('on', o.title === path);
      obj.sel = path; obj.selWt = wt.path;
      loadDiff(holder, s.base, wt.branch ?? wt.head, path);
    };
    obj.openIn = openIn;
    for (const f of files) {
      const b = el('button', f.path === initial ? 'on' : null, f.path.split('/').pop());
      b.title = f.path;
      b.addEventListener('click', () => openIn(f.path));
      tabs.append(b);
    }
    if (!files.length) tabs.append(el('button', 'on', '(差分なし)'));
    const wrap = el('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;height:100%';
    wrap.append(tabs, holder);
    obj.body.replaceChildren(wrap);
    if (initial) { obj.sel = initial; obj.selWt = wt.path; loadDiff(holder, s.base, wt.branch ?? wt.head, initial); }
    else holder.append(el('div', 'note', `${wt.branch ?? wt.name} は base と同じ内容です`));
  }
  arrangeRow($('#diffs'), picks.map(w => `diff-${w.path}`));
  if (withFiles.length > MAX_DIFF_PANES) {
    $('#diffs').append(el('div', 'note',
      `他 ${withFiles.length - MAX_DIFF_PANES} 本の差分は表示していません（上限 ${MAX_DIFF_PANES}）。ファイラから開けます。`));
  }

  // 中央下: コンソール。**id 単位の差分更新**にする。
  // ⚠️ 以前は集合キー（path を | で連結）が変わると全ペインを作り直していた。
  //    worktree が1本増えると（アルファベット順で中間に挿入されるので）必ず全滅し、
  //    しかも abort していなかったので子プロセスが残った（レビューで実測）。
  const allLive = s.worktrees.filter(w => !w.bare && !w.prunable);
  const live = allLive.slice(0, MAX_CONSOLE_PANES);
  const liveIds = new Set(live.map(w => `console-${w.path}`));
  dropPanes('console-', liveIds);
  for (const wt of live) {
    const id = `console-${wt.path}`;
    const existed = panes.has(id);
    const obj = ensurePane($('#consoles'), id, wt.branch ?? wt.name, wtTags(wt).slice(1));
    // 既にあるペインは中身を作り直さない（走っている実行を壊さないため）
    if (!existed) {
      obj.body.style.display = 'flex';
      obj.body.replaceChildren(consoleBody(wt, obj));
    }
    // 走っているセッションの一覧を毎回渡す。
    // ⚠️ 別の端末や再読込の前に始めたセッションはここからしか見つけられない
    obj.showSessions?.(s.execSessions);
  }
  arrangeRow($('#consoles'), live.map(w => `console-${w.path}`));
  if (!live.length) {
    $('#consoles').append(el('div', 'empty', '実行できる worktree がありません'));
  } else if (allLive.length > MAX_CONSOLE_PANES) {
    $('#consoles').append(el('div', 'note',
      `他 ${allLive.length - MAX_CONSOLE_PANES} 本のコンソールは表示していません（上限 ${MAX_CONSOLE_PANES}）。`));
  }

  // 右: グラフ
  const g = ensurePane($('#right'), 'graph',
    '統合グラフ（全 worktree の HEAD）', [['', `${s.graph.length} commits`]]);
  const box = el('div');
  if (!s.graph.length) box.append(el('div', 'empty', 'コミットがありません'));
  for (const row of s.graph) {
    const r = el('div', 'grow');
    r.append(rowSvg(row));
    const wtc = el('div', 'wtcell');
    for (const n of row.worktrees) wtc.append(el('span', 'ref wt', `⌂ ${n}`));
    r.append(wtc);
    const rc = el('div', 'refcell');
    for (const ref of row.refs) rc.append(el('span', 'ref', ref));
    r.append(rc);
    r.append(el('div', 'subject', row.subject));
    r.title = [`${row.hash.slice(0, 8)}  ${row.subject}`,
      row.worktrees.length ? `worktree: ${row.worktrees.join(', ')}` : null,
      row.refs.length ? `refs: ${row.refs.join(', ')}` : null].filter(Boolean).join('\n');
    box.append(r);
  }
  g.body.replaceChildren(box);
}

/**
 * ファイラのクリックから差分を開く。
 * ⚠️ **その worktree のペインを探す。** 以前は最初に見つかった差分ペインへ
 *    無条件に書き込んでいたので、「ヘッダは agent-a なのに中身は agent-b」に
 *    なっていた（レビューで実測。観測ツールとして最悪の誤り）。
 *    該当ペインが無い場合は開かず、理由を出す。
 */
function openDiff(wt, path) {
  if (!state) return;
  const obj = panes.get(`diff-${wt.path}`);
  if (!obj?.openIn) {
    // 上限で表示していない worktree のファイルを押した場合
    const first = [...panes.keys()].find(id => id.startsWith('diff-'));
    const note = panes.get(first);
    if (note?.holder) {
      note.holder.replaceChildren(el('div', 'note warn',
        `${wt.branch ?? wt.name} の差分ペインは表示されていません（上限 ${MAX_DIFF_PANES}）。`
        + ' このファイルは開けません。'));
    }
    return;
  }
  obj.p.classList.remove('min');
  obj.openIn(path);
}

/* ===== 読み込み ===== */
async function load(force = false) {
  try {
    const res = await fetch(force ? '/api/v0/state?fresh=1' : '/api/v0/state');
    const s = await res.json();
    if (s.error) throw new Error(s.error);
    render(s);
  } catch (e) {
    $('#alerts').replaceChildren(el('div', 'alert danger', String(e.message || e)));
  }
}

for (const sp of document.querySelectorAll('.shell > .split')) wireSplit(sp);

try {
  const r = await fetch('/api/v0/session');
  if (r.ok) session = { ...session, ...await r.json() };
} catch { /* 観測のみで動く */ }
const cap = $('#cap');
if (session.allowExec) { cap.hidden = false; cap.className = 'cap x'; cap.textContent = '🚨 実行有効'; }
else if (session.allowWrite) { cap.hidden = false; cap.className = 'cap w'; cap.textContent = '⚠️ 書き込み有効'; }

$('#refresh').addEventListener('click', () => load(true));
await load();
// 自動更新。差分更新なので走っているコンソールは壊れない
setInterval(() => load(), 15000);
</script>
