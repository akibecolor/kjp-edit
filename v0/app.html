<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kjp-edit</title>
<!--
  統合 UI。`/` と `/layout` の両方がこれを返す。
  以前は index.html（カード + グラフ + checkout + スマホ）と
  layout-prototype.html（差分 + コンソール + 並列ペイン）に割れていて、
  機能が揃っているのに片方ずつしか使えなかった。それを1枚にしたもの。

  レイアウトは viewport で切り替える:
    広い (>1100px): [worktree + ファイラ | 差分 / コンソール | グラフ] のドック。
                    スプリッタで可変、ペインごとに最大化・最小化
    狭い (<=1100px): 縦に積む。スプリッタは消える。
                    「レイアウトの保持は諦めて縦に並べる」方針（docs/scope.md）

  ⚠️ 自動更新は**id 単位の差分更新**にすること。ペインの id は worktree の path
     （序数ではない）。以前は集合キーが変わると全ペインを作り直していたので、
     worktree が1本増えるだけで走っているコンソールが全滅し、しかも
     abort していなかったのでサーバ側の子プロセスが 600 秒残り、
     4回の増減で実行枠（8）を使い切っていた（レビューで実測）。
  ⚠️ ペインを捨てる前に必ず `abort()` する（dropPanes を通す）。
  ⚠️ **ペインの置き場所を決めるのは applyLayout だけ**（保存された配置 → 無ければ
     ensurePane に渡された既定の入れ物）。ensurePane や描画の途中で
     `host.append` を足すと、自動更新が利用者の移動を毎回巻き戻す。
     移動は `appendChild` なので走っているコンソールの購読は切れない
     （主張ではなく `render-check.mjs` が実測している）。
  ⚠️ 端末描画は requestAnimationFrame でまとめる。1件ごとに scrollHeight を
     読むと強制同期レイアウトで**総文字数に対して二次**になり、
     12,000 行で 54 秒・単一ブロック 28.9 秒（停止も更新も効かない）になった。
-->
<style>
  :root {
    --bg: #1e1e1e; --fg: #d4d4d4; --dim: #808080; --line: #333;
    --card: #252526; --head: #2d2d30; --accent: #4fc1ff;
    --danger: #f14c4c; --warn: #cca700; --ok: #4ec9b0;
    --add: #4ec9b0; --del: #f14c4c;
    --bar: 34px; --split: 6px; --row: 22px;
  }
  /* 🚨 **ライトはダークの色を流用しない。** 状態色（warn / ok / danger）は
     ダーク用に選んだ明るい色をそのまま白地に置くと**読めない**
     （実測: warn 2.31 / ok 2.04 — WCAG の大きい文字の基準 3.0 すら下回る）。
     ライト専用の値にして、実ブラウザの検査（layout-check）が**実際に描かれている色**で
     コントラスト比を測る。数字は v0/theme.mjs の MIN_CONTRAST。 */
  :root[data-theme='light'] {
    --bg: #fff; --fg: #1f1f1f; --dim: #5f5f5f; --line: #dcdcdc;
    --card: #f6f6f6; --head: #ececec; --accent: #0066bf;
    --danger: #b3261e; --warn: #7a5600; --ok: #0b6b5e;
    --add: #0a7a5e; --del: #b3261e;
  }
  /* ⚠️ 明示していないとき（data-theme=auto）だけ OS の設定に従う。
     ここを `:root` だけにすると、ダークを選んでいるのに OS がライトだと上書きされる。 */
  @media (prefers-color-scheme: light) {
    :root[data-theme='auto'] {
      --bg: #fff; --fg: #1f1f1f; --dim: #5f5f5f; --line: #dcdcdc;
      --card: #f6f6f6; --head: #ececec; --accent: #0066bf;
      --danger: #b3261e; --warn: #7a5600; --ok: #0b6b5e;
      --add: #0a7a5e; --del: #b3261e;
    }
  }
  /* ⚠️ min-width/min-height: 0 は全体に効かせる。grid/flex アイテムの既定 auto が
     中身の幅で列を押し広げ、overflow:auto を無効化する。 */
  * { box-sizing: border-box; min-width: 0; min-height: 0; }
  html, body { height: 100%; }
  /* ⚠️ flex column にする。以前は .shell の高さを calc(100% - バー) で決め打ちして
     いたので、#alerts の高さぶんがそのまま viewport の外へ押し出され、
     body が overflow:hidden なのでスクロールもできなかった
     （警告7件で下端 187px が永久に見えない。レビューで実測）。 */
  body { margin: 0; background: var(--bg); color: var(--fg); overflow: hidden;
    display: flex; flex-direction: column; height: 100%;
    font: 12px/1.5 ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace; }

  .topbar { height: var(--bar); flex: 0 0 auto; display: flex; align-items: center; gap: .6rem;
    padding: 0 .6rem; background: var(--head); border-bottom: 1px solid var(--line);
    flex-wrap: nowrap; overflow: hidden; }
  .topbar > * { flex: 0 0 auto; }
  .topbar b { font-size: 13px; }
  .topbar .path { color: var(--dim); flex: 1 1 auto; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .cap { border-radius: 3px; padding: 0 .4em; font-size: 11px; border: 1px solid; }
  .cap.w { color: var(--warn); border-color: var(--warn); }
  .cap.x { color: var(--danger); border-color: var(--danger); }
  .topbar button { font: inherit; font-size: 11px; background: var(--card); color: var(--fg);
    border: 1px solid var(--line); border-radius: 3px; padding: .2rem .5rem;
    min-height: 26px; cursor: pointer; }
  /* リポジトリの切り替え。
     🚨 **固定幅にしてはいけない。** `.topbar` は `overflow: hidden` の
        `flex-wrap: nowrap` なので、縮まない要素を1つ足すと**後ろのボタンが
        枠外へ押し出されて到達不能になる**（実測: 390px で #refresh と #reset が
        clip された。横溢れとしては検出されないので気付きにくい）。
        だから `flex: 0 1 auto` + `min-width: 0` で**縮む側**に置く。 */
  .topbar select { font: inherit; font-size: 11px; background: var(--card); color: var(--fg);
    border: 1px solid var(--line); border-radius: 3px; padding: .2rem .3rem;
    min-height: 26px; max-width: 40vw; flex: 0 1 auto; min-width: 0; }

  /* 安全に関わる警告は畳めない位置に置く */
  #alerts:empty { display: none; }
  #alerts { flex: 0 0 auto; max-height: 22vh; overflow: auto;
    border-bottom: 1px solid var(--line); background: var(--bg); }
  .alert { border-left: 3px solid var(--warn); padding: .3rem .6rem; margin: .2rem .4rem;
    background: var(--card); font-size: 12px; overflow-wrap: anywhere; }
  .alert.danger { border-left-color: var(--danger); }

  .shell { flex: 1 1 auto; min-height: 0; display: flex; }
  .col, .row { display: flex; }
  .col { flex-direction: column; }
  .row { flex-direction: row; }
  #left { flex: 0 0 230px; }
  #center { flex: 1 1 auto; flex-direction: column; }
  #right { flex: 0 0 430px; }
  #diffs { flex: 1 1 58%; }
  #consoles { flex: 1 1 42%; }

  /* 🚨 グリッド配置（#57）。`?grid=1` のときだけ効く。
     入れ物を display:contents にして、ペインを #shell のグリッドの直下扱いにする
     （**親を変えないので scrollTop が飛ばない**。#46 の再発を防ぐ要件）。 */
  .shell.gridmode { display: grid; gap: 4px; padding: 2px; }
  .shell.gridmode > #left, .shell.gridmode > #right,
  .shell.gridmode > #center, .shell.gridmode #diffs, .shell.gridmode #consoles {
    display: contents; }
  .shell.gridmode > .split, .shell.gridmode .split { display: none; }
  .shell.gridmode .pane { margin: 0; min-width: 0; min-height: 0; }
  /* 入り切らないペイン（溢れ）。**消さずに畳んで、告知で件数を出す** */
  .shell.gridmode .pane.overflowed { display: none; }
  /* ⚠️ グリッドの子には `flex` が効かない（`.pane.min { flex: 0 0 auto }` が無効）。
     最小化はセルの上端に寄せて高さを内容（ヘッダだけ）にする。 */
  .shell.gridmode .pane.min { align-self: start; }
  /* 最大化は position:fixed なのでグリッドでもそのまま効く（座標は無視される） */
  /* 🚨 **帯は縮ませない。** `flex-shrink` の既定は 1 なので、縦が詰まると
     0 まで潰れて**ボタンが見えなくなる**（実機で「レイアウトのボタンが隠れる」）。
     `#alerts` と同じ `flex: 0 0 auto` にする。 */
  .bar { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: .3rem; align-items: center;
    padding: .25rem .5rem; background: var(--head); border-bottom: 1px solid var(--line);
    font-size: 12px; }
  .bar:empty { display: none; }
  /* 🚨 **配置のボタンは大きさを揃える（利用者の指摘。2026-08-09）。**
     以前はラベルの字種が混在（`1枚` / `2×2`）していたので**幅が揃わず**、
     漢字の行だけ**縦位置もずれて**いた。ラベルは `行×列` に統一したうえで、
     ここで大きさも固定する:
       - `inline-flex` + 中央揃えで、字種が変わっても**縦位置が動かない**
         （line-height の解釈は字種で変わるので、行の高さに頼らない）
       - `tabular-nums` で数字の幅を揃える
       - `min-width` で最も広いラベルに合わせる
     ⚠️ 揃えたと主張するなら測る: layout-check が**全ボタンの幅・高さ・上端**が
        同じであることを実ブラウザで見る。 */
  #gridbar button { min-width: 3.2rem; height: 1.6rem; padding: 0 .4rem;
    display: inline-flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums; line-height: 1; }
  .split { flex: 0 0 var(--split); position: relative; }
  .split::after { content: ''; position: absolute; inset: 0; background: var(--line); }
  .split:hover::after, .split.dragging::after { background: var(--accent); }
  .split.x { cursor: col-resize; } .split.y { cursor: row-resize; }
  .split.x::after { left: 2px; right: 2px; } .split.y::after { top: 2px; bottom: 2px; }

  .pane { display: flex; flex-direction: column; background: var(--card);
    border: 1px solid var(--line); border-radius: 3px; overflow: hidden;
    flex: 1 1 auto; margin: 2px; }
  /* ⚠️ `touch-action: none` が無いとタッチでは並び替えができない。
     ブラウザがスクロールを始めた瞬間に pointercancel が飛び、pointermove が
     1回も来ないまま終わる（スマホから使う前提なので、ここは譲れない）。
     ヘッダは細い帯なので、スクロールの起点として失う面積は小さい。 */
  .pane > header { display: flex; align-items: center; gap: .3rem; flex: 0 0 auto;
    padding: .25rem .45rem; background: var(--head); border-bottom: 1px solid var(--line);
    font-size: 11px; white-space: nowrap; cursor: grab; touch-action: none;
    /* 🚨 **掴んでも動かず「文字選択」になっていた（実機で指摘）。**
       マウスでは pointerdown の既定動作が選択の開始なので、`touch-action` だけでは
       止まらない（あれはタッチのスクロール用）。ヘッダは掴む場所なので選択させない。
       ⚠️ 合成の pointer 事象では選択が起きないので、`--layout-probe` では再現できない。
          **CDP の入力層（`v0/input-check.mjs`）でなら測れる** — 変異
          `header-drag-selects-text` がこれと `preventDefault()` の**2枚を同時に**外して
          落ちることを確認済み（片方だけでは差が出ない）。 */
    user-select: none; -webkit-user-select: none; }
  /* ⚠️ タイトルは縮む側、タグとボタンは縮まない側。分けないと狭いペインで
     タグがタイトル文字に重なって読めなくなる。 */
  .pane > header .ttl { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
  .pane > header .grow { flex: 1 1 auto; }
  .pane > header .tag { flex: 0 0 auto; }
  .pane > header button { font: inherit; background: transparent; color: var(--dim);
    border: 0; cursor: pointer; padding: 0 .3rem; border-radius: 2px;
    flex: 0 0 auto; white-space: nowrap; min-height: 22px; }
  .pane > header button:hover { color: var(--fg); background: rgba(127,127,127,.2); }
  .pane > .body { flex: 1 1 auto; overflow: auto; }
  .pane.max { position: fixed; inset: var(--bar) 0 0 0; z-index: 50; margin: 0; border-radius: 0; }
  .pane.min { flex: 0 0 auto; }
  .pane.min > .body { display: none; }
  /* 掴んでいるペイン。⚠️ `pointer-events: none` は使わない。落とす先は
     elementFromPoint ではなく入れ物の矩形から決めているので不要で、
     付けると掴んでいるヘッダ自身がイベントを受け取れなくなる。 */
  .pane.dragging { opacity: .55; }
  .pane.dragging > header { cursor: grabbing; }

  .tag { border: 1px solid var(--line); border-radius: 3px; padding: 0 .3em;
    color: var(--dim); font-size: 10px; }
  .tag.br { color: var(--accent); border-color: var(--accent); }
  .tag.dirty { color: var(--warn); border-color: var(--warn); }
  .tag.danger { color: var(--danger); border-color: var(--danger); }

  /* worktree カード */
  .cards { display: grid; gap: .4rem; padding: .4rem; }
  .card { background: var(--bg); border: 1px solid var(--line); border-radius: 3px;
    padding: .4rem .5rem; }
  .card h3 { margin: 0 0 .25rem; font-size: 12px; display: flex; gap: .3rem;
    align-items: center; flex-wrap: wrap; }
  .ab { color: var(--dim); font-size: 11px; overflow-wrap: anywhere; }
  .ab b { color: var(--fg); font-weight: 600; }
  .wr { display: flex; gap: .25rem; align-items: center; margin-top: .3rem; flex-wrap: wrap; }
  .wr select { font: inherit; font-size: 11px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 3px; max-width: 10rem; }
  .wr button { font: inherit; font-size: 11px; padding: .1rem .5rem; background: var(--card);
    color: var(--fg); border: 1px solid var(--line); border-radius: 3px;
    cursor: pointer; flex: 0 0 auto; white-space: nowrap; }
  .wrmsg { font-size: 11px; color: var(--dim); overflow-wrap: anywhere; }
  .wrmsg.bad { color: var(--danger); }

  /* ファイラ */
  .tree { padding: .3rem 0; }
  .tree div { padding: .05rem .5rem; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .tree .d { color: var(--fg); }
  .tree .f { color: var(--dim); cursor: pointer; }
  .tree .f:hover { background: rgba(127,127,127,.15); }
  .tree .st { color: var(--accent); display: inline-block; width: 1.1em; }

  /* 差分 */
  .tabs { display: flex; flex: 0 0 auto; background: var(--head);
    border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs button { font: inherit; font-size: 11px; background: transparent; border: 0;
    border-right: 1px solid var(--line); color: var(--dim);
    padding: .2rem .5rem; cursor: pointer; white-space: nowrap; }
  .tabs button.on { background: var(--card); color: var(--fg); }
  .diff { white-space: pre; font-size: 12px; }
  .diff div { padding: 0 .5rem; }
  .diff .h { color: var(--dim); background: rgba(127,127,127,.10); }
  .diff .hunk { color: var(--accent); background: rgba(79,193,255,.08); }
  /* 🚨 **直値にしない。** ここだけ変数を使わず、ライト用の上書きを
     `@media (prefers-color-scheme: light)` に置いていたので、
     **OS がダークのままライトを選ぶと差分だけダーク用の色が残った**
     （`#4ec9b0` は白地でコントラスト 2.04 = 読めない）。
     切り替えが効いているように見えて一部だけ嘘になる形。
     背景の rgba は半透明なのでどちらでも成立する（色相だけ変数に寄せる）。 */
  .diff .add { color: var(--add); background: rgba(78,201,176,.10); }
  .diff .del { color: var(--del); background: rgba(241,76,76,.10); }
  /* 最小エディタ（--allow-write の枠内）。
     ⚠️ soft wrap のままにする（`white-space: pre` にすると狭い画面で
        横スクロールが必要になり、スマホから読めなくなる）。 */
  textarea.edit { flex: 1 1 auto; min-height: 6rem; width: 100%; resize: none;
    font: inherit; font-size: 12px; background: var(--bg); color: var(--fg);
    border: 0; border-top: 1px solid var(--line); padding: .3rem .5rem; }
  .editdiff { flex: 0 1 45%; overflow: auto; border-top: 1px solid var(--line); }

  /* 全文ビューア。差分と同じペインをタブで切り替える */
  .viewbar { display: flex; gap: .25rem; padding: .2rem .3rem; flex: 0 0 auto;
    align-items: center; flex-wrap: wrap;
    background: var(--head); border-bottom: 1px solid var(--line); }
  /* ボタンは縮ませない（狭いと「差/分」と縦に割れて読めなくなる。cmdbar と同じ理由） */
  .viewbar button { font: inherit; font-size: 11px; padding: .1rem .5rem; background: var(--card);
    color: var(--fg); border: 1px solid var(--line); border-radius: 3px;
    cursor: pointer; flex: 0 0 auto; white-space: nowrap; }
  .viewbar button.on { color: var(--accent); border-color: var(--accent); }
  .viewbar select { font: inherit; font-size: 11px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 3px; max-width: 9rem; flex: 0 1 auto; }
  .viewbar .lbl { color: var(--dim); font-size: 10px; flex: 0 0 auto; }
  .blob { white-space: pre; font-size: 12px; }
  .blob .bl { padding: 0 .5rem; }
  /* 行番号はコピーの対象から外す（選択すると本文に行番号が混ざる） */
  .blob .ln { display: inline-block; min-width: 3.5em; text-align: right; padding-right: .7em;
    color: var(--dim); user-select: none; -webkit-user-select: none; }

  /* ⚠️ overflow-wrap が無いと `--allow-transcript-text` のような長い語で
     行が箱より広くなり、狭い画面で**注意書き自体が読めなくなる**（実測）。
     省略の告知が読めないのは、告知が無いのと同じ。 */
  .note { color: var(--dim); padding: .5rem; font-size: 11px; overflow-wrap: anywhere; }
  .note.warn { color: var(--warn); }

  /* コンソール */
  .cmdbar { display: flex; gap: .25rem; padding: .25rem .3rem; flex: 0 0 auto;
    border-bottom: 1px solid var(--line); background: var(--head);
    align-items: center; flex-wrap: wrap; }
  .cmdbar input { flex: 1 1 7rem; font: inherit; font-size: 11px; background: var(--bg);
    color: var(--fg); border: 1px solid var(--line); border-radius: 3px; padding: .15rem .3rem; }
  .cmdbar select { flex: 0 1 auto; max-width: 9rem; font: inherit; font-size: 11px;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 3px; }
  /* ボタンは縮ませない。狭いと「実/行」と縦に割れて読めなくなる */
  .cmdbar button { font: inherit; font-size: 11px; padding: .1rem .45rem; background: var(--card);
    color: var(--fg); border: 1px solid var(--line); border-radius: 3px;
    cursor: pointer; flex: 0 0 auto; white-space: nowrap; }
  .cmdbar button:disabled { color: var(--dim); cursor: default; }
  .argvpeek { color: var(--dim); font-size: 10px; padding: .1rem .5rem; flex: 0 0 auto;
    border-bottom: 1px dashed var(--line); overflow-wrap: anywhere; }
  .argvpeek.bad { color: var(--danger); }
  .term { padding: .3rem .5rem; white-space: pre-wrap; word-break: break-word;
    font-size: 11px; line-height: 1.45; }
  .term .p { color: var(--ok); } .term .w { color: var(--warn); }
  .term .e { color: var(--danger); } .term .d { color: var(--dim); }
  /* 自分が送った行。出力と混ざると「誰が言ったか」が読めなくなる */
  .term .i { color: var(--accent); }

  /* 🚨 `hidden` 属性を作者スタイルで上書きしないための保険。
     `.cmdbar { display: flex }` のような規則は UA の `[hidden]{display:none}` に
     **勝つ**ので、`el.hidden = true` にしても消えない。
     実際に「送れないのに入力欄が出ている（押しても無反応）」状態を作った。 */
  [hidden] { display: none !important; }

  /* グラフ */
  .grow { display: grid; grid-template-columns: auto auto auto 1fr;
    align-items: center; height: var(--row); gap: .35rem; }
  .grow:hover { background: rgba(127,127,127,.12); }
  .grow svg { display: block; }
  /* ⚠️ バッジを .subject の中に入れてはいけない。overflow:hidden で
     クリップされ、狭い画面で**完全に見えなくなる**（横スクロールでも到達できない）。 */
  .wtcell, .refcell { display: flex; gap: .2rem; align-items: center;
    overflow: hidden; white-space: nowrap; }
  .subject { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* ⚠️ flex-shrink させない。ref が多いコミットで**全部 8px に潰れて
     0〜1文字しか読めなくなる**（レビューで51個を実測）。

function wireSplit(sp) {
  const dir = sp.classList.contains('x') ? 'x' : 'y';
  sp.addEventListener('pointerdown', e => {
    const prev = sp.previousElementSibling, next = sp.nextElementSibling;
    if (!prev || !next) return;
    e.preventDefault();
    sp.classList.add('dragging');
    sp.setPointerCapture(e.pointerId);
    const at = ev => (dir === 'x' ? ev.clientX : ev.clientY);
    const size = n => (dir === 'x'
      ? n.getBoundingClientRect().width : n.getBoundingClientRect().height);
    const start = at(e), p0 = size(prev), n0 = size(next), MIN = 60;
    const move = ev => {
      let d = at(ev) - start;
      d = Math.max(-(p0 - MIN), Math.min(n0 - MIN, d));
      prev.style.flex = `0 0 ${p0 + d}px`;
      next.style.flex = `0 0 ${n0 - d}px`;
    };
    const up = () => {
      sp.classList.remove('dragging');
      sp.removeEventListener('pointermove', move);
      sp.removeEventListener('pointerup', up);
      sp.removeEventListener('pointercancel', up);
    };
    sp.addEventListener('pointermove', move);
    sp.addEventListener('pointerup', up);
    sp.addEventListener('pointercancel', up);
  });
}

      host.insertBefore(sp, want[i]);
      wireSplit(sp);

  const trailing = [...host.children].filter(n => !n.classList.contains('pane'));

      host.append(sp);
      wireSplit(sp);

    if (host.lastElementChild !== obj || trailing.length) host.append(obj);

  for (const h of PANE_HOSTS) {
    const ids = byHost.get(h);
    // 🚨 既定の並びは「作った順」ではなく「**render が求めた順**」。
    //    worktree はアルファベット順で**中間に**挿入されるので、作った順だと
    //    後から増えた1本が必ず末尾に付く（以前 arrangeRow が毎回並べ直していた
    //    のはこのため。消したときに既定の並びが壊れる形で気付いた）。
    ids.sort((a, b) => panes.get(a).defaultRank - panes.get(b).defaultRank);
    placePanes(hostEl(h), orderedIds(paneLayout, h, ids));
  }
}

// ⚠️ ensurePane ごとに applyLayout を呼ぶと、1回の描画でペイン本数の二乗だけ
//    DOM を動かす。増減があった描画の**直後に1度だけ**走らせる。
let layoutQueued = false;
function scheduleLayout() {
  if (layoutQueued) return;
  layoutQueued = true;
  queueMicrotask(() => { layoutQueued = false; applyLayout(); });
}

// これ未満の移動はドラッグではなくクリック（ヘッダの開閉）として扱う
const DRAG_SLOP = 6;

/**
 * 座標がどの入れ物の上か。
 *
 * ⚠️ **`elementFromPoint` を使わない。** 掴んでいるペイン自身が最前面に写るし、
 *    狭い画面では入れ物が縦に積まれて viewport の外まで伸びるので、
 *    画面外の座標では null が返って移動できなくなる。矩形なら画面外も測れる。
 */
function hostAt(x, y) {
  for (const h of PANE_HOSTS) {
    const host = hostEl(h);
    const r = host.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return host;
  }
  return null;
}

/**
 * 座標がどのセルか（グリッドのとき）。
 *
 * ⚠️ セルは等分（列幅の調整はしない設計）なので、矩形を割るだけで求まる。
 *    範囲外は端に丸める（画面の外へドラッグしても落とせるように）。
 */
function cellFromPoint(x, y) {
  const shell = document.getElementById('shell');
  if (!shell) return null;
  const r = shell.getBoundingClientRect();
  if (r.width <= 0 || r.height <= 0) return null;
  const clamp = (n, hi) => Math.min(hi, Math.max(1, n));
  return {
    col: clamp(Math.floor((x - r.left) / (r.width / paneGrid.cols)) + 1, paneGrid.cols),
    row: clamp(Math.floor((y - r.top) / (r.height / paneGrid.rows)) + 1, paneGrid.rows),
  };
}

/** 落とす先（入れ物と、その手前に挿すペイン）。中点を越えたら後ろに回る */
function dropSpot(dragged, x, y) {
  const host = hostAt(x, y);
  if (!host) return null;
  // ⚠️ 軸は入れ物の id ではなく実際の flex-direction で決める。
  //    狭い画面の media query では `.row` も column になる（横に並んでいない）。
  const vertical = getComputedStyle(host).flexDirection.startsWith('column');
  for (const k of host.children) {
    if (!k.classList.contains('pane') || k === dragged) continue;
    const r = k.getBoundingClientRect();
    const mid = vertical ? r.top + r.height / 2 : r.left + r.width / 2;
    if ((vertical ? y : x) < mid) return { host, before: k };
  }
  return { host, before: null };
}

function commitMove(p, spot) {
  const ids = [];
  for (const k of spot.host.children) {
    if (k.classList.contains('pane') && k !== p) ids.push(k.dataset.paneId);
  }
  const at = spot.before ? ids.indexOf(spot.before.dataset.paneId) : ids.length;
  ids.splice(at, 0, p.dataset.paneId);
  paneLayout = setHostOrder(paneLayout, spot.host.id, ids);
  applyLayout();
}

/**
 * ヘッダを掴んでペインを並び替える。マウスとタッチの両方（Pointer Events）。
 *
 * ⚠️ ヘッダのクリック（開閉）と取り違えないため、しきい値を越えるまで何もしない。
 *    越えたら直後の click を1回だけ捨てる（並べ替えるたびに畳まれてしまう）。
 */
function wireDrag(p, h, drag, skip) {
  h.addEventListener('pointerdown', e => {
    // 🚨 **ヘッダのボタンではドラッグを始めない。** 掴む（setPointerCapture）と
    //    以降のポインタ事象がヘッダに再ターゲットされ、**ボタンの click が飛ばない**。
    //    以前は `skip`（=[bmin, bmax]）で数えていたので、後から足した × と
    //    結合のボタンが**実際の指・マウスでは無反応**だった
    //    （検査は `.click()` を直接呼ぶので、この壊れ方が見えなかった）。
    //    **一覧を数えるのをやめて、ボタン全部を仕組みで除く。**
    if (e.target?.closest?.('button')) return;
    if (skip.includes(e.target)) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    // 最大化中は画面全面なので、落とす先を選べない
    if (p.classList.contains('max')) return;
    drag.moved = false;
    drag.movedCell = false;
    // ⚠️ 既定動作（テキスト選択の開始）を止める。ボタンは上で return しているので
    //    ここに来るのは「掴んだ」場合だけ = click を妨げない。
    e.preventDefault();
    const x0 = e.clientX, y0 = e.clientY;
    let started = false, last = '';
    // ⚠️ 合成イベント（`--layout-probe` の検査）には対応する実ポインタが無いので
    //    setPointerCapture は NotFoundError を投げる。実ポインタではペインの外に
    //    出ても pointermove / pointerup が届くように掴むが、掴めなかった場合も
    //    ヘッダ上のイベントで並び替えは動く。
    try { h.setPointerCapture(e.pointerId); } catch { /* 実ポインタが無い */ }
    const move = ev => {
      if (!started) {
        if (Math.abs(ev.clientX - x0) < DRAG_SLOP
          && Math.abs(ev.clientY - y0) < DRAG_SLOP) return;
        started = true;
        drag.moved = true;
        p.classList.add('dragging');
      }
      // 🚨 **グリッドではセル座標へ動かす（#57）。**
      //    ドラッグは v1 の「入れ物の並び」を書き換える作りだったので、
      //    座標で描くグリッドには**何も反映されなかった**（実機で指摘された）。
      if (gridMode) {
        const c = cellFromPoint(ev.clientX, ev.clientY);
        if (!c) return;
        // 🚨 **未配置なら先に置く。** 結合（▭→）で踏んだのと同じ穴。
        //    座標が無いと moveCell が「配置されていません」で断り、
        //    ドラッグ中は理由も出さないので**完全に無反応**になる
        //    （実機で「掴めるが移動できない」）。
        if (!cellOf(paneGrid, p.dataset.paneId)) {
          const ids = [...panes.keys()]
            .sort((a, b) => panes.get(a).defaultRank - panes.get(b).defaultRank);
          paneGrid = autoPlace(paneGrid, ids).grid;
        }
        const gkey = `${c.col},${c.row}`;
        if (gkey === last) return;
        last = gkey;
        const r = moveCell(paneGrid, p.dataset.paneId, c);
        // ⚠️ 断られたら黙って動かさない（ドラッグ中に理由を出すと連打で埋まる）。
        //    「動かない」ことが手応えになる。理由が要る操作はボタン側で出す。
        if (!r.ok) return;
        paneGrid = r.grid;
        drag.movedCell = true;
        saveGrid();
        applyGridLayout();
        return;
      }
      const spot = dropSpot(p, ev.clientX, ev.clientY);
      if (!spot) return;
      const key = `${spot.host.id}|${spot.before?.dataset.paneId ?? ''}`;
      if (key === last) return;   // 同じ位置で置き直しを繰り返さない
      last = key;
      commitMove(p, spot);
    };
    const end = () => {
      // ⚠️ 何も動かなかったことを終了時に1度だけ告げる（ドラッグ中に出すと連打で埋まる。
      //    「掴めるのに何も起きない」を黙って終わらせない）
      if (gridMode && started && !drag.movedCell) {
        gridNote('そこには置けません（大きさが違うペインが居ます）');
      }
      h.removeEventListener('pointermove', move);
      h.removeEventListener('pointerup', end);
      h.removeEventListener('pointercancel', end);
      if (!started) return;
      p.classList.remove('dragging');
      saveLayout();
    };
    h.addEventListener('pointermove', move);
    h.addEventListener('pointerup', end);
    h.addEventListener('pointercancel', end);
  });
}

/** ペインを作る。ヘッダのクリックで開閉、⛶ で最大化、ヘッダを掴むと並び替え。 */
function pane(id, title, tags = []) {
  const p = el('div', 'pane');
  p.dataset.paneId = id;
  const h = el('header');
  const ttl = el('span', 'ttl', title);
  const tagBox = el('span', 'tags');
  tagBox.style.display = 'flex';
  tagBox.style.gap = '.3rem';
  for (const [cls, text] of tags) tagBox.append(el('span', `tag ${cls}`, text));
  const bmin = el('button', null, '–'); bmin.title = '最小化';
  const bmax = el('button', null, '⛶'); bmax.title = '最大化';
  // 🚨 **閉じる（#57）。** 今まで「畳む」しか無く、要らないペインが場所を取り続けた。
  //    ⚠️ 文言を混同しない: これは**見るのをやめる**だけで、走っている実行は止まらない
  //    （#17。止めるのは監視盤の「停止」）。title でそう言う。
  // 🚨 結合（#57）。**グリッドのときだけ出す**（入れ物モデルでは意味が無いので、
  //    押せるのに何も起きないボタンを作らない）。
  const bwide = el('button', null, '▭→'); bwide.title = '右のセルと結合';
  const btall = el('button', null, '▭↓'); btall.title = '下のセルと結合';
  const bunit = el('button', null, '▭×'); bunit.title = '結合を解く（1セルに戻す）';
  // 🚨 グリッドでないときは**作らない**（hidden に頼ると、作者スタイルに負けて
  //    「押せるのに何も起きないボタン」になる。CLAUDE.md の既知の罠）。
  const mergeBtns = gridMode ? [bwide, btall, bunit] : [];
  bwide.addEventListener('click', ev => { ev.stopPropagation(); mergePane(id, 'right'); });
  btall.addEventListener('click', ev => { ev.stopPropagation(); mergePane(id, 'down'); });
  bunit.addEventListener('click', ev => { ev.stopPropagation(); mergePane(id, 'split'); });
  const bclose = el('button', null, '×');
  bclose.title = '閉じる（実行は止まりません。監視盤から戻せます）';
  h.append(ttl, el('span', 'grow'), tagBox, ...mergeBtns, bmin, bmax, bclose);
  const body = el('div', 'body');
  p.append(h, body);

  // ⚠️ ドラッグで動かした直後の click で開閉すると、並べ替えるたびに畳まれる。
  //    掴んだ時点で false に戻すので、click が来ないまま終わっても次は効く。
  const drag = { moved: false };
  bclose.addEventListener('click', ev => {
    ev.stopPropagation();
    closePane(id);
  });
  h.addEventListener('click', ev => {
    if (ev.target === bmin || ev.target === bmax || ev.target === bclose
      || ev.target === bwide || ev.target === btall || ev.target === bunit) return;
    if (drag.moved) { drag.moved = false; return; }
    p.classList.toggle('min');
  });
  wireDrag(p, h, drag, [bmin, bmax]);
  bmin.addEventListener('click', ev => { ev.stopPropagation(); p.classList.toggle('min'); });
  bmax.addEventListener('click', ev => {
    ev.stopPropagation();
    const was = p.classList.contains('max');
    for (const o of document.querySelectorAll('.pane.max')) o.classList.remove('max');
    if (!was) p.classList.add('max');
  });
  return { p, body, ttl, tagBox };
}

/**
 * 🚨 **ペインを閉じる（#57）。**
 *
 * ⚠️ **閉じたことを覚える。** 覚えないと 15 秒ごとの更新で戻ってくる
 *    （利用者の操作を巻き戻すのは、このリポジトリで何度も踏んだ型）。
 * ⚠️ **購読は切るが、実行は止まらない**（#17）。切断と停止を混同しないこと。
 *    走っているセッションは監視盤に残り、そこから停止できる。
 */
function closePane(id) {
  const obj = panes.get(id);
  if (obj) {
    try { obj.abort?.(); } catch { /* 既に終わっている */ }
    obj.p.remove();
    panes.delete(id);
  }
  paneLayout = hidePane(paneLayout, id);
  saveLayout();
  renderClosedList();
  scheduleLayout();
}

/** 閉じたペインを開き直す（次の描画で作られる） */
function reopenPane(id) {
  paneLayout = showPane(paneLayout, id);
  saveLayout();
  renderClosedList();
  // 次の描画を待たずに出す（押した手応えが無いと壊れて見える）
  load(true).catch(() => { /* 失敗は render 側が出す */ });
}

/**
 * 🚨 **パターンの切り替えと、入り切らないペインの告知（#57）。**
 *
 * ⚠️ **溢れを黙って消さない。** 「他 N 本は表示していません」を必ず出し、
 *    どうすれば見られるか（形を広げる / 閉じる）も書く。
 *    件数だけ出して直し方を書かないと、消えた理由が分からない。
 */
/**
 * 配置の操作の結果を帯に出す（押しても何も起きないのが一番分からない）。
 *
 * ⚠️ `#alerts`（安全に関わる警告）には混ぜない。混ぜると本当の警告が埋もれる。
 */
function gridNote(text) {
  const box = $('#gridbar');
  if (!box) return;
  box.hidden = false;
  const old = box.querySelector('.gridnote');
  if (old) old.remove();
  const n = el('span', 'note warn gridnote', `  ${text}`);
  box.append(n);
}

function renderGridBar(overflow) {
  // 検査から内部状態を覗く口（?probe=1 のときだけ）
  if (window.__kjpProbe) window.__kjpGrid = () => JSON.parse(JSON.stringify(paneGrid));

  const box = $('#gridbar');
  if (!box || !gridMode) return;
  box.hidden = false;
  box.replaceChildren();
  box.append(el('b', null, '配置'));
  const cur = presetOf(paneGrid);
  for (const pre of GRID_PRESETS) {
    const b = el('button', pre.name === cur ? 'on' : null, pre.label);
    b.title = `${pre.rows} 行 × ${pre.cols} 列にする`;
    b.addEventListener('click', () => setPreset(pre.name));
    box.append(b);
  }
  if (overflow?.length) {
    box.append(el('span', 'note warn',
      `⚠ 他 ${overflow.length} 本は表示していません（配置を広げるか、要らないものを × で閉じてください）`));
  }
}

/**
 * パターンを当てる。
 *
 * ⚠️ **結合を解いたことは黙らない**（広げたはずのペインが1セルに戻るので）。
 */
function setPreset(name) {
  const ids = [...panes.keys()]
    .sort((a, b) => panes.get(a).defaultRank - panes.get(b).defaultRank);
  const r = applyPreset(paneGrid, name, ids);
  paneGrid = r.grid;
  saveGrid();
  applyGridLayout();
  if (r.unmerged) {
    // ⚠️ **黙って解かない。** 帯に出す（stickyAlerts は「操作の結果」用で、
    //    配置の話をそこに混ぜると本当の警告が埋もれる）
    gridNote(`広げていた ${r.unmerged} 枚を1セルに戻しました（配置を ${name} にしたため）`);
  }
}

/**
 * 結合（隣を占める）／解く。
 *
 * ⚠️ 断られた理由をそのまま出す（押しても何も起きないのが一番分からない）。
 */
function mergePane(id, dir) {
  // 🚨 **配置が無いなら先に置く。** ここが無いと「そのペインは配置されていません」で
  //    黙って終わる（実機で「隣を消しても広がらない」= この経路だった）。
  //    配置は applyGridLayout が作るが、押した時点で未配置のことがある。
  if (!cellOf(paneGrid, id)) {
    const ids = [...panes.keys()].sort((a, b) => panes.get(a).defaultRank - panes.get(b).defaultRank);
    paneGrid = autoPlace(paneGrid, ids).grid;
  }
  const r = dir === 'split' ? splitCell(paneGrid, id) : mergeCell(paneGrid, id, dir);
  if (!r.ok) { gridNote(`広げられません: ${r.why}`); return; }
  if (r.displaced?.length) {
    gridNote(`${r.displaced.length} 枚を空きに移しました（入り切らない分は下に出ます）`);
  }
  paneGrid = r.grid;
  saveGrid();
  applyGridLayout();
}

/**
 * 🚨 **閉じたものを一覧に出す（#57）。**
 *
 *    出さないと「閉じたら二度と開けない」= 閉じるのが危険な操作になる。
 *    CLAUDE.md「表示上限で省略したら必ず告知する」と同じ根拠
 *    （見えないものの存在を黙らせない）。
 */
function renderClosedList() {
  if (window.__kjpProbe) {
    window.__kjpClosed = () => [...(paneLayout.closed ?? [])];
  }
  const box = $('#closed');
  if (!box) return;
  const ids = [...(paneLayout.closed ?? [])];
  box.replaceChildren();
  if (!ids.length) { box.hidden = true; return; }
  box.hidden = false;
  box.append(el('span', 'note', `閉じたペイン ${ids.length}:`));
  for (const id of ids.slice(0, 8)) {
    const b = el('button', null, paneTitleOf(id));
    b.title = `${id} を開く`;
    b.addEventListener('click', () => reopenPane(id));
    box.append(b);
  }
  if (ids.length > 8) {
    box.append(el('span', 'note', `…他 ${ids.length - 8} 件`));
  }
}

/**
 * 閉じたペインのボタンに出す名前。
 *
 * ⚠️ id は `console-<絶対パス>` のような長い文字列なので、そのまま出すと
 *    ボタンが画面幅を超える（スマホで押せない）。**種別 + basename** にする。
 */
function paneTitleOf(id) {
  const kind = id.startsWith('console-') ? 'コンソール'
    : id.startsWith('diff-') ? '差分'
    : id === 'monitor' ? 'セッション監視'
    : id === 'agents' ? 'エージェント'
    : id === 'worktrees' ? 'worktree'
    : id === 'graph' ? 'グラフ' : id;
  const rest = id.replace(/^(console|diff)-/, '');
  if (rest === id) return kind;
  const name = rest.split(/[\\/]/).filter(Boolean).pop() ?? rest;
  return `${kind}: ${name}`;
}

/**
 * 閉じているペインの代わりに渡す「捨てる先」（#57）。
 *
 * ⚠️ `render(s)` の中では early return できない（後続の描画を全部落とす）。
 *    ここに書いた DOM はどこにも append されないので画面に出ない。
 *    購読や取得は呼び出し側が別に守る（監視盤は early return している）。
 */
/** 閉じているなら「捨てる先」を返す */
function ghostOr(obj) { return obj ?? ghostPane(); }

function ghostPane() {
  return { p: el('div'), body: el('div'), ttl: el('span'), tagBox: el('span'),
    defaultHost: '', defaultRank: 0 };
}

function setTags(tagBox, tags) {
  tagBox.replaceChildren();
  for (const [cls, text] of tags) tagBox.append(el('span', `tag ${cls}`, text));
}

// ---------------------------------------------------------------------------
// 配色（自動 / ライト / ダーク）
//
// ⚠️ **判定は `theme.mjs`（純関数）。** ここに書くとテストできないので、
//    「切り替わる」「覚える」という宣言が破れても気付けない。
// 🚨 **`data-theme` を必ず置く。** CSS 側は
//    `:root[data-theme='auto']` のときだけ OS の設定に従う形なので、
//    属性が無いと**ライトを選んでも当たらない**（ダーク固定に見える）。
// ---------------------------------------------------------------------------
const THEME_KEY = 'kjp.theme';
const prefersDark = () => window.matchMedia
  && window.matchMedia('(prefers-color-scheme: dark)').matches;
function applyTheme(choice) {
  const r = resolveTheme(choice, prefersDark());
  document.documentElement.dataset.theme = r.choice;
  const b = $('#theme');
  if (b) {
    b.textContent = `配色: ${THEME_LABEL[r.choice] ?? r.choice}`;
    b.title = r.choice === 'auto'
      ? `OS の設定に従っています（今は${r.applied === 'dark' ? 'ダーク' : 'ライト'}）。押すと固定します`
      : '押すと次の配色に切り替えます（自動 → ライト → ダーク）';
  }
  return r;
}
{
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch { /* 使えない環境 */ }
  applyTheme(resolveTheme(saved, prefersDark()).choice);
  $('#theme')?.addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme || 'auto';
    const nxt = nextTheme(cur);
    try { localStorage.setItem(THEME_KEY, nxt); } catch { /* 使えない環境 */ }
    applyTheme(nxt);
  });
  // ⚠️ auto のときは OS 側の変化に追従する（固定しているときは追従しない）
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if ((document.documentElement.dataset.theme || 'auto') === 'auto') applyTheme('auto');
    });
  }
}

$('#reset').addEventListener('click', () => {
  for (const n of document.querySelectorAll('.col,.row,.pane')) {
    n.style.flex = ''; n.classList.remove('max', 'min');
  }
  // 並びも既定に戻す。⚠️ 忘れた記憶を残すと「レイアウトを戻したのに
  //    ペインが元の列に戻らない」という直し方の無い状態になる。
  // 閉じた記憶も戻す（「レイアウト」を押したのに開かないと直し方が無い）
  paneLayout = parseLayout(null);
  renderClosedList();
  try { localStorage.removeItem(ORDER_KEY); } catch { /* 元から書けていない */ }
  applyLayout();
});

/* ===== グラフ ===== */
function rowSvg(row) {
  const lanes = Math.max(row.input.length, row.output.length, row.lane + 1);
  const w = Math.max(lanes, 1) * LANE_W + LANE_W;
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', w); svg.setAttribute('height', ROW_H);
  const x = i => i * LANE_W + LANE_W / 2 + 2;
  const add = (n, a) => {
    const e = document.createElementNS(NS, n);
    for (const [k, v] of Object.entries(a)) e.setAttribute(k, v);
    svg.appendChild(e); return e;
  };
  const fed = new Set();
  row.input.forEach((node, i) => {
    const t = node.id === row.hash ? row.lane
      : row.output.findIndex(o => o.id === node.id);
    if (node.id !== row.hash && t !== -1) fed.add(t);
    add('path', {
      d: `M ${x(i)} 0 L ${x(i)} ${ROW_H / 2 - 5} L ${x(t === -1 ? i : t)} ${ROW_H / 2}`,
      stroke: node.color, fill: 'none', 'stroke-width': 1.5,
    });
  });
  const mp = new Set(row.mergeParentLanes ?? []);
  row.output.forEach((node, i) => {
    const fresh = mp.has(i) && !fed.has(i);
    const from = (i === row.firstParentLane || fresh) ? row.lane : i;
    add('path', {
      d: `M ${x(from)} ${ROW_H / 2} L ${x(i)} ${ROW_H / 2 + 5} L ${x(i)} ${ROW_H}`,
      stroke: node.color, fill: 'none', 'stroke-width': 1.5,
    });
  });
  for (const i of mp) {
    if (!fed.has(i) || i === row.firstParentLane) continue;
    add('path', {
      d: `M ${x(row.lane)} ${ROW_H / 2} L ${x(i)} ${ROW_H / 2 + 5}`,
      stroke: row.output[i]?.color ?? row.color, fill: 'none', 'stroke-width': 1.5,
    });
  }
  const isHead = row.worktrees.length > 0;
  add('circle', {
    cx: x(row.lane), cy: ROW_H / 2, r: isHead ? DOT_R + 1.3 : DOT_R,
    fill: isHead ? 'var(--card)' : row.color, stroke: row.color,
    'stroke-width': isHead ? 2.2 : 1,
  });
  return svg;
}

function when(iso) {
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 60) return `${m}分前`;
  const h = Math.round(m / 60);
  return h < 24 ? `${h}時間前` : `${Math.round(h / 24)}日前`;
}

/* ===== 差分 ===== */
function renderDiff(text) {
  const box = el('div', 'diff');
  const lines = text.split('\n');
  if (lines.length && lines.at(-1) === '') lines.pop();
  for (const line of lines) {
    let cls = '';
    if (line.startsWith('@@')) cls = 'hunk';
    else if (/^(\+\+\+|---|diff |index |new file|deleted file|similarity |rename )/.test(line)) cls = 'h';
    else if (line.startsWith('+')) cls = 'add';
    else if (line.startsWith('-')) cls = 'del';
    box.append(el('div', cls, line === '' ? ' ' : line));
  }
  if (!lines.length) box.append(el('div', 'h', '(差分なし)'));
  return box;
}

async function loadDiff(holder, base, ref, path) {
  holder.replaceChildren(el('div', 'note', `読み込み中: ${path}`));
  try {
    const res = await fetch(api('/api/v0/diff', { base, ref, path }));
    const d = await res.json();
    if (!res.ok) throw new Error(d.error ?? `HTTP ${res.status}`);
    if (d.binary) { holder.replaceChildren(el('div', 'note', 'バイナリファイル')); return; }
    holder.replaceChildren(renderDiff(d.text ?? ''));
  } catch (e) {
    holder.replaceChildren(el('div', 'note warn', `取得できませんでした: ${e.message}`));
  }
}

/* ===== 最小エディタ（--allow-write の枠内） =====
 *
 * 🚨 **自動更新で編集中の textarea を作り直さない。**
 *    差分ペインの中身は毎回 `replaceChildren` で作り直しているので、素のままだと
 *    15 秒ごとに**打っている途中の内容が消える**（監視盤の行で実際に踏んだのと
 *    同じ形。`docs/review-ui-conflicts.md`）。`obj.editing` が真のあいだ、
 *    そのペインは作り直さない（走っているコンソールを作り直さないのと同じ扱い）。
 *    ⚠️ この守りは **`v0/render-check.mjs` が実ブラウザで測っている**
 *       （字面の検査では「行を残したまま到達不能にする変更」が見えない）。
 *
 * 🚨 **409（他が書き換えた）は文言をそのまま見せる。** 「保存できませんでした」に
 *    丸めると、一番大事な事実（**別のエージェントが同じファイルを書いた**）が消える。
 *    N 本の worktree が並行に動く前提のツールでは、それが知りたい情報そのもの。
 */
function openEditor(obj, wt, path) {
  obj.editing = true;
  const wrap = el('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;height:100%';
  const bar = el('div', 'cmdbar');
  const where = el('span', 'wrmsg');
  where.textContent = path;
  where.title = `${wt.path} / ${path}`;
  const bDiff = el('button', null, '差分を見る');
  const bSave = el('button', null, '保存');
  const bReload = el('button', null, '読み直す（編集を捨てる）');
  const bClose = el('button', null, '閉じる');
  bar.append(where, bDiff, bSave, bReload, bClose);
  const msg = el('div', 'note editmsg');
  const ta = el('textarea', 'edit');
  ta.spellcheck = false;
  const diffBox = el('div', 'editdiff');
  diffBox.hidden = true;
  wrap.append(bar, msg, ta, diffBox);
  obj.body.replaceChildren(wrap);

  // 読んだときの状態。**oid が楽観ロックの鍵**（サーバが計算した値をそのまま返す）
  let base = null;
  const setMsg = (text, bad) => {
    msg.className = `note editmsg${bad ? ' warn' : ''}`;
    msg.textContent = text;
  };
  const post = (route, payload) => fetch(route, {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      [session.tokenHeader]: session.token ?? '',
    },
    body: JSON.stringify(payload),
  });

  const fetchBase = async () => {
    setMsg(`読み込み中: ${path}`);
    ta.disabled = true;
    try {
      const r = await post('/api/v0/file', { worktree: wt.path, path });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error ?? `HTTP ${r.status}`);
      base = { text: d.text, oid: d.oid, eol: d.eol, bom: d.bom };
      ta.value = d.text;
      ta.disabled = false;
      // ⚠️ 「自動更新が止まっている」ことを言う。黙って止めると
      //    「他の画面は更新されているのにここだけ古い」と読まれる
      setMsg(`${d.bytes} バイト / 改行 ${String(d.eol).toUpperCase()}`
        + `${d.bom ? ' / BOM あり' : ''}`
        + ' — 編集中はこのペインの自動更新を止めています');
    } catch (e) {
      base = null;
      setMsg(`✖ 開けませんでした: ${e.message}`, true);
    }
  };

  bDiff.addEventListener('click', () => {
    if (!base) { setMsg('✖ まだ読み込めていません', true); return; }
    const r = diffLines(base.text, ta.value);
    const box = el('div');
    if (!r.lines.length) {
      box.append(el('div', 'note', '(差分なし — 読んだときと同じ内容です)'));
    } else {
      box.append(renderDiff(r.lines.join('\n')));
    }
    // 打ち切り・見えない変更は必ず告知する
    if (r.approx) box.append(el('div', 'note warn', `⚠ ${r.why}`));
    if (r.trailingNewlineChanged) {
      box.append(el('div', 'note warn',
        '⚠ 末尾の改行の有無が変わります（行の差分としては見えません）'));
    }
    box.append(el('div', 'note',
      `+${r.added} / -${r.removed} 行。保存すると改行は ${String(base.eol).toUpperCase()} で書きます`
      + `${base.bom ? '（BOM も保ちます）' : ''}。`));
    diffBox.replaceChildren(box);
    diffBox.hidden = false;
  });

  bSave.addEventListener('click', async () => {
    if (!base) { setMsg('✖ まだ読み込めていません', true); return; }
    bSave.disabled = true;
    setMsg('保存中…');
    try {
      const r = await post('/api/v0/write', {
        worktree: wt.path, path, text: ta.value, baseOid: base.oid,
      });
      const d = await r.json();
      if (r.status === 409) {
        // 🚨 **そのまま見せる。** 丸めない（上の関数コメント参照）
        setMsg(`✖ ${d.error} — 「読み直す」で今の内容を取り直せます`, true);
        return;
      }
      if (!r.ok) throw new Error(d.error ?? `HTTP ${r.status}`);
      // 続けて編集できるように、新しい oid を掴み直す
      base = { ...base, oid: d.oid, text: ta.value };
      setMsg(`✔ 保存しました（${d.bytes} バイト / 改行 ${String(d.eol).toUpperCase()}`
        + `${d.bom ? ' / BOM あり' : ''}）`);
      diffBox.hidden = true;
      // 状態（変更 N 件など）を取り直す。**編集中のペインは作り直されない**
      await load(true);
    } catch (e) {
      setMsg(`✖ 保存できませんでした: ${e.message}`, true);
    } finally {
      bSave.disabled = false;
    }
  });

  bReload.addEventListener('click', () => { diffBox.hidden = true; fetchBase(); });
  bClose.addEventListener('click', () => {
    obj.editing = false;
    // 閉じたら通常の差分表示に戻す（次の描画で作り直される）
    load(true);
  });

  fetchBase();
}

/* ===== 全文ビューア ===== */
/** 1行ぶん。行番号は別 span（コピーから外すため） */
function blobRow(no, text) {
  const row = el('div', 'bl');
  // 空行を '' にすると行の高さが 0 になって行番号がずれる
  row.append(el('span', 'ln', String(no)), el('span', 'lx', text === '' ? ' ' : text));
  return row;
}

/**
 * 全文を描く。**中身は `/api/v0/blob`（= `git cat-file`）から来たものだけ。**
 *
 * ⚠️ **1行ごとに DOM へ足して `scrollHeight` を読まない。** 強制同期レイアウトが
 *    総文字数に対して二次になる（端末側で実測 12,000行 = 53.8秒、
 *    その間 停止ボタンも自動更新も効かない）。fragment に組んで**1回だけ**入れる。
 * 🚨 告知（省略・バイナリ・上限）は**実際に見える文字**として先頭に出す。
 *    ここは端末と違って古い行を捨てないので、告知が消える経路は無い。
 */
function renderBlob(holder, plan) {
  const box = el('div', 'blob');
  for (const n of plan.notices) box.append(el('div', 'note warn', n));
  const frag = document.createDocumentFragment();
  for (let i = 0; i < plan.lines.length; i++) frag.append(blobRow(i + 1, plan.lines[i]));
  box.append(frag);
  holder.replaceChildren(box);
}

/**
 * ファイルの中身を読んで描く。**差分ではなく全文。**
 *
 * ⚠️ ref / path はサーバの `isSafeRef` / `isSafeRepoPath` が検証する。
 *    ここで別の経路（fs や自前のパス組み立て）を作らない —
 *    未追跡の `.env` に触れる穴になる。
 */
async function loadBlob(holder, ref, path) {
  holder.replaceChildren(el('div', 'note', `読み込み中: ${path}（${ref} の全文）`));
  try {
    const q = new URLSearchParams({ ref, path });
    const res = await fetch(`/api/v0/blob?${q}`);
    const d = await res.json();
    if (!res.ok) throw new Error(d.error ?? `HTTP ${res.status}`);
    renderBlob(holder, planBlobView(d));
  } catch (e) {
    holder.replaceChildren(el('div', 'note warn', `取得できませんでした: ${e.message}`));
  }
}

function chatLine(text) {
