<title>kjp-edit</title>
<!--
  統合 UI。`/` と `/layout` の両方がこれを返す。
  以前は index.html（カード + グラフ + checkout + スマホ）と
  layout-prototype.html（差分 + コンソール + 並列ペイン）に割れていて、
  機能が揃っているのに片方ずつしか使えなかった。それを1枚にしたもの。

  レイアウトは viewport で切り替える:
    広い (>1100px): [worktree + ファイラ | 差分 / コンソール | グラフ] のドック。
                    スプリッタで可変、ペインごとに最大化・最小化
    狭い (<=1100px): 縦に積む。スプリッタは消える。
                    「レイアウトの保持は諦めて縦に並べる」方針（docs/scope.md）

  ⚠️ 自動更新は**id 単位の差分更新**にすること。ペインの id は worktree の path
     （序数ではない）。以前は集合キーが変わると全ペインを作り直していたので、
     worktree が1本増えるだけで走っているコンソールが全滅し、しかも
     abort していなかったのでサーバ側の子プロセスが 600 秒残り、
     4回の増減で実行枠（8）を使い切っていた（レビューで実測）。
  ⚠️ ペインを捨てる前に必ず `abort()` する（dropPanes を通す）。
  ⚠️ **ペインの置き場所を決めるのは applyLayout だけ**（保存された配置 → 無ければ
     ensurePane に渡された既定の入れ物）。ensurePane や描画の途中で
     `host.append` を足すと、自動更新が利用者の移動を毎回巻き戻す。
     移動は `appendChild` なので走っているコンソールの購読は切れない
     （主張ではなく `render-check.mjs` が実測している）。
  ⚠️ 端末描画は requestAnimationFrame でまとめる。1件ごとに scrollHeight を
     読むと強制同期レイアウトで**総文字数に対して二次**になり、
     12,000 行で 54 秒・単一ブロック 28.9 秒（停止も更新も効かない）になった。
-->
<style>
  :root {
    --bg: #1e1e1e; --fg: #d4d4d4; --dim: #808080; --line: #333;
    --card: #252526; --head: #2d2d30; --accent: #4fc1ff;
    --danger: #f14c4c; --warn: #cca700; --ok: #4ec9b0;
    --bar: 34px; --split: 6px; --row: 22px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #fff; --fg: #1f1f1f; --dim: #6a6a6a; --line: #dcdcdc;
      --card: #f6f6f6; --head: #ececec; --accent: #0066bf; }
  }
  /* ⚠️ min-width/min-height: 0 は全体に効かせる。grid/flex アイテムの既定 auto が
     中身の幅で列を押し広げ、overflow:auto を無効化する。 */
  * { box-sizing: border-box; min-width: 0; min-height: 0; }
  html, body { height: 100%; }
  /* ⚠️ flex column にする。以前は .shell の高さを calc(100% - バー) で決め打ちして
     いたので、#alerts の高さぶんがそのまま viewport の外へ押し出され、
     body が overflow:hidden なのでスクロールもできなかった
     （警告7件で下端 187px が永久に見えない。レビューで実測）。 */
  body { margin: 0; background: var(--bg); color: var(--fg); overflow: hidden;
    display: flex; flex-direction: column; height: 100%;
    font: 12px/1.5 ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace; }

  .topbar { height: var(--bar); flex: 0 0 auto; display: flex; align-items: center; gap: .6rem;
    padding: 0 .6rem; background: var(--head); border-bottom: 1px solid var(--line);
    flex-wrap: nowrap; overflow: hidden; }
  .topbar > * { flex: 0 0 auto; }
  .topbar b { font-size: 13px; }
  .topbar .path { color: var(--dim); flex: 1 1 auto; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .cap { border-radius: 3px; padding: 0 .4em; font-size: 11px; border: 1px solid; }
  .cap.w { color: var(--warn); border-color: var(--warn); }
  .cap.x { color: var(--danger); border-color: var(--danger); }
  .topbar button { font: inherit; font-size: 11px; background: var(--card); color: var(--fg);
    border: 1px solid var(--line); border-radius: 3px; padding: .2rem .5rem;
    min-height: 26px; cursor: pointer; }

  /* 安全に関わる警告は畳めない位置に置く */
  #alerts:empty { display: none; }
  #alerts { flex: 0 0 auto; max-height: 22vh; overflow: auto;
    border-bottom: 1px solid var(--line); background: var(--bg); }
  .alert { border-left: 3px solid var(--warn); padding: .3rem .6rem; margin: .2rem .4rem;
    background: var(--card); font-size: 12px; overflow-wrap: anywhere; }
  .alert.danger { border-left-color: var(--danger); }

  .shell { flex: 1 1 auto; min-height: 0; display: flex; }
  .col, .row { display: flex; }
  .col { flex-direction: column; }
  .row { flex-direction: row; }
  #left { flex: 0 0 230px; }
  #center { flex: 1 1 auto; flex-direction: column; }
  #right { flex: 0 0 430px; }
  #diffs { flex: 1 1 58%; }
  #consoles { flex: 1 1 42%; }

  .split { flex: 0 0 var(--split); position: relative; }
  .split::after { content: ''; position: absolute; inset: 0; background: var(--line); }
  .split:hover::after, .split.dragging::after { background: var(--accent); }
  .split.x { cursor: col-resize; } .split.y { cursor: row-resize; }
  .split.x::after { left: 2px; right: 2px; } .split.y::after { top: 2px; bottom: 2px; }

  .pane { display: flex; flex-direction: column; background: var(--card);
    border: 1px solid var(--line); border-radius: 3px; overflow: hidden;
    flex: 1 1 auto; margin: 2px; }
  /* ⚠️ `touch-action: none` が無いとタッチでは並び替えができない。
     ブラウザがスクロールを始めた瞬間に pointercancel が飛び、pointermove が
     1回も来ないまま終わる（スマホから使う前提なので、ここは譲れない）。
     ヘッダは細い帯なので、スクロールの起点として失う面積は小さい。 */
  .pane > header { display: flex; align-items: center; gap: .3rem; flex: 0 0 auto;
    padding: .25rem .45rem; background: var(--head); border-bottom: 1px solid var(--line);
    font-size: 11px; white-space: nowrap; cursor: grab; touch-action: none; }
  /* ⚠️ タイトルは縮む側、タグとボタンは縮まない側。分けないと狭いペインで
     タグがタイトル文字に重なって読めなくなる。 */
  .pane > header .ttl { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
  .pane > header .grow { flex: 1 1 auto; }
  .pane > header .tag { flex: 0 0 auto; }
  .pane > header button { font: inherit; background: transparent; color: var(--dim);
    border: 0; cursor: pointer; padding: 0 .3rem; border-radius: 2px;
    flex: 0 0 auto; white-space: nowrap; min-height: 22px; }
  .pane > header button:hover { color: var(--fg); background: rgba(127,127,127,.2); }
  .pane > .body { flex: 1 1 auto; overflow: auto; }
  .pane.max { position: fixed; inset: var(--bar) 0 0 0; z-index: 50; margin: 0; border-radius: 0; }
  .pane.min { flex: 0 0 auto; }
  .pane.min > .body { display: none; }
  /* 掴んでいるペイン。⚠️ `pointer-events: none` は使わない。落とす先は
     elementFromPoint ではなく入れ物の矩形から決めているので不要で、
     付けると掴んでいるヘッダ自身がイベントを受け取れなくなる。 */
  .pane.dragging { opacity: .55; }
  .pane.dragging > header { cursor: grabbing; }

  .tag { border: 1px solid var(--line); border-radius: 3px; padding: 0 .3em;
    color: var(--dim); font-size: 10px; }
  .tag.br { color: var(--accent); border-color: var(--accent); }
  .tag.dirty { color: var(--warn); border-color: var(--warn); }
  .tag.danger { color: var(--danger); border-color: var(--danger); }

  /* worktree カード */
  .cards { display: grid; gap: .4rem; padding: .4rem; }
  .card { background: var(--bg); border: 1px solid var(--line); border-radius: 3px;
    padding: .4rem .5rem; }
  .card h3 { margin: 0 0 .25rem; font-size: 12px; display: flex; gap: .3rem;
    align-items: center; flex-wrap: wrap; }
  .ab { color: var(--dim); font-size: 11px; overflow-wrap: anywhere; }
  .ab b { color: var(--fg); font-weight: 600; }
  .wr { display: flex; gap: .25rem; align-items: center; margin-top: .3rem; flex-wrap: wrap; }
  .wr select { font: inherit; font-size: 11px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 3px; max-width: 10rem; }
  .wr button { font: inherit; font-size: 11px; padding: .1rem .5rem; background: var(--card);
    color: var(--fg); border: 1px solid var(--line); border-radius: 3px;
    cursor: pointer; flex: 0 0 auto; white-space: nowrap; }
  .wrmsg { font-size: 11px; color: var(--dim); overflow-wrap: anywhere; }
  .wrmsg.bad { color: var(--danger); }

  /* ファイラ */
  .tree { padding: .3rem 0; }
  .tree div { padding: .05rem .5rem; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .tree .d { color: var(--fg); }
  .tree .f { color: var(--dim); cursor: pointer; }
  .tree .f:hover { background: rgba(127,127,127,.15); }
  .tree .st { color: var(--accent); display: inline-block; width: 1.1em; }

  /* 差分 */
  .tabs { display: flex; flex: 0 0 auto; background: var(--head);
    border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs button { font: inherit; font-size: 11px; background: transparent; border: 0;
    border-right: 1px solid var(--line); color: var(--dim);
    padding: .2rem .5rem; cursor: pointer; white-space: nowrap; }
  .tabs button.on { background: var(--card); color: var(--fg); }
  .diff { white-space: pre; font-size: 12px; }
  .diff div { padding: 0 .5rem; }
  .diff .h { color: var(--dim); background: rgba(127,127,127,.10); }
  .diff .hunk { color: var(--accent); background: rgba(79,193,255,.08); }
  .diff .add { color: #4ec9b0; background: rgba(78,201,176,.10); }
  .diff .del { color: #f14c4c; background: rgba(241,76,76,.10); }
  @media (prefers-color-scheme: light) {
    .diff .add { color: #0a7a5e; } .diff .del { color: #b3261e; }
  }
  /* ⚠️ overflow-wrap が無いと `--allow-transcript-text` のような長い語で
     行が箱より広くなり、狭い画面で**注意書き自体が読めなくなる**（実測）。
     省略の告知が読めないのは、告知が無いのと同じ。 */
  .note { color: var(--dim); padding: .5rem; font-size: 11px; overflow-wrap: anywhere; }
  .note.warn { color: var(--warn); }

  /* コンソール */
  .cmdbar { display: flex; gap: .25rem; padding: .25rem .3rem; flex: 0 0 auto;
    border-bottom: 1px solid var(--line); background: var(--head);
    align-items: center; flex-wrap: wrap; }
  .cmdbar input { flex: 1 1 7rem; font: inherit; font-size: 11px; background: var(--bg);
    color: var(--fg); border: 1px solid var(--line); border-radius: 3px; padding: .15rem .3rem; }
  .cmdbar select { flex: 0 1 auto; max-width: 9rem; font: inherit; font-size: 11px;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 3px; }
  /* ボタンは縮ませない。狭いと「実/行」と縦に割れて読めなくなる */
  .cmdbar button { font: inherit; font-size: 11px; padding: .1rem .45rem; background: var(--card);
    color: var(--fg); border: 1px solid var(--line); border-radius: 3px;
    cursor: pointer; flex: 0 0 auto; white-space: nowrap; }
  .cmdbar button:disabled { color: var(--dim); cursor: default; }
  .argvpeek { color: var(--dim); font-size: 10px; padding: .1rem .5rem; flex: 0 0 auto;
    border-bottom: 1px dashed var(--line); overflow-wrap: anywhere; }
  .argvpeek.bad { color: var(--danger); }
  .term { padding: .3rem .5rem; white-space: pre-wrap; word-break: break-word;
    font-size: 11px; line-height: 1.45; }
  .term .p { color: var(--ok); } .term .w { color: var(--warn); }
  .term .e { color: var(--danger); } .term .d { color: var(--dim); }
  /* 自分が送った行。出力と混ざると「誰が言ったか」が読めなくなる */
  .term .i { color: var(--accent); }

  /* 🚨 `hidden` 属性を作者スタイルで上書きしないための保険。
     `.cmdbar { display: flex }` のような規則は UA の `[hidden]{display:none}` に
     **勝つ**ので、`el.hidden = true` にしても消えない。
     実際に「送れないのに入力欄が出ている（押しても無反応）」状態を作った。 */
  [hidden] { display: none !important; }

  /* グラフ */
  .grow { display: grid; grid-template-columns: auto auto auto 1fr;
    align-items: center; height: var(--row); gap: .35rem; }
  .grow:hover { background: rgba(127,127,127,.12); }
  .grow svg { display: block; }
  /* ⚠️ バッジを .subject の中に入れてはいけない。overflow:hidden で
     クリップされ、狭い画面で**完全に見えなくなる**（横スクロールでも到達できない）。 */
  .wtcell, .refcell { display: flex; gap: .2rem; align-items: center;
    overflow: hidden; white-space: nowrap; }
  .subject { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* ⚠️ flex-shrink させない。ref が多いコミットで**全部 8px に潰れて
     0〜1文字しか読めなくなる**（レビューで51個を実測）。
     溢れは切り詰めて「+N」で示す方が情報が残る。 */
  .ref { border: 1px solid var(--line); border-radius: 3px; padding: 0 .3em;
    font-size: 10px; max-width: 11em; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; flex: 0 0 auto; }
  .ref.wt { color: var(--accent); border-color: var(--accent); }
  .empty { color: var(--dim); padding: .5rem; }

  /* ---- 狭い画面: レイアウトの保持を諦めて縦に積む ---- */
  @media (max-width: 1100px) {
    body { overflow: auto; }
    /* ⚠️ block ではなく flex column にする。block だと order が効かず、
       DOM 順のせいで**グラフが一番下**になって長いスクロールが必要になる。
       スマホで一番見たいのは worktree の状態とグラフなので前に出す。 */
    .shell { display: flex; flex-direction: column; height: auto; }
    .col, .row { display: flex; flex-direction: column; }
    #left { order: 1; } #right { order: 2; } #center { order: 3; }
    .split { display: none; }
    #left, #right, #center, #diffs, #consoles { flex: none; }
    .pane { margin: .4rem; }
    .pane > .body { max-height: 60vh; }
    .pane.max { position: static; inset: auto; }
    .cards { grid-template-columns: 1fr; }
    /* ref バッジは 390px では1〜2文字に潰れて情報にならない。
       worktree HEAD バッジ（核心情報）を残して ref は落とす。 */
    .refcell { display: none; }
  }
</style>

<div class="topbar">
  <b>kjp-edit</b>
  <span class="path" id="repo"></span>
  <span class="cap" id="cap" hidden></span>
  <button id="refresh">再読込</button>
  <button id="reset">レイアウト</button>
  <span class="path" id="at" style="flex:0 0 auto"></span>
</div>

<section id="alerts"></section>

<div class="shell" id="shell">
  <div class="col" id="left"></div>
  <div class="split x"></div>
  <div class="col" id="center">
    <div class="row" id="diffs"></div>
    <div class="split y"></div>
    <div class="row" id="consoles"></div>
  </div>
  <div class="split x"></div>
  <div class="col" id="right"></div>
</div>

<script type="module">
// 行割れ・マルチバイト割れの処理は共有モジュール（unit テストと同じコード）
import { parseNdjson } from './ndjson.mjs';
// argv の分割も共有モジュール（app.html の中だとテストできない）
import { splitArgv, isChatArgv, argvSummary } from './argv.mjs';
// 会話モードの出力の解釈も同じ理由で外に出した。
// **中に書いていたので「捨てない」という約束が破れていたのに気付けなかった**（#44）
import { makeChatFilter, chatGlance, chatInputText } from './chatfilter.mjs';
// ペインの配置（ドラッグで決めた並び）の表現と永続化の形も同じ理由で外に出した
import {
  PANE_HOSTS, parseLayout, serializeLayout, hostOf, orderedIds, setHostOrder, pruneLayout,
} from './panelayout.mjs';
// 「(リポジトリ外)」と言ってよいかの判定も外に出した。ここに書いていたので
// **中にあるファイルを「外を触った」と断言していた**のに検査が掛からなかった（8回目のレビュー）
import { pathLabel } from './pathlabel.mjs';

// 🚨 描画の予算を測る検査だけが立てる印（`--layout-probe` の iframe が `?probe=1` で開く）。
//    ⚠️ これで**機能を変えない**。測定用の入口を1つ出すだけ。
window.__kjpProbe = new URLSearchParams(location.search).get('probe') === '1';
const LANE_W = 10, ROW_H = 22, DOT_R = 3.2;
const $ = s => document.querySelector(s);
const el = (t, c, x) => {
  const n = document.createElement(t);
  if (c) n.className = c;
  if (x !== undefined) n.textContent = x;
  return n;
};

let session = { allowWrite: false, allowExec: false, token: null, tokenHeader: 'x-kjp-token' };
let state = null;

/* ===== スプリッタ / ペイン ===== */
function wireSplit(sp) {
  const dir = sp.classList.contains('x') ? 'x' : 'y';
  sp.addEventListener('pointerdown', e => {
    const prev = sp.previousElementSibling, next = sp.nextElementSibling;
    if (!prev || !next) return;
    e.preventDefault();
    sp.classList.add('dragging');
    sp.setPointerCapture(e.pointerId);
    const at = ev => (dir === 'x' ? ev.clientX : ev.clientY);
    const size = n => (dir === 'x'
      ? n.getBoundingClientRect().width : n.getBoundingClientRect().height);
    const start = at(e), p0 = size(prev), n0 = size(next), MIN = 60;
    const move = ev => {
      let d = at(ev) - start;
      d = Math.max(-(p0 - MIN), Math.min(n0 - MIN, d));
      prev.style.flex = `0 0 ${p0 + d}px`;
      next.style.flex = `0 0 ${n0 - d}px`;
    };
    const up = () => {
      sp.classList.remove('dragging');
      sp.removeEventListener('pointermove', move);
      sp.removeEventListener('pointerup', up);
      sp.removeEventListener('pointercancel', up);
    };
    sp.addEventListener('pointermove', move);
    sp.addEventListener('pointerup', up);
    sp.addEventListener('pointercancel', up);
  });
}

/* ===== ペインの配置（ドラッグで並び替え、localStorage に覚える） =====
   🚨 覚えるのは **data-pane-id（worktree の path 由来）** の一覧。
      序数を保存すると、払い出し順が変わった瞬間に別のペインの位置を復元して
      「ヘッダは agent-a なのに中身は agent-b」と同じ型の嘘になる。 */
const ORDER_KEY = 'kjp-edit:pane-order:v1';

/** ⚠️ localStorage は private mode や設定で throw する。
    並びを覚えるという些末な機能のために UI 全体を失わない。 */
function readStoredLayout() {
  try { return localStorage.getItem(ORDER_KEY); } catch { return null; }
}
let paneLayout = parseLayout(readStoredLayout());

function saveLayout() {
  paneLayout = pruneLayout(paneLayout, new Set(panes.keys()));
  try { localStorage.setItem(ORDER_KEY, serializeLayout(paneLayout)); } catch { /* 保存できなくても今の画面には効いている */ }
}

const hostEl = h => $('#' + h);

/**
 * 入れ物の中のペインを ids の順に並べ、必要ならスプリッタを挟む。
 *
 * ⚠️ `append` は既存の要素を**移動**する（作り直さない）。走っているコンソールの
 *    購読も端末の中身も残る。作り直すと exec の購読が切れ、サーバ側の子は
 *    切断後の猶予まで走り続ける。
 */
function placePanes(host, ids) {
  // スプリッタは状態を持たないので作り直してよい
  for (const sp of [...host.querySelectorAll(':scope > .split')]) sp.remove();
  const rowward = host.classList.contains('row');
  // ⚠️ 「他 N 本は表示していません」の告知はペインの**後ろ**に戻す。
  //    ペインだけを append すると先に居た告知が先頭に残り、
  //    ペインが1つも無いように読める（省略の告知が別の誤解を作る）。
  const trailing = [...host.children].filter(n => !n.classList.contains('pane'));
  let first = true;
  for (const id of ids) {
    const obj = panes.get(id);
    if (!obj) continue;
    if (rowward && !first) {
      const sp = el('div', 'split x');
      host.append(sp);
      wireSplit(sp);
    }
    host.append(obj.p);
    first = false;
  }
  for (const n of trailing) host.append(n);
}

/** 入れ物に前回置いた告知（省略の注意書き）を消す。ペインとスプリッタは残す */
function clearNotices(host) {
  for (const n of [...host.children]) {
    if (!n.classList.contains('pane') && !n.classList.contains('split')) n.remove();
  }
}

/** 全ペインを「保存された配置 → 無ければ既定の入れ物」に従って置き直す */
function applyLayout() {
  const byHost = new Map(PANE_HOSTS.map(h => [h, []]));
  for (const [id, obj] of panes) {
    byHost.get(hostOf(paneLayout, id, obj.defaultHost))?.push(id);
  }
  for (const h of PANE_HOSTS) {
    const ids = byHost.get(h);
    // 🚨 既定の並びは「作った順」ではなく「**render が求めた順**」。
    //    worktree はアルファベット順で**中間に**挿入されるので、作った順だと
    //    後から増えた1本が必ず末尾に付く（以前 arrangeRow が毎回並べ直していた
    //    のはこのため。消したときに既定の並びが壊れる形で気付いた）。
    ids.sort((a, b) => panes.get(a).defaultRank - panes.get(b).defaultRank);
    placePanes(hostEl(h), orderedIds(paneLayout, h, ids));
  }
}

// ⚠️ ensurePane ごとに applyLayout を呼ぶと、1回の描画でペイン本数の二乗だけ
//    DOM を動かす。増減があった描画の**直後に1度だけ**走らせる。
let layoutQueued = false;
function scheduleLayout() {
  if (layoutQueued) return;
  layoutQueued = true;
  queueMicrotask(() => { layoutQueued = false; applyLayout(); });
}

// これ未満の移動はドラッグではなくクリック（ヘッダの開閉）として扱う
const DRAG_SLOP = 6;

/**
 * 座標がどの入れ物の上か。
 *
 * ⚠️ **`elementFromPoint` を使わない。** 掴んでいるペイン自身が最前面に写るし、
 *    狭い画面では入れ物が縦に積まれて viewport の外まで伸びるので、
 *    画面外の座標では null が返って移動できなくなる。矩形なら画面外も測れる。
 */
function hostAt(x, y) {
  for (const h of PANE_HOSTS) {
    const host = hostEl(h);
    const r = host.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return host;
  }
  return null;
}

/** 落とす先（入れ物と、その手前に挿すペイン）。中点を越えたら後ろに回る */
function dropSpot(dragged, x, y) {
  const host = hostAt(x, y);
  if (!host) return null;
  // ⚠️ 軸は入れ物の id ではなく実際の flex-direction で決める。
  //    狭い画面の media query では `.row` も column になる（横に並んでいない）。
  const vertical = getComputedStyle(host).flexDirection.startsWith('column');
  for (const k of host.children) {
    if (!k.classList.contains('pane') || k === dragged) continue;
    const r = k.getBoundingClientRect();
    const mid = vertical ? r.top + r.height / 2 : r.left + r.width / 2;
    if ((vertical ? y : x) < mid) return { host, before: k };
  }
  return { host, before: null };
}

function commitMove(p, spot) {
  const ids = [];
  for (const k of spot.host.children) {
    if (k.classList.contains('pane') && k !== p) ids.push(k.dataset.paneId);
  }
  const at = spot.before ? ids.indexOf(spot.before.dataset.paneId) : ids.length;
  ids.splice(at, 0, p.dataset.paneId);
  paneLayout = setHostOrder(paneLayout, spot.host.id, ids);
  applyLayout();
}

/**
 * ヘッダを掴んでペインを並び替える。マウスとタッチの両方（Pointer Events）。
 *
 * ⚠️ ヘッダのクリック（開閉）と取り違えないため、しきい値を越えるまで何もしない。
 *    越えたら直後の click を1回だけ捨てる（並べ替えるたびに畳まれてしまう）。
 */
function wireDrag(p, h, drag, skip) {
  h.addEventListener('pointerdown', e => {
    if (skip.includes(e.target)) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    // 最大化中は画面全面なので、落とす先を選べない
    if (p.classList.contains('max')) return;
    drag.moved = false;
    const x0 = e.clientX, y0 = e.clientY;
    let started = false, last = '';
    // ⚠️ 合成イベント（`--layout-probe` の検査）には対応する実ポインタが無いので
    //    setPointerCapture は NotFoundError を投げる。実ポインタではペインの外に
    //    出ても pointermove / pointerup が届くように掴むが、掴めなかった場合も
    //    ヘッダ上のイベントで並び替えは動く。
    try { h.setPointerCapture(e.pointerId); } catch { /* 実ポインタが無い */ }
    const move = ev => {
      if (!started) {
        if (Math.abs(ev.clientX - x0) < DRAG_SLOP
          && Math.abs(ev.clientY - y0) < DRAG_SLOP) return;
        started = true;
        drag.moved = true;
        p.classList.add('dragging');
      }
      const spot = dropSpot(p, ev.clientX, ev.clientY);
      if (!spot) return;
      const key = `${spot.host.id}|${spot.before?.dataset.paneId ?? ''}`;
      if (key === last) return;   // 同じ位置で置き直しを繰り返さない
      last = key;
      commitMove(p, spot);
    };
    const end = () => {
      h.removeEventListener('pointermove', move);
      h.removeEventListener('pointerup', end);
      h.removeEventListener('pointercancel', end);
      if (!started) return;
      p.classList.remove('dragging');
      saveLayout();
    };
    h.addEventListener('pointermove', move);
    h.addEventListener('pointerup', end);
    h.addEventListener('pointercancel', end);
  });
}

/** ペインを作る。ヘッダのクリックで開閉、⛶ で最大化、ヘッダを掴むと並び替え。 */
function pane(id, title, tags = []) {
  const p = el('div', 'pane');
  p.dataset.paneId = id;
  const h = el('header');
  const ttl = el('span', 'ttl', title);
  const tagBox = el('span', 'tags');
  tagBox.style.display = 'flex';
  tagBox.style.gap = '.3rem';
  for (const [cls, text] of tags) tagBox.append(el('span', `tag ${cls}`, text));
  const bmin = el('button', null, '–'); bmin.title = '最小化';
  const bmax = el('button', null, '⛶'); bmax.title = '最大化';
  h.append(ttl, el('span', 'grow'), tagBox, bmin, bmax);
  const body = el('div', 'body');
  p.append(h, body);

  // ⚠️ ドラッグで動かした直後の click で開閉すると、並べ替えるたびに畳まれる。
  //    掴んだ時点で false に戻すので、click が来ないまま終わっても次は効く。
  const drag = { moved: false };
  h.addEventListener('click', ev => {
    if (ev.target === bmin || ev.target === bmax) return;
    if (drag.moved) { drag.moved = false; return; }
    p.classList.toggle('min');
  });
  wireDrag(p, h, drag, [bmin, bmax]);
  bmin.addEventListener('click', ev => { ev.stopPropagation(); p.classList.toggle('min'); });
  bmax.addEventListener('click', ev => {
    ev.stopPropagation();
    const was = p.classList.contains('max');
    for (const o of document.querySelectorAll('.pane.max')) o.classList.remove('max');
    if (!was) p.classList.add('max');
  });
  return { p, body, ttl, tagBox };
}

function setTags(tagBox, tags) {
  tagBox.replaceChildren();
  for (const [cls, text] of tags) tagBox.append(el('span', `tag ${cls}`, text));
}

$('#reset').addEventListener('click', () => {
  for (const n of document.querySelectorAll('.col,.row,.pane')) {
    n.style.flex = ''; n.classList.remove('max', 'min');
  }
  // 並びも既定に戻す。⚠️ 忘れた記憶を残すと「レイアウトを戻したのに
  //    ペインが元の列に戻らない」という直し方の無い状態になる。
  paneLayout = parseLayout(null);
  try { localStorage.removeItem(ORDER_KEY); } catch { /* 元から書けていない */ }
  applyLayout();
});

/* ===== グラフ ===== */
function rowSvg(row) {
  const lanes = Math.max(row.input.length, row.output.length, row.lane + 1);
  const w = Math.max(lanes, 1) * LANE_W + LANE_W;
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', w); svg.setAttribute('height', ROW_H);
  const x = i => i * LANE_W + LANE_W / 2 + 2;
  const add = (n, a) => {
    const e = document.createElementNS(NS, n);
    for (const [k, v] of Object.entries(a)) e.setAttribute(k, v);
    svg.appendChild(e); return e;
  };
  const fed = new Set();
  row.input.forEach((node, i) => {
    const t = node.id === row.hash ? row.lane
      : row.output.findIndex(o => o.id === node.id);
    if (node.id !== row.hash && t !== -1) fed.add(t);
    add('path', {
      d: `M ${x(i)} 0 L ${x(i)} ${ROW_H / 2 - 5} L ${x(t === -1 ? i : t)} ${ROW_H / 2}`,
      stroke: node.color, fill: 'none', 'stroke-width': 1.5,
    });
  });
  const mp = new Set(row.mergeParentLanes ?? []);
  row.output.forEach((node, i) => {
    const fresh = mp.has(i) && !fed.has(i);
    const from = (i === row.firstParentLane || fresh) ? row.lane : i;
    add('path', {
      d: `M ${x(from)} ${ROW_H / 2} L ${x(i)} ${ROW_H / 2 + 5} L ${x(i)} ${ROW_H}`,
      stroke: node.color, fill: 'none', 'stroke-width': 1.5,
    });
  });
  for (const i of mp) {
    if (!fed.has(i) || i === row.firstParentLane) continue;
    add('path', {
      d: `M ${x(row.lane)} ${ROW_H / 2} L ${x(i)} ${ROW_H / 2 + 5}`,
      stroke: row.output[i]?.color ?? row.color, fill: 'none', 'stroke-width': 1.5,
    });
  }
  const isHead = row.worktrees.length > 0;
  add('circle', {
    cx: x(row.lane), cy: ROW_H / 2, r: isHead ? DOT_R + 1.3 : DOT_R,
    fill: isHead ? 'var(--card)' : row.color, stroke: row.color,
    'stroke-width': isHead ? 2.2 : 1,
  });
  return svg;
}

function when(iso) {
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 60) return `${m}分前`;
  const h = Math.round(m / 60);
  return h < 24 ? `${h}時間前` : `${Math.round(h / 24)}日前`;
}

/* ===== 差分 ===== */
function renderDiff(text) {
  const box = el('div', 'diff');
  const lines = text.split('\n');
  if (lines.length && lines.at(-1) === '') lines.pop();
  for (const line of lines) {
    let cls = '';
    if (line.startsWith('@@')) cls = 'hunk';
    else if (/^(\+\+\+|---|diff |index |new file|deleted file|similarity |rename )/.test(line)) cls = 'h';
    else if (line.startsWith('+')) cls = 'add';
    else if (line.startsWith('-')) cls = 'del';
    box.append(el('div', cls, line === '' ? ' ' : line));
  }
  if (!lines.length) box.append(el('div', 'h', '(差分なし)'));
  return box;
}

async function loadDiff(holder, base, ref, path) {
  holder.replaceChildren(el('div', 'note', `読み込み中: ${path}`));
  try {
    const q = new URLSearchParams({ base, ref, path });
    const res = await fetch(`/api/v0/diff?${q}`);
    const d = await res.json();
    if (!res.ok) throw new Error(d.error ?? `HTTP ${res.status}`);
    if (d.binary) { holder.replaceChildren(el('div', 'note', 'バイナリファイル')); return; }
    holder.replaceChildren(renderDiff(d.text ?? ''));
  } catch (e) {
    holder.replaceChildren(el('div', 'note warn', `取得できませんでした: ${e.message}`));
  }
}

/* ===== コンソール ===== */
const MAX_CONSOLE_PANES = 4, MAX_DIFF_PANES = 2;
const IS_WIN = /win/i.test(navigator.platform ?? '');
const PRESETS = [
  'git status --short',
  'git log --oneline -10',
  'git diff --stat',
  IS_WIN ? 'cmd /c npm test' : 'npm test',
  'claude -p "この worktree の変更を要約して"',
];

/**
 * 会話モードの argv。
 *
 * ⚠️ **PTY は要らない。** `--input-format stream-json` で素のパイプ越しに
 *    多ターンの会話が成立する（実測で確認: 同一プロセス・同一セッションで
 *    2ターン目が1ターン目を覚えている）。出力も JSON 行なので
 *    既にある ndjson の配管に乗る。
 * ⚠️ 権限は `plan` にしておく。会話しながら勝手に書き換えられると、
 *    観測しているつもりが変更になる。書かせたいなら明示的に argv を編集する。
 */
const CHAT_ARGV = [
  'claude', '-p',
  '--input-format', 'stream-json',
  '--output-format', 'stream-json',
  '--verbose',
  '--replay-user-messages',
  '--permission-mode', 'plan',
];

/** 会話モードの1ターンを stream-json の1行にする（サーバは解釈しない） */
function chatLine(text) {
  return `${JSON.stringify({
    type: 'user',
    message: { role: 'user', content: [{ type: 'text', text }] },
  })}\n`;
}

/** 端末の上限。超えたら先頭を捨てる（捨てたことは画面に出す）。 */
const TERM_MAX_SPANS = 4000;

/**
 * 実行セッションを購読する。**新規実行と再購読の両方**を担う。
 * @param {?{id: string, from: number}} attach 再購読するセッション（新規なら null）
 */
/**
 * 端末への追記をまとめる書き手。**runExec と描画の計測（#3）が同じものを使う。**
 *
 * ⚠️ 出力1件ごとに DOM に append して `scrollHeight` を読むと、
 *    **強制同期レイアウトが総文字数に比例**して全体が二次になる。
 *    実測で 12,000 行 = 53.8 秒、うち 28.9 秒が単一ブロック
 *    （その間 停止ボタンも自動更新も効かない）。
 *    → イベントを溜めて `requestAnimationFrame` で1回だけ流す。
 *    → `atBottom` は毎回測らず `scroll` イベントで真偽値として持つ。
 * ⚠️ **計測がこの関数を通ることが重要。** 別経路を測ると
 *    「速い」という主張の根拠にならない（v0/render-check.mjs）。
 */
function makeTermWriter(termEl, scrollEl) {
  let follow = true;
  const onScroll = () => {
    follow = scrollEl.scrollTop + scrollEl.clientHeight >= scrollEl.scrollHeight - 24;
  };
  scrollEl.addEventListener('scroll', onScroll, { passive: true });

  let queue = [], flushing = false;
  // 告知の要素は掴んで持つ（後から querySelector で探すと構造の変化で別物を掴む）
  let notice = null;
  const flush = () => {
    flushing = false;
    if (!queue.length) return;
    const frag = document.createDocumentFragment();
    for (const [cls, s] of queue) frag.append(el('span', cls, s));
    queue = [];
    termEl.append(frag);
    // 上限を超えたら先頭を捨てる。「全部見えている」という誤認を防ぐため告知する
    // 🚨 **告知を先に置き、以降は告知の次から捨てる。** 先頭から素朴に捨てると
    //    次のトリムで**告知自身が消えて**「全部見えている」表示に戻る
    //    （`render-check.mjs` が実測で捕まえた。先頭が "line 8000" になっていた）。
    if (termEl.childNodes.length > TERM_MAX_SPANS) {
      if (!notice) {
        notice = el('span', 'w', `⚠ 出力が多いので古い行を捨てています（直近 ${TERM_MAX_SPANS} 要素）
`);
        termEl.prepend(notice);
      }
      const drop = termEl.childNodes.length - TERM_MAX_SPANS;
      for (let i = 0; i < drop; i++) notice.nextSibling?.remove();
    }
    if (follow) scrollEl.scrollTop = scrollEl.scrollHeight;
  };
  const line = (cls, s) => {
    queue.push([cls, s]);
    if (!flushing) { flushing = true; requestAnimationFrame(flush); }
  };
  return { line, flush, dispose: () => scrollEl.removeEventListener('scroll', onScroll) };
}

async function runExec(termEl, scrollEl, wt, argv, onState,
  { attach = null, keepAlive = false, chat = false, onActivity = null } = {}) {
  // 端末への追記は共通の書き手を使う（描画の計測も同じものを通る。#3）
  const writer = makeTermWriter(termEl, scrollEl);
  const line = writer.line;

  const ac = new AbortController();
  // ⚠️ **abort はもう「停止」ではない。** #17 でサーバが切断で子を殺すのを
  //    やめたので、abort は「見るのをやめる」だけ。止めるには kill を呼ぶ。
  //    ここを混同すると「停止を押したのに走り続ける」ことになる。
  let sessionId = attach?.id ?? null;
  let lastSeq = attach?.from ?? 0;
  const kill = async () => {
    if (!sessionId) { ac.abort(); return; }
    try {
      await fetch(`/api/v0/exec/${sessionId}/kill`, {
        method: 'POST',
        headers: { 'content-type': 'application/json', [session.tokenHeader]: session.token ?? '' },
      });
    } catch { /* 既に終わっている */ }
  };
  // 会話モードでは stream-json を読める形に直す
  const chatFilter = chat ? makeChatFilter(line) : null;
  /** 走っているセッションの標準入力に書く */
  const write = async (data, eof = false) => {
    if (!sessionId) return { ok: false, error: 'セッションがまだありません' };
    try {
      const r = await fetch(`/api/v0/exec/${sessionId}/input`, {
        method: 'POST',
        headers: { 'content-type': 'application/json', [session.tokenHeader]: session.token ?? '' },
        body: JSON.stringify(eof ? { eof: true } : { data }),
      });
      if (!r.ok) {
        let msg = `HTTP ${r.status}`;
        try { msg = (await r.json()).error ?? msg; } catch { /* JSON でない */ }
        line('e', `✖ ${msg}\n`);
        return { ok: false, error: msg };
      }
      return { ok: true };
    } catch (e) {
      line('e', `✖ ${e.message}\n`);
      return { ok: false, error: e.message };
    }
  };
  const publish = () => onState({
    running: true, abort: () => ac.abort(), kill, sessionId, chat, write,
    seq: () => lastSeq,
  });
  publish();
  if (attach) line('d', `↻ セッション ${attach.id} に再接続\n`);
  else {
    // 🚨 監視盤と同じ上限をかける（長い引数で端末が埋まる）。省略は必ず言う
    const shown = argvSummary(argv);
    line('d', `$ ${shown.text}${shown.clipped ? '  ← 長いので省略' : ''}\n`);
  }
  try {
    const res = await fetch(attach ? `/api/v0/exec/${attach.id}/stream` : '/api/v0/exec', {
      method: 'POST',
      headers: { 'content-type': 'application/json', [session.tokenHeader]: session.token ?? '' },
      body: JSON.stringify(attach
        ? { from: attach.from ?? 0 }
        : { worktree: wt.path, argv, keepAlive: !!keepAlive }),
      signal: ac.signal,
    });
    if (!res.ok) {
      let msg = `HTTP ${res.status}`;
      try { msg = (await res.json()).error ?? msg; } catch { /* JSON でない */ }
      line('e', `✖ ${msg}\n`);
      return;
    }
    for await (const ev of parseNdjson(res.body)) {
      if (ev.__parseError) { line('e', `(解析できない行: ${ev.__parseError.slice(0, 80)})\n`); continue; }
      // 通番を覚える。再接続で「続きから」貰うために必要
      if (typeof ev.n === 'number' && ev.n > lastSeq) lastSeq = ev.n;
      // 🚨 心拍の材料。**出力が来ていること**と**出していない件数**を知らせる
      //    （長い応答を書いている間の沈黙を「止まった」と読ませない）
      if (onActivity) {
        try {
          onActivity({
            visible: ev.t === 'out' || ev.t === 'err' || ev.t === 'in',
            skipped: chatFilter?.skippedTotal?.() ?? 0,
          });
        } catch { /* 心拍で購読ループを壊さない */ }
      }
      if (ev.t === 'session') {
        sessionId = ev.id;
        publish();
        // 🚨 **「最後まで走ります」は完走の約束になっていて嘘だった。**
        //    keepAlive でも `--exec-timeout`（既定600秒）で SIGKILL される。
        //    スマホで会話を始めて席を離れると10分で殺され、claude 側の文脈は
        //    取り戻せない（`--resume` は配線していない）。**上限を必ず言う。**
        const limit = typeof ev.timeoutMs === 'number'
          ? `開始から ${Math.round(ev.timeoutMs / 1000)} 秒で停止します`
          : '上限は不明です';
        if (ev.keepAlive) line('d', `（切断しても走り続けます。ただし${limit}）\n`);
        else if (ev.detachedGraceMs) {
          line('d', `（切断しても ${Math.round(ev.detachedGraceMs / 1000)} 秒は走り続けます。`
            + `${limit}）\n`);
        }
        continue;
      }
      // 🚨 **送った中身を「会話」として出す（封筒を見せない）。**
      //    会話モードでは UI が stream-json を組み立てて送るので、そのまま出すと
      //    `▸ {"type":"user","message":{...}}` になり、**打った本人にも読めない**。
      //    ⚠️ 解釈できなければ生のまま出す（捨てない）。
      if (ev.t === 'in') {
        const asText = chatFilter ? chatInputText(ev.d) : null;
        line('i', `▸ ${asText ?? ev.d}${asText ? '\n' : ''}`);
      }
      else if (ev.t === 'note') line('d', `${ev.d}\n`);
      // 🚨 **フィルタの失敗で購読ループを終わらせない。** 例外が抜けると finally の
      //    `onState({running:false})` が走り、**「停止」表示なのに走り続けている**
      //    状態になる（しかもそのペインからは止められない）。
      //    解釈できない行は捨てないという宣言どおり、生のまま出して続ける。
      else if (ev.t === 'out') {
        if (!chatFilter) line('', ev.d);
        else {
          try { chatFilter.feed(ev.d); }
          catch (e) { line('w', `⚠ 出力を解釈できませんでした（そのまま出します）: ${e.message}\n`); line('', ev.d); }
        }
      }
      else if (ev.t === 'err') line('w', ev.d);
      else if (ev.t === 'exit') {
        const ok = ev.code === 0;
        line(ok ? 'p' : 'e',
          `\n${ok ? '✔' : '✖'} exit=${ev.code}${ev.signal ? ` signal=${ev.signal}` : ''}\n`);
      }
    }
  } catch (e) {
    // ⚠️ **「サーバ側でプロセスを停止」と書いてはいけない。** #17 で
    //    切断では止まらなくなった。嘘を書くと、走り続けているものを
    //    止めたと誤解する（観測ツールとして最悪の誤り）
    if (e.name === 'AbortError') {
      line('w', sessionId
        ? `\n⚠ 見るのをやめました。セッション ${sessionId} はまだ走っています（止めるには「停止」）\n`
        : '\n⚠ 中断しました\n');
    }
    else line('e', `\n✖ ${e.message}\n`);
  } finally {
    // 🚨 **順序が重要。** chatFilter に残っている行を先に line() に流し、
    //    そのあと writer を flush する。逆にすると最後の応答が DOM に出ない（#44）
    chatFilter?.flush();
    writer.flush();                // 溜まっている分を出し切る
    writer.dispose();
    onState({ running: false });
  }
}

/**
 * @param {object} paneObj ペインオブジェクト。走っている実行を中断できるよう
 *   `abort` を持たせる。⚠️ これが無いとペインを捨てた時に中断できず、
 *   サーバ側の子プロセスが --exec-timeout（既定600秒）まで残り、
 *   4回で MAX_CONCURRENT_EXEC を食い尽くす（レビューで実測）。
 */
/**
 * 🔒 **書き込み・実行の鍵を貼る口。**
 *
 * 案内の URL に載せるのは読み取り専用の派生秘密だけにしたので（8回目のレビュー）、
 * 書き込み・実行の鍵はここから渡す。**URL に入れないので履歴に残らない。**
 * 保存先は sessionStorage（**ポートを含むオリジン単位**なので、Cookie と違って
 * 他ポートのページからは読めない）。タブを閉じれば消える。
 */
function keyPasteBox() {
  const bar = el('div', 'cmdbar');
  const inp = el('input');
  inp.type = 'password';         // 肩越しに見えない（スマホで貼ることが多い）
  inp.placeholder = '実行・書き込みの鍵を貼る';
  inp.spellcheck = false;
  const btn = el('button', null, '鍵を貼る');
  const msg = el('div', 'wrmsg');
  const apply = () => {
    const v = inp.value.trim();
    if (!v) return;
    // ⚠️ 検証はサーバに任せる（ここで形を判定すると「正しいのに弾く」が起きる）。
    //    入れ替えたら読み直す（capability の判定は起動時に1回だけなので）。
    try { sessionStorage.setItem(TOKEN_KEY, v); } catch {
      msg.className = 'wrmsg bad';
      msg.textContent = 'このブラウザでは保存できません（プライベートモード？）';
      return;
    }
    inp.value = '';
    location.reload();
  };
  btn.addEventListener('click', apply);
  // ⚠️ IME の変換確定 Enter で貼らない（半端な値が入る）
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) apply();
  });
  bar.append(inp, btn);
  const box = el('div');
  box.append(bar, msg);
  return box;
}

function consoleBody(wt, paneObj) {
  const box = el('div');
  box.style.cssText = 'display:flex;flex-direction:column;height:100%';

  // 走っているセッションへの再接続口。**ここが無いと、切断しても走り続ける
  // ようにした意味が半分無くなる**（戻ってきたのに追いつけない）。
  // 🚨 **鍵が無い経路にも置く（8回目のレビュー。SERIOUS）。** 以前は
  //    「実行の鍵が無い」で先に return していたので `showSessions` すら
  //    定義されず、**走っているセッションと再接続口が黙って消えていた**。
  //    しかもそれは `--allow-host`（= `--require-auth`）= スマホから使う
  //    既定の構成なので、**一番使う経路で機能が無いのと同じ**だった。
  const resume = el('div', 'note');
  resume.hidden = true;
  // 実行の鍵が無いなら押しても必ず 403 なので、ボタンは作らず理由を書く
  const canReconnect = session.allowExec && session.canMutate;

  /**
   * この worktree で走っているセッションを出す。
   * ⚠️ 自動更新のたびに作り直すが、**入力欄は作り直さない**（選択が飛ぶ）。
   *    ここは表示だけなので作り直して良い。
   * 🚨 **`hidden`（サーバが一覧を落とした）を黙って空にしない。**
   *    読み取り用の鍵しか無い相手には `execSessions` を返さない
   *    （argv はユーザが打ったコマンド行そのもので秘密が載りうるし、
   *     Cookie はポートで分離されない）。**その分界は緩めない**が、
   *    落としたことを言わないと「1本も走っていない」と区別できない。
   */
  paneObj.showSessions = (list, hidden) => {
    // 🚨 **購読が変わった瞬間に出し直せるように、最後の一覧を持つ。**
    //    持たないと、購読を始めてもボタンの字が次の自動更新（15秒）まで
    //    「再接続」のままで、**両方見られると誤解させる**（実測で落ちた）。
    if (list) paneObj.lastSessions = list;
    if (hidden !== undefined) paneObj.sessionsHidden = hidden;
    resume.replaceChildren();
    if (paneObj.sessionsHidden) {
      resume.hidden = false;
      resume.append(document.createTextNode(
        '⚠ このworktreeで走っているセッションの一覧は出せません'
        + '（読み取り用の鍵ではコマンド行を返さないため）。'
        + ' 実行の鍵を貼ると、走っているものと再接続口が出ます。'));
      return;
    }
    const mine = (list ?? paneObj.lastSessions ?? []).filter(s => samePathish(s.worktree, wt.path)
      && (s.state === 'starting' || s.state === 'running')
      && s.id !== paneObj.sessionId);
    resume.hidden = mine.length === 0;
    if (!mine.length) return;
    resume.append(document.createTextNode(
      `⚠ このworktreeで ${mine.length} 件のセッションが走っています（別の画面から実行したもの）:`));
    for (const s of mine) {
      const row = el('div', 'ab');
      row.append(document.createTextNode(`${s.argv.join(' ')} — ${Math.round(s.ageMs / 1000)}秒経過`));
      if (s.detachedMs !== null && !s.keepAlive) {
        row.append(el('span', 'note', ` / 切断中 ${Math.round(s.detachedMs / 1000)}秒`));
      }
      if (!canReconnect) {
        // 押せば必ず 403 になるボタンは出さない。**できない理由を書く**
        row.append(el('span', 'note', ' / 実行の鍵が無いので再接続も停止もできません'));
        resume.append(row);
        continue;
      }
      // ⚠️ **今すでに購読しているなら「切替」と言う。** 押すと前の購読は
      //    abort され、端末も作り直される（2本を同じ端末に混ぜない）。
      //    ボタンの字が「再接続」のままだと**両方見られる**と誤解させる。
      const re = el('button', null, paneObj.sessionId ? '切替' : '再接続');
      re.title = paneObj.sessionId
        ? '今見ているセッションの購読をやめて、こちらに切り替えます（実行は止めません）'
        : 'このセッションの出力を最初から再生します';
      re.addEventListener('click', () => {
        // 通番 0 から = 残っている分を全部再生してもらう
        // 🚨 **会話モードを argv から復元する。** 渡さないと次の送信で生のテキストを
        //    stdin に書き、claude が exit 1 で死んで会話が丸ごと消える（実測）
        beginRun(s.argv, {
          attach: { id: s.id, from: 0 },
          chat: isChatArgv(s.argv),
          keepAlive: s.keepAlive === true,
        });
      });
      const kb = el('button', null, '停止');
      kb.addEventListener('click', async () => {
        kb.disabled = true;
        try {
          await fetch(`/api/v0/exec/${s.id}/kill`, {
            method: 'POST',
            headers: { 'content-type': 'application/json', [session.tokenHeader]: session.token ?? '' },
          });
        } catch { /* 既に終わっている */ }
      });
      row.append(re, kb);
      resume.append(row);
    }
  };

  // 🚨 同じ理由で、実行の鍵が無いなら実行のバーも出さない（必ず 403 になる）
  if (session.allowExec && !session.canMutate) {
    box.append(el('div', 'note warn',
      '⚠ 実行の鍵をこのタブが持っていません。'
      + ' 🔒 実行の鍵は URL に載せていません（履歴・ブックマーク・中継のログに残るため）。'
      + ' 起動時に表示された鍵を下に貼ってください（このタブだけが持ちます）。'));
    box.append(keyPasteBox());
    box.append(resume);
    return box;
  }
  if (!session.allowExec) {
    box.append(el('div', 'note warn',
      '実行は無効です。--allow-exec と 24 文字以上の --token を付けて起動すると使えます。'
      + ' 遠隔から引ける状態は remote code execution なので既定でオフです。'));
    return box;
  }
  const bar = el('div', 'cmdbar');
  const sel = el('select');
  for (const p of PRESETS) { const o = el('option', null, p); o.value = p; sel.append(o); }
  const input = el('input');
  input.value = PRESETS[0];
  input.spellcheck = false;
  const run = el('button', null, '実行');
  const chatBtn = el('button', null, '会話');
  chatBtn.title = 'claude と多ターンで会話する（PTY は使いません）';
  const stop = el('button', null, '停止');
  stop.disabled = true;
  bar.append(sel, input, run, chatBtn, stop);

  const peek = el('div', 'argvpeek');
  const scroll = el('div');
  scroll.style.cssText = 'flex:1 1 auto;overflow:auto';
  const term = el('div', 'term');
  scroll.append(term);

  let parsed = { argv: [], warning: null };
  const refresh = () => {
    parsed = splitArgv(input.value);
    peek.className = parsed.warning ? 'argvpeek bad' : 'argvpeek';
    peek.textContent = parsed.warning
      ? `⚠ ${parsed.warning}（実行できません）`
      : parsed.argv.length
        ? `argv: ${JSON.stringify(parsed.argv)}（shell は経由しません）`
        : 'コマンドを入力してください';
    // 空入力や壊れた入力では押せないようにする（押して無反応は壊れて見える）
    if (!box.dataset.running) run.disabled = !parsed.argv.length || !!parsed.warning;
  };
  input.addEventListener('input', refresh);
  sel.addEventListener('change', () => { input.value = sel.value; refresh(); });
  refresh();

  // 標準入力の欄（#18）。走っているセッションにだけ出す。
  // ⚠️ **自動更新で作り直さない。** 入力途中の文字が消える
  //    （書き込み操作の入力を作り直さない規則と同じ理由）。
  const inbar = el('div', 'cmdbar');
  inbar.hidden = true;
  const inField = el('input');
  inField.placeholder = '送信する行（Enter）';
  inField.spellcheck = false;
  const sendBtn = el('button', null, '送信');
  const eofBtn = el('button', null, 'EOF');
  eofBtn.title = '標準入力を閉じる（入力待ちのプログラムを終わらせる）';
  inbar.append(inField, sendBtn, eofBtn);

  /**
   * 🚨 **「生きている合図」を出す固定の1行。**
   *
   * claude が長い応答を書いている間は**出力が1行も来ない**。`· Bash` も止まるので
   * **止まったように見える**（実機で「正しい回答じゃない」と読まれた。答えは
   * 沈黙のあとに届いていた）。しかも告知を種別ごと1回に絞ったので、
   * 唯一の心拍（`thinking_tokens`）も消えていた。
   *
   * ⚠️ 端末（スクロール領域）ではなく**固定行**に出す。流れる行に出すと
   *    上限のトリムで消え、追従判定も壊す。掴んで持ち、中身だけ書き換える。
   * ⚠️ タイマーは**必ず解除する**（張ったまま忘れると、終わったペインが
   *    イベントループを生かし続ける。実際に別の場所で踏んだ）。
   */
  const beat = el('div', 'note');
  beat.hidden = true;
  let beatTimer = null;
  let lastLineAt = 0;
  let startedAt = 0;
  let skippedCount = 0;
  /** 購読ループから呼ばれる（出力が来たこと・出さなかった件数） */
  const onActivity = ({ visible, skipped }) => {
    if (visible) lastLineAt = Date.now();
    skippedCount = skipped ?? 0;
  };
  const stopBeat = () => {
    if (beatTimer !== null) { clearInterval(beatTimer); beatTimer = null; }
    beat.hidden = true;
    // ⚠️ 中身も空にする。hidden でも textContent は残るので、
    //    「見える文字」を数える検査や支援技術には「実行中」が居続ける
    beat.textContent = '';
  };
  const tickBeat = () => {
    const now = Date.now();
    const since = Math.round((now - lastLineAt) / 1000);
    const age = Math.round((now - startedAt) / 1000);
    // 「出ていない」と「死んでいる」を区別できる形にする（数字を出す）
    beat.textContent = `⏳ 実行中 ${age}秒`
      + `（最後の出力から ${since}秒`
      + (skippedCount > 0 ? ` / 出していない行 ${skippedCount}件` : '')
      + '）';
  };
  const startBeat = () => {
    startedAt = Date.now();
    lastLineAt = Date.now();
    beat.hidden = false;
    tickBeat();
    if (beatTimer === null) beatTimer = setInterval(tickBeat, 1000);
  };

  /**
   * 🚨 **1ペインが購読するセッションは常に1本だけにする（8回目のレビュー。BLOCKING）。**
   *
   * 以前は再接続ボタンを何度でも押せて、`runExec` が同じ端末・同じ `onState` を
   * 共有したまま**2本同時に購読**できた。結果:
   *   - 入力欄の Enter は**最後に publish した方**に届く（画面に出ている行と無関係）。
   *     `git commit -F -` や y/N を読む CLI に誤送信すると取り返せない
   *   - どちらか一方が終わると `✖ exit=…` を出して心拍を消し停止も押せなくするのに、
   *     **もう1本は同じ端末に出力を続ける**（このリポジトリ最重の「嘘」の型）
   *   - `paneObj.abort` が上書き（実際には null に）されるので、ペインを捨てても
   *     古い購読が abort されず、サーバは購読者が居ると見なし続ける
   *
   * 世代番号で「今の購読」を決め、古い購読からの通知は捨てる。
   * 新しく始めるときは**前の購読を必ず abort し、端末を作り直す**
   * （再接続は `from: 0` で全部再生されるので、消しても情報は失われない）。
   */
  let gen = 0;
  let liveAbort = null;
  const beginRun = (argv, opts = {}) => {
    gen += 1;
    const myGen = gen;
    if (liveAbort) {
      try { liveAbort(); } catch { /* 既に閉じている */ }
      liveAbort = null;
    }
    // 端末を作り直す（前のセッションの行と混ざると、どちらの出力か判別できない）
    term.replaceChildren();
    runExec(term, scroll, wt, argv, st => {
      if (myGen !== gen) return;   // 古い購読の通知は捨てる
      // 🚨 検査用に、**門を通った遷移だけ**を記録する（`?probe=1` のときだけ）。
      //    ⚠️ 門の**前**で記録すると守りの有無で差が出ず、変異を測れない
      //    （最初そう書いた）。古い購読の「停止」は新しい購読の session レコードで
      //    数ミリ秒後に上書きされて回復するので、画面のサンプリングでは掠らない
      //    （50ms 間隔で測って変異が生き残った）。遷移列で見れば決定的。
      if (window.__kjpProbe) {
        (window.__kjpConsoleStates ??= []).push({
          running: !!st.running,
          id: st.sessionId ? String(st.sessionId).slice(0, 8) : null,
        });
      }
      onState(st);
    }, { ...opts, onActivity: ev => { if (myGen === gen) onActivity(ev); } });
  };

  let cur = null;
  const onState = st => {
    liveAbort = st.running ? st.abort : null;
    if (st.running) startBeat();
    else stopBeat();
    box.dataset.running = st.running ? '1' : '';
    stop.disabled = !st.running;
    input.disabled = st.running;
    run.disabled = st.running || !parsed.argv.length || !!parsed.warning;
    cur = st.running ? st : null;
    // ⚠️ ペインを捨てる前に呼ばれる。**これは kill ではなく購読解除**。
    //    サーバ側は猶予（既定5分）のあいだ走り続け、その間は再接続できる
    paneObj.abort = st.running ? st.abort : null;
    paneObj.sessionId = st.running ? st.sessionId : null;
    // 🚨 **購読中も一覧を出す（隠さない）。**
    //    以前は購読を始めた瞬間に隠していたので、
    //    (a) 走っている他のセッションが**見えなくなり**（このツールの要点は
    //        「N 本走っていることが分かる」こと）、
    //    (b) 隠れた古いボタンが「再接続」の字のまま DOM に残って、
    //        次の自動更新（15秒）まで**両方見られると誤解させる**（実測で落ちた）。
    //    購読の有無が変わったので、字（再接続 / 切替）を出し直す。
    if (paneObj.lastSessions) paneObj.showSessions(null);
    // 標準入力の欄は走っている間だけ出す
    inbar.hidden = !st.running;
    // 🚨 **送信先を必ず出す。** 以前は2本購読できて「最後に再接続した方」に
    //    届いていたので、どこへ送るのか画面から分からなかった。
    //    1本だけになった今も、id を出して「見ている行の主」と一致させる。
    const to = st.sessionId ? ` → ${String(st.sessionId).slice(0, 8)}` : '';
    inField.placeholder = st.chat
      ? `claude に送るメッセージ（Enter）${to}`
      : `送信する行（Enter）${to}`;
    chatBtn.disabled = st.running || !session.allowExec;
  };
  const start = (opts) => {
    if (parsed.warning || !parsed.argv.length) return;
    beginRun(parsed.argv, opts);
  };

  const send = async () => {
    const text = inField.value;
    if (!text || !cur?.write) return;
    inField.value = '';
    // 会話モードなら stream-json の1行にする。素のモードは行をそのまま送る
    const r = await cur.write(cur.chat ? chatLine(text) : `${text}\n`);
    // 送れなかったら入力を戻す（打ち直させない）
    if (!r?.ok) inField.value = text;
  };
  sendBtn.addEventListener('click', send);
  // 🚨 **IME の変換確定の Enter で発火させない。** 日本語で打つ前提の UI なのに
  //    `isComposing` を見ていなかったので、変換候補を確定する Enter が
  //    送信/実行を撃っていた。標準入力側は**未変換の読み**を stdin に書いて欄を空にし、
  //    直後の compositionend で変換後の文字列が空欄に戻るので、1つのメッセージが
  //    「読みだけ送信」+「漢字が欄に残る」に割れる。実行側はさらに悪く、
  //    半端な文字列を splitArgv して **worktree でそのまま実行**する。
  //    ⚠️ `keyCode === 229` も見る（古い IME は isComposing を立てずに 229 を送る）。
  inField.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) send();
  });
  eofBtn.addEventListener('click', () => cur?.write?.('', true));
  chatBtn.addEventListener('click', () => {
    // 会話は専用の argv で始める（入力欄の内容は使わない）
    // ⚠️ `chat` は argv から導く（渡す値と argv がずれない形にする）
    beginRun(CHAT_ARGV, { chat: isChatArgv(CHAT_ARGV), keepAlive: true });
  });

  run.addEventListener('click', start);
  // 🚨 実行側も同じ（IME の確定 Enter で半端な argv を実行しない）
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229 && !run.disabled) start();
  });
  // ⚠️ 「停止」は本当に止める（kill）。abort だけでは切断にすぎず、
  //    サーバ側は猶予のあいだ走り続ける
  stop.addEventListener('click', async () => {
    await cur?.kill?.();
    cur?.abort?.();
  });

  // 🚨 **描画の予算を実ブラウザで測るための入口（#3）。**
  //    `?probe=1` のときだけ出す。コメントで「速い」と主張する代わりに、
  //    **runExec と同じ `makeTermWriter` を通して**最長ブロック時間を測る
  //    （v0/render-check.mjs が CDP で叩く）。
  //    ⚠️ 直接 DOM を触る入口にすると、測っている対象が変わって根拠にならない。
  if (window.__kjpProbe && !window.__kjpFeedTerm) {
    const probeWriter = makeTermWriter(term, scroll);
    window.__kjpFeedTerm = s => probeWriter.line('', s);
  }

  box.append(bar, peek, beat, resume, scroll, inbar);
  return box;
}

/**
 * パスのゆるい一致。サーバは `samePath()`（realpath / 大文字小文字 / 区切り）で
 * 厳密に照合しているが、ブラウザ側では realpath が出来ない。
 * ⚠️ **これを認可に使わない。** 表示上「どのペインに出すか」を決めるだけ。
 *    認可はサーバ側の allowlist が持つ。
 */
function samePathish(a, b) {
  if (typeof a !== 'string' || typeof b !== 'string') return false;
  const n = s => s.replace(/[\\/]+/g, '/').replace(/\/+$/, '').toLowerCase();
  return n(a) === n(b);
}

/* ===== checkout ===== */
// checkout の選択を worktree ごとに覚えておく。
// ⚠️ カードは毎回作り直すので、覚えないと 15 秒の自動更新で選択が先頭へ戻る。
//    書き込み操作なので「選んだ直後に更新が挟まると別ブランチに checkout する」
//    という誤爆になる（--allow-write はフックを起動する＝実質コード実行。
//    レビューで実測）。
const checkoutSel = new Map();     // wt.path -> 選択中のブランチ

function checkoutForm(wt, s) {
  const box = el('div', 'wr');
  const sel = el('select');
  // 候補は payload の localBranches だけから作る。グラフの refs から推測すると
  // remote-tracking が混ざり、checkout すると detached HEAD になる。
  const inUse = new Set(s.worktrees.map(w => w.branch).filter(Boolean));
  const cands = (s.localBranches ?? []).filter(r => r && !inUse.has(r));
  const MAX_CANDS = 40;
  for (const r of cands.slice(0, MAX_CANDS)) { const o = el('option', null, r); o.value = r; sel.append(o); }
  // 前回の選択を復元する（自動更新で先頭へ戻らないように）
  const remembered = checkoutSel.get(wt.path);
  if (remembered && cands.includes(remembered)) sel.value = remembered;
  sel.addEventListener('change', () => checkoutSel.set(wt.path, sel.value));
  const btn = el('button', null, 'checkout');
  const msg = el('span', 'wrmsg');
  if (cands.length > MAX_CANDS) {
    // 打ち切りを黙って隠さない
    msg.textContent = `候補 ${cands.length} 本のうち ${MAX_CANDS} 本を表示`;
  }
  if (!cands.length) {
    btn.disabled = true; sel.disabled = true;
    msg.textContent = '切り替え先がありません（全ブランチが使用中）';
  }
  btn.addEventListener('click', async () => {
    btn.disabled = true; msg.className = 'wrmsg'; msg.textContent = '実行中…';
    try {
      const res = await fetch('/api/v0/checkout', {
        method: 'POST',
        headers: { 'content-type': 'application/json', [session.tokenHeader]: session.token ?? '' },
        body: JSON.stringify({ worktree: wt.path, ref: sel.value }),
      });
      const d = await res.json();
      if (!res.ok) throw new Error(d.error ?? `HTTP ${res.status}`);
      // detached になったら黙って成功にしない（そのブランチは以後進まない）
      msg.textContent = d.detached
        ? `→ detached (${d.head?.slice(0, 8)}) ⚠ ${d.warning ?? ''}`
        : `→ ${d.branch ?? d.head?.slice(0, 8)}`;
      if (d.detached) msg.className = 'wrmsg bad';
      await load(true);
    } catch (e) {
      msg.className = 'wrmsg bad'; msg.textContent = e.message; btn.disabled = false;
    }
  });
  box.append(sel, btn, msg);
  return box;
}

/* ===== 差分更新 =====
   ⚠️ 走っているコンソールを壊さないため、ペインは作り直さず中身だけ差し替える。
      コンソールは worktree の集合が変わった時だけ作り直す。 */
const panes = new Map();     // id -> {p, body, ttl, tagBox, abort?, holder?}

// 「render が求めた順」を記録するための通し番号（applyLayout が既定の並びに使う）
let paneSeq = 0;

function ensurePane(host, id, title, tags) {
  let obj = panes.get(id);
  if (!obj) {
    obj = pane(id, title, tags);
    obj.defaultHost = host.id;
    panes.set(id, obj);
    // ここでは既定の入れ物に付けるだけ。**どこに置くかは applyLayout が決める**
    // （保存された配置 → 無ければ既定）。描画の途中で親の無いペインを作らない。
    host.append(obj.p);
    scheduleLayout();
  } else {
    // 🚨 **ここで `host.append` してはいけない。** 以前はそうしていたので、
    //    15秒ごとの自動更新が「利用者が移した先」を毎回巻き戻した。
    //    置き場所の決定は applyLayout の1箇所に集める（散らすと片方を直しても
    //    もう片方が巻き戻す）。
    obj.defaultHost = host.id;
    obj.ttl.textContent = title;
    setTags(obj.tagBox, tags);
  }
  // ⚠️ **毎回付け替える。** 作った順に固定すると、後から増えた worktree が
  //    アルファベット順の途中に入るべきなのに必ず末尾になる。
  obj.defaultRank = paneSeq++;
  return obj;
}

/**
 * 不要になったペインを片付ける。
 * ⚠️ **捨てる前に必ず abort する。** 中断せずに DOM を捨てると、
 *    サーバは切断を検知できず（res.on('close') が発火しない）、
 *    子プロセスが --exec-timeout まで走り続けて実行枠を食い潰す
 *    （レビューで実測: 4回の worktree 増減で 8枠が尽きる）。
 */
function dropPanes(prefix, keepIds) {
  for (const [id, obj] of [...panes]) {
    if (!id.startsWith(prefix) || keepIds.has(id)) continue;
    try { obj.abort?.(); } catch { /* 既に終わっている */ }
    obj.p.remove();
    panes.delete(id);
    // ⚠️ 捨てた分のスプリッタが余るので置き直す（placePanes が作り直す）
    scheduleLayout();
  }
}

function wtTags(wt) {
  const tags = [['br', wt.branch ?? wt.name]];
  if (wt.status?.dirty) tags.push(['dirty', 'dirty']);
  if (wt.prunable) tags.push(['danger', 'prunable']);
  if (wt.bare) tags.push(['', 'bare']);
  const q = wt.sequencer ?? {};
  for (const [f, l] of [['rebasing', 'rebasing'], ['merging', 'merging'],
    ['cherryPicking', 'cherry-pick'], ['reverting', 'revert'],
    ['bisecting', 'bisect'], ['sequencing', 'sequencer']]) {
    if (q[f]) tags.push(['danger', l]);
  }
  return tags;
}

/**
 * エージェントの活動。
 *
 * ⚠️ **`--watch-agents` が無いときはペインを作らない。** 空の枠を出すと
 *    「観測しているのに何も出ていない（=止まっている）」と読めてしまう。
 *    無効なときは「機能が無効」であることを1行で言う（黙って消えない）。
 * ⚠️ 出せるのはサーバが払い出したものだけ。発話とコマンド行は
 *    --allow-transcript-text のときだけ text[] と recent[].command に入る
 *    （抽出は許可リスト方式。v0/transcript.mjs）。
 * ⚠️ **ただしパスは自由文**（ファイル名は任意の文字列）。160 文字で切って
 *    `pathClipped` で告知する（#38。docs/agent-observation.md に残るリスクを書いた）。
 */
/**
 * 🚨 **全セッションの監視盤（N 個の Claude を並列で回すため）。**
 *
 * worktree ごとのコンソールは既にあるが、**どのペインを見ればよいかが分からない**
 * のが並列運用の一番の障害だった（「見えるがやれることが少ない」の中身）。
 * ここでは購読せずに全セッションの状態と**最後の出力**を並べ、
 * そのまま**入力**と**停止**ができる。
 *
 * ⚠️ 出力はコマンドの結果なので、経路は exec の関門越し（`/api/v0/exec/list`）。
 *    トークンが無いときは「使えない」と1行出す（有効に見えて 403 を作らない）。
 */
/**
 * 監視盤の掴んでいる要素。
 *
 * 🚨 **行は id 単位で使い回す。**（`docs/review-ui-conflicts.md` の規則）
 *    自動更新のたびに作り直すと、**打っている途中の入力が消え**、
 *    さらに送信先の対象がずれる。行は Map で持ち、
 *    要素は後から `querySelector` で探さずオブジェクトに持つ。
 */
const monitorRows = new Map();
let monitorUI = null;
let monitorBusy = false;

function monitorMount(pane) {
  // ペインが捨てられて作り直されたら、掴んでいた要素は使えない
  if (monitorUI && pane.body.contains(monitorUI.list)) return monitorUI;
  const status = el('div', 'note');
  const list = el('div');
  list.style.padding = '0 .4rem .4rem';
  pane.body.replaceChildren(status, list);
  monitorRows.clear();
  monitorUI = { status, list };
  return monitorUI;
}

/**
 * 監視盤の1行に出す「最後の出力」。
 *
 * 🚨 会話モードは `chatGlance` で1行にする（生の stream-json は読めない）。
 * ⚠️ **解釈できなかったことを隠さない。** 生のまま出して、そう告げる。
 * @param {object} x セッション（`/api/v0/exec/list` の1件）
 * @param {boolean} chat 会話モードか（argv から判定済み）
 */
function monitorGlance(x, chat) {
  if (!x.lastOutput) return '';
  const g = chat ? chatGlance(x.lastOutput) : { text: x.lastOutput, interpreted: true };
  // 1行に潰す（行の構造が要るのは解釈側だけ。表示は狭い箱に収める）
  const flat = g.text.replace(/\s+/g, ' ').trim();
  const cut = flat.length > 200 ? `…${flat.slice(-200)}` : flat;
  return `› ${cut}`
    + (chat && !g.interpreted ? '  ← 解釈できない行' : '')
    + (x.lastOutputMasked ? '  ← 出力の秘密は落としています' : '');
}

function monitorRow(x) {
  const found = monitorRows.get(x.id);
  if (found) return found;
  const root = el('div', 'ab');
  root.style.margin = '.35rem 0';
  root.style.paddingTop = '.35rem';
  root.style.borderTop = '1px solid var(--line)';
  const head = el('div');
  const cmd = el('div', 'note');
  cmd.style.padding = '.1rem 0';
  const out = el('div', 'note');
  out.style.padding = '.1rem 0';
  out.style.whiteSpace = 'pre-wrap';
  const bar = el('div', 'cmdbar');
  bar.style.border = '0';
  bar.style.background = 'transparent';
  const inp = el('input');
  const sb = el('button', null, '送信');
  const kb = el('button', null, '停止');
  // ⚠️ 「切断」は購読解除でしかない（#17）。文言で混同しない
  kb.title = '本当に止めます（購読をやめるだけの「切断」とは違います）';
  const msg = el('div', 'wrmsg');
  msg.style.padding = '0 .3rem';
  msg.hidden = true;
  bar.append(inp, sb, kb);
  root.append(head, cmd, out, bar, msg);
  const row = {
    id: x.id, chat: isChatArgv(x.argv ?? []),
    root, head, cmd, out, bar, inp, sb, kb, msg,
  };
  const say = (text, bad) => {
    row.msg.textContent = text;
    row.msg.classList.toggle('bad', Boolean(bad));
    row.msg.hidden = !text;
  };
  const post = async (path, payload) => {
    const r = await fetch(`/api/v0/exec/${encodeURIComponent(row.id)}/${path}`, {
      method: 'POST',
      headers: { 'content-type': 'application/json', [session.tokenHeader]: session.token },
      body: JSON.stringify(payload ?? {}),
    });
    if (r.ok) return null;
    const b = await r.json().catch(() => ({}));
    return b.error ?? `HTTP ${r.status}`;
  };
  const send = async () => {
    const text = row.inp.value;
    if (!text) return;
    row.inp.value = '';
    say('送信中…');
    try {
      // 🚨 会話モードなら stream-json の1行にする（argv から判定する。
      //    送る側が形式を推測すると、素のテキストが会話に混ざって無視される）
      const err = await post('input', { data: row.chat ? chatLine(text) : `${text}\n` });
      if (err) { row.inp.value = text; say(`✖ ${err}`, true); return; }
      say('');
    } catch (e) { row.inp.value = text; say(`✖ ${e.message}`, true); }
  };
  // ⚠️ IME の変換確定 Enter で送らない（未確定の読みが送られる）
  row.inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) send();
  });
  row.sb.addEventListener('click', send);
  row.kb.addEventListener('click', async () => {
    row.kb.disabled = true;
    say('停止を要求しました（本当に止まったかは次の更新で見えます）');
    try {
      const err = await post('kill');
      if (err) { say(`✖ 停止できません: ${err}`, true); row.kb.disabled = false; return; }
      await renderMonitor();
    } catch (e) { say(`✖ ${e.message}`, true); row.kb.disabled = false; }
  });
  monitorRows.set(x.id, row);
  return row;
}

async function renderMonitor() {
  if (!session.allowExec) return;   // 経路そのものが無い（--allow-exec 無し）
  const pane = ensurePane($('#left'), 'monitor', 'セッション監視', []);
  const ui = monitorMount(pane);
  if (!session.canMutate) {
    // 有効に見えるのに 403 を返す状態を作らない
    ui.status.className = 'note warn';
    ui.status.textContent = '⚠ 監視は実行の鍵が要ります。'
      + ' 鍵は URL に載せていないので、コンソールの「鍵を貼る」から渡してください';
    return;
  }
  if (monitorBusy) return;   // 重なった更新で二重に数えない
  monitorBusy = true;
  try {
    let body;
    try {
      const r = await fetch('/api/v0/exec/list', {
        method: 'POST',
        headers: { 'content-type': 'application/json', [session.tokenHeader]: session.token },
      });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      body = await r.json();
    } catch (e) {
      // ⚠️ 失敗しても行は消さない（打っている途中に1回失敗するのは普通）
      ui.status.className = 'note warn';
      ui.status.textContent = `⚠ 監視の取得に失敗: ${e.message}`;
      return;
    }
    const sessions = Array.isArray(body.sessions) ? body.sessions : [];
    const limits = body.limits ?? {};
    const live = sessions.filter(x => x.state === 'starting' || x.state === 'running');
    setTags(pane.tagBox, [['', `${live.length}/${limits.maxConcurrent ?? '?'} 稼働`]]);
    ui.status.className = 'note';
    ui.status.textContent = sessions.length
      ? `${sessions.length} 件（稼働 ${live.length}）。打ちたい方に直接送れます`
      : 'セッションはありません（下のコンソールから起動できます）';
    const seen = new Set();
    for (const x of sessions) {
      seen.add(x.id);
      const row = monitorRow(x);
      const alive = x.state === 'starting' || x.state === 'running';
      const name = (x.worktree ?? '').split(/[\\/]/).pop() || '(不明)';
      const mark = alive ? '▶' : (x.exit && x.exit.code === 0 ? '✔' : '■');
      // 経過と寿命を必ず出す（いつ殺されるかを黙らせない）
      const bits = [`${Math.round(x.ageMs / 1000)}秒`];
      if (alive && limits.timeoutMs) {
        bits.push(`残り約${Math.max(0, Math.round((limits.timeoutMs - x.ageMs) / 1000))}秒で上限`);
      }
      if (alive && !x.keepAlive && x.detachedMs !== null && x.detachedMs !== undefined) {
        const grace = limits.detachedGraceMs
          ? `（残り約${Math.max(0, Math.round((limits.detachedGraceMs - x.detachedMs) / 1000))}秒）`
          : '';
        bits.push(`切断中${Math.round(x.detachedMs / 1000)}秒${grace}`);
      }
      if (x.inputPending > 0) bits.push(`入力滞留${x.inputPending}B`);
      if (x.dropped > 0) bits.push(`出力${x.dropped}件省略`);
      if (!alive && x.exit) bits.push(`exit=${x.exit.code ?? x.exit.signal ?? '?'}`);
      row.head.replaceChildren(
        el('b', null, `${mark} ${name}`),
        el('span', null, `  ${bits.join(' / ')}`),
      );
      // argv（秘密はサーバ側でマスク済み。マスクしたことも出す）
      // 🚨 **上限をかける。** `node -e '<スクリプト>'` のような巨大な引数を
      //    そのまま出していたので、狭い画面では1セッションの行が画面数枚分になった。
      //    省略したことは必ず言う（「これが全部のコマンド」と読ませない）。
      const cmd = argvSummary(x.argv ?? []);
      row.cmd.textContent = `$ ${cmd.text}`
        + (cmd.clipped ? '  ← 長いので省略' : '')
        + (x.argvMasked ? '  ← 秘密は落としています' : '');
      // 🚨 **最後の出力を出す。** これが無いと「どれに入力すべきか」が分からない。
      //    ⚠️ 会話モードの出力は**1行1レコードの JSON** なので、生で出すと読めない
      //    （並列で回すための画面なのに目的が失われる）。`chatGlance` で1行にする。
      //    解釈できなかったことは隠さない（生のまま出して、そう告げる）
      row.out.textContent = monitorGlance(x, row.chat);
      row.out.hidden = !row.out.textContent;
      row.bar.hidden = !alive;
      row.inp.placeholder = `${name} に送る（Enter）`;
      if (!alive) row.msg.hidden = row.msg.textContent === '';
      if (!row.root.parentNode) ui.list.append(row.root);   // 並びは古い順で安定
    }
    for (const [id, row] of monitorRows) {
      if (seen.has(id)) continue;
      row.root.remove();
      monitorRows.delete(id);
    }
  } finally { monitorBusy = false; }
}

function renderAgents(s) {
  if (!s.agents) {
    dropPanes('agents', new Set());
    return;
  }
  const live = s.agents.filter(a => a.state === 'active').length;
  const tags = live ? [['', `稼働 ${live}`]] : [['', '稼働なし']];
  // ⚠️ 見出しは短くする。左カラムは狭く、`text-overflow: ellipsis` で
  //    「エージェントの活…」になって読めなかった（実測）
  const p = ensurePane($('#left'), 'agents', 'エージェント', tags);
  const box = el('div');
  box.style.padding = '.4rem';
  const wtByPath = new Map(s.worktrees.map(w => [w.path, w]));
  for (const a of s.agents) {
    // ⚠️ 差分として開けるのは base との差分にあるファイルだけ。
    //    「触った」と「差分がある」は別なので、開けないパスをリンクにしない
    //    （押しても何も起きない、という行き止まりを作らない）
    const wt = wtByPath.get(a.path);
    const openable = new Set((wt?.files ?? []).map(f => f.path));
    const d = el('div', 'ab');
    d.style.margin = '.25rem 0';
    const head = el('div');
    head.append(el('b', null, a.name));
    const label = { active: '稼働中', idle: '待機', stale: '古い記録', none: '記録なし' }[a.state] ?? a.state;
    head.append(el('span', `tag ${a.state === 'active' ? 'br' : ''}`, label));
    // ⚠️ 経過時間を必ず添える。「待機」だけでは 1分と3日を区別できない
    // ⚠️ 経過時間・権限・サブは1つの span にまとめる。別々にすると
    //    狭い画面で「/ 権限」と「auto」が別行に割れて読めなくなる（実測）
    const meta = [
      a.lastActivityAt ? when(a.lastActivityAt) : null,
      a.permissionMode ? `権限 ${a.permissionMode}` : null,
      // 🚨 サブエージェントは**親の記録には出ない**ので別に数えている（#28）。
      //    親が待っている間にサブが動いていると、これが無いと「待機」と嘘になる
      a.subagents?.total
        ? `サブ ${a.subagents.active}/${a.subagents.total} 稼働`
        : (a.sidechains ? `サブ ${a.sidechains}` : null),
      a.activityFrom === 'subagent' ? '（最後の活動はサブ）' : null,
    ].filter(Boolean);
    if (meta.length) head.append(el('span', 'note', ` ${meta.join(' / ')}`));
    d.append(head);
    // 🚨 **「記録なし」と「読めなかった」を分ける。** 以前は1レコードが
    //    大きすぎて（実データに 1.25MB がある）完全な行が取れないと
    //    state='none' になり、**稼働中のエージェントに「記録がありません」と
    //    表示**していた（#27）。
    if (a.tooBigToRead) {
      d.append(el('div', 'note warn',
        '⚠ 記録の1レコードが大きすぎて読めませんでした（記録が無いのではありません）。'
        + ` 末尾 ${Math.round((a.bytesRead ?? 0) / 1024)}KB を読んでも完全な行がありません。`));
      box.append(d);
      continue;
    }
    if (a.state === 'none') {
      // 🚨 **「記録が無い」と「抽出できなかった」を分ける。** 窓の中が全部
      //    「知らない種別」でも `state:'none'` になる。実データには許可リスト外の
      //    type が 304KB 連続する箇所があり、5秒前に Edit を書いたエージェントに
      //    「走らせた記録がありません」と断言していた（#37）
      d.append(a.noneReason === 'no-known-records'
        ? el('div', 'note warn',
          '⚠ 記録はありますが、活動を抽出できませんでした（記録が無いのではありません）。'
          + ` 読んだ範囲（${Math.round((a.bytesRead ?? 0) / 1024)}KB）が`
          + '全部「知らない種別」です。')
        : a.noneReason === 'no-timestamp'
          ? el('div', 'note warn',
            '⚠ 記録はありますが、時刻が読める行がありませんでした（記録が無いのではありません）。')
          : el('div', 'note', 'この worktree でエージェントを走らせた記録がありません。'));
      box.append(d);
      continue;
    }
    const counts = Object.entries(a.toolCounts ?? {});
    if (counts.length) {
      d.append(el('div', 'note',
        counts.map(([k, v]) => `${k} ${v}`).join(' · ')
        + (a.talk ? ` · 発話 ${a.talk}` : '')));
    }
    // ⚠️ 連続する同じ内容を畳む。`Bash` を5行並べても情報量は1行ぶんで、
    //    そのぶん**古い活動が押し出されて見えなくなる**（実測でそうなった）
    const runs = [];
    for (const r of a.recent ?? []) {
      const last = runs[runs.length - 1];
      // ⚠️ 畳む鍵に「パスが無い理由」も入れる。入れないと `(リポジトリ外)` と
      //    `(worktree ルート)` が同じ1行に畳まれて、また区別が消える
      if (last && last.tool === r.tool && last.path === r.path
          && pathLabel(last) === pathLabel(r) && last.command === r.command) {
        last.n++;
        continue;
      }
      runs.push({ ...r, n: 1 });
    }
    for (const r of runs.slice(0, 6)) {
      const line = el('div', 'ab');
      line.style.margin = '0';
      // 🚨 **「外」と言ってよいのは outside だけ。** worktree ルート自身と
      //    表示できない形は**中**なので、別の文字を出す（pathlabel.mjs）
      const what = pathLabel(r);
      line.append(el('span', 'tag', r.n > 1 ? `${r.tool} ×${r.n}` : r.tool));
      if (what) {
        if (r.path && wt && openable.has(r.path)) {
          const link = el('span', 'f');
          link.textContent = r.path;
          link.style.display = 'inline';
          link.addEventListener('click', () => openDiff(wt, r.path));
          line.append(link);
        } else line.append(el('span', 'note', what));
      }
      // 🚨 省略したら告知する。切れたパスは**別のファイルを指すか何も指さない**ので
      //    開けない（`openable` に無いのでリンクにもならない）。黙って出すと
      //    「そのファイルを触った」という誤読になる（#38）
      if (r.pathClipped) line.append(el('span', 'note', ' (パスが長いので省略)'));
      // ⚠️ 相対パスの基準が不明・worktree ルート・表示できない形は `pathLabel` が
      //    それぞれの文字を返す（ここで二重に出さない）
      if (r.sidechain) line.append(el('span', 'note', ' (サブ)'));
      // 🚨 マスクしたことを言う（黙って消すと「そう打っていない」と誤読される）
      if (r.command) {
        line.append(el('div', 'note',
          `$ ${r.command}${r.commandMasked ? '   ← 秘密を落としました' : ''}`));
      }
      d.append(line);
    }
    for (const t of a.text ?? []) {
      const q = el('div', 'note');
      // 🚨 発話にもマスクが掛かる（サーバ側）。**落としたことを言う。**
      //    コマンド行だけ告知していて発話は黙って消していた（同じ約束を片方で破っていた）
      q.textContent = `${t.role === 'assistant' ? '◂' : '▸'} ${t.text}`
        + (t.masked ? '   ← 秘密を落としました' : '');
      d.append(q);
    }
    if (a.tailOnly) d.append(el('div', 'note', `⚠ 記録の末尾 ${Math.round((a.bytesRead ?? 0) / 1024)}KB だけを読んでいます`));
    box.append(d);
  }
  // ⚠️ 何を出していないかは必ず言う（黙って省略しない）。ただし1行は短く保つ
  box.append(el('div', 'note', s.agentsText
    ? '発話とコマンド行を出しています。'
    : '発話とコマンド行は出していません。'));
  box.append(el('div', 'note',
    'ツールの結果（読んだファイルの中身・コマンド出力）は出しません。'));
  p.body.replaceChildren(box);
}

function render(s) {
  state = s;
  $('#repo').textContent = `${s.repo}   base: ${s.base}`;
  $('#at').textContent = when(s.generatedAt);

  // 警告（安全に関わるので畳めない位置）
  const alerts = $('#alerts');
  alerts.replaceChildren();
  for (const e of s.errors ?? []) {
    const d = el('div', 'alert');
    d.append(el('b', null, `${e.scope}: `), document.createTextNode(e.message));
    alerts.append(d);
  }
  for (const wt of s.worktrees) {
    for (const w of wt.warnings ?? []) {
      const d = el('div', `alert ${w.level === 'danger' ? 'danger' : ''}`);
      d.append(el('b', null, `${wt.name}: `), document.createTextNode(w.message));
      alerts.append(d);
    }
  }

  // 左: worktree カード + ファイラ
  const dirty = s.worktrees.filter(w => w.status?.dirty).length;
  const wtPane = ensurePane($('#left'), 'worktrees',
    `Worktrees ${s.worktrees.length}`, dirty ? [['dirty', `dirty ${dirty}`]] : []);
  const cards = el('div', 'cards');
  for (const wt of s.worktrees) {
    const c = el('div', 'card');
    const h = el('h3');
    h.append(el('span', null, wt.name));
    for (const [cls, text] of wtTags(wt).slice(1)) h.append(el('span', `tag ${cls}`, text));
    if (wt.branch) h.append(el('span', 'tag br', wt.branch));
    c.append(h);
    const ab = el('div', 'ab');
    ab.textContent = `+${wt.ahead} / -${wt.behind}`
      + (wt.status ? ` · 変更 ${wt.status.changed} · 未追跡 ${wt.status.untracked}` : '')
      + (wt.status?.unmerged ? ` · 未解決 ${wt.status.unmerged}` : '');
    c.append(ab);
    if (wt.prunable) c.append(el('div', 'ab', `失われています: ${wt.prunableReason ?? '理由不明'}`));
    // 🚨 **押せるのに必ず失敗する操作を描かない。** 書き込みは `X-Kjp-Token` を
    //    要求するので、トークンを持っていないなら checkout は必ず 403 になる。
    //    それでもフォームを出していたので「有効に見えて動かない」状態だった
    //    （レビューで実測。BLOCKING）。
    if (session.allowWrite && !wt.bare && !wt.prunable) {
      if (session.canMutate) c.append(checkoutForm(wt, s));
      else if (!wt.prunable) {
        c.append(el('div', 'note warn',
          '⚠ checkout はトークンが無いので使えません。'
          + ' 起動時に表示された ?token=… 付きの URL を開き直してください。'));
      }
    }
    cards.append(c);
  }
  wtPane.body.replaceChildren(cards);

  // 衝突予測。「同じファイルを触っている」は代理指標なので、実際にマージしてみた結果を出す
  const conf = s.conflicts ?? [];
  const bad = conf.filter(c => !c.clean);
  const cPane = ensurePane($('#left'), 'conflicts', '衝突予測',
    bad.length ? [['danger', `${bad.length} ペア`]] : [['', conf.length ? 'なし' : '候補なし']]);
  const cBox = el('div');
  cBox.style.padding = '.4rem';
  if (!conf.length) {
    cBox.append(el('div', 'note',
      '同じファイルを触っている worktree のペアがありません。'));
  }
  for (const c of conf) {
    // clean は true / false / null（読み切れず不明）の3値
    const mark = c.clean === true ? '✔' : c.clean === false ? '✖' : '?';
    const d = el('div', c.clean === true ? 'ab' : 'alert danger');
    d.style.margin = '.2rem 0';
    d.append(el('b', null, `${mark} ${c.a} × ${c.b}`));
    if (c.clean === true) d.append(document.createTextNode(' — きれいにマージできます'));
    else if (c.clean === null) {
      // 🚨 「判定できない」の**理由**を出す。理由が無いと利用者は
      //    「衝突する」と読んでしまう（submodule はまさにそれだった。#2）
      d.append(document.createTextNode(
        c.reason ? ` — ${c.reason}`
          : c.truncated ? ' — 差分が大きすぎて判定できませんでした' : ' — 判定できませんでした'));
      for (const f of c.files ?? []) {
        const path = typeof f === 'string' ? f : f.path;
        if (typeof f === 'object' && f.undecidable) {
          d.append(el('div', 'ab', `  ${path} ← ${f.why}`));
        }
      }
    } else {
      // 衝突したファイルを押したら A 側の差分を開く。押せる相手を先に決めておく
      const aWt = (state?.worktrees ?? []).find(w => samePathish(w.path, c.aPath));
      for (const f of c.files ?? []) {
        // ⚠️ サーバは `{path, synthetic, of, why}` を返す（古い形の文字列にも耐える）
        const path = typeof f === 'string' ? f : f.path;
        const row = el('div', 'ab');
        const synthetic = typeof f === 'object' && f.synthetic;
        // 🚨 **開けないものを普通のファイル名として出さない。** `merge-tree` は
        //    実在しない退避名（`thing~B`）を返すので、押しても開けない
        //    行き止まりになっていた（#1）。理由を添える。
        if (synthetic) {
          row.append(document.createTextNode(`  ${path}`));
          row.append(el('span', 'note',
            ` ← 開けません: ${f.why}${f.of ? `。実体は ${f.of}` : ''}`));
        } else if (aWt) {
          // 🚨 **実在するパスは押せるようにする。** 「表示されているのに開けない」を
          //    合成パスだけの話にしない（#1 の完了条件は「開ける形か、
          //    理由つきで開けない形のどちらか」）。開くのは **A 側 × base** の差分で、
          //    A×B の差分ではないので**そう書く**（何を見ているか誤解させない）。
          row.append(document.createTextNode('  '));
          const link = el('span', 'f');
          link.textContent = path;
          link.style.display = 'inline';
          link.title = `${c.a} の差分（base と比べたもの）を開きます`;
          link.addEventListener('click', () => openDiff(aWt, path));
          row.append(link);
          row.append(el('span', 'note', ` ← 押すと ${c.a} 側の差分（base と比較）`));
        } else {
          row.append(document.createTextNode(`  ${path}`));
          row.append(el('span', 'note',
            ` ← 開けません: ${c.a} の worktree が一覧にありません`));
        }
        d.append(row);
      }
    }
    cBox.append(d);
  }
  // 取り込み順序の提案（純ロジック。追加の git 呼び出しは0）
  const plan = s.mergePlan;
  if (plan && (plan.batch.length || plan.deferred.length)) {
    cBox.append(el('div', 'ab', '── 取り込み順序の提案 ──'));
    if (plan.batch.length) {
      const d = el('div', 'ab');
      d.append(el('b', null, '① まとめて取り込める: '),
        document.createTextNode(plan.batch.join(' → ')));
      d.append(el('div', 'note', '（この塊は全ペアを検査済みで、どれも衝突しません）'));
      // 🚨 **提案だけで終わらせない。** ここが「見えるがやれることが少ない」の中心だった。
      //    押せるのは `--allow-write` があるときだけ。サーバ側は
      //    「衝突しないと予測できたもの」しか実行しない（それ以外は 409 で理由を返す）。
      if (session.allowWrite && session.canMutate) {
        const target = (state?.worktrees ?? []).find(w => w.shortBranch === state?.base)
          ?? (state?.worktrees ?? [])[0];
        if (target) {
          const row = el('div', 'ab');
          row.append(el('span', 'note', `${target.name} (${target.shortBranch ?? 'detached'}) に取り込む: `));
          for (const br of plan.batch) {
            // 取り込み先自身は押せない（サーバも 400 で断る）
            if (br === target.shortBranch) continue;
            const b = el('button', null, br);
            b.title = `${br} を ${target.name} に取り込む（衝突しないと予測できた場合だけ実行されます）`;
            b.addEventListener('click', async () => {
              b.disabled = true;
              const note = el('div', 'note');
              row.append(note);
              note.textContent = `${br} を取り込んでいます…`;
              try {
                const r = await fetch('/api/v0/merge', {
                  method: 'POST',
                  headers: {
                    'content-type': 'application/json',
                    [session.tokenHeader]: session.token,
                  },
                  body: JSON.stringify({ worktree: target.path, branch: br }),
                });
                const body = await r.json().catch(() => ({}));
                if (!r.ok) {
                  // 🚨 **断られた理由をそのまま出す。** 「できません」だけだと
                  //    何を直せばよいか分からない（衝突 / dirty / driver / 進行中）
                  note.className = 'note warn';
                  note.textContent = `✖ ${br}: ${body.error ?? `HTTP ${r.status}`}`;
                  b.disabled = false;
                  return;
                }
                note.textContent = `✔ ${br} を取り込みました`
                  + (body.warning ? `  ${body.warning}` : '');
                await load(true);
              } catch (e) {
                note.className = 'note warn';
                note.textContent = `✖ ${br}: ${e.message}`;
                b.disabled = false;
              }
            });
            row.append(b);
          }
          if (row.querySelector('button')) d.append(row);
        }
      } else if (session.allowWrite && !session.canMutate) {
        d.append(el('div', 'note warn',
          '⚠ 取り込みには書き込みの鍵が要ります。'
          + ' 鍵は URL に載せていないので、コンソールの「鍵を貼る」から渡してください'));
      } else {
        d.append(el('div', 'note',
          '（画面から取り込むには --write が必要です。今は読み取り専用です）'));
      }
      cBox.append(d);
    }
    for (const df of plan.deferred) {
      const d = el('div', 'ab');
      d.append(el('b', null, `② 手当が必要: ${df.label}`));
      // ⚠️ deferred 同士の衝突も出す。塊との衝突だけ見せると
      //    「順に手当すれば済む」と誤読される（2周目で驚く）
      const withBatch = df.conflictsWithBatch ?? df.conflictsWith ?? [];
      const withDef = df.conflictsWithDeferred ?? [];
      if (withBatch.length) d.append(document.createTextNode(`（①の ${withBatch.join(', ')} と衝突）`));
      if (withDef.length) {
        d.append(el('div', 'ab', `  ⚠ ${withDef.join(', ')} とも衝突します（手当同士がぶつかります）`));
      }
      cBox.append(d);
    }
    for (const u of plan.unknown ?? []) {
      const d = el('div', 'ab');
      d.append(el('b', null, `③ 不明: ${u.label}`),
        document.createTextNode(`（${u.untestedWith.join(', ')} との組み合わせを検査していません）`));
      cBox.append(d);
    }
    cBox.append(el('div', 'note',
      `⚠ これは仮説です。ペア単位で衝突しないことは、まとめて衝突しないことを意味しません`
      + `（3者間で初めて起きる衝突があります）。`
      + `未検査のペアが ${plan.untestedPairs} 組あります（検査済み ${plan.testedPairs} 組）。`));
  }
  if (conf.length) {
    cBox.append(el('div', 'note',
      '⚠ 候補は「同じファイルを触っているペア」から作っています。'
      + ' rename と delete の組み合わせは別パスでも衝突しうるので、これは完全な検出ではありません。'));
  }
  cPane.body.replaceChildren(cBox);

  renderAgents(s);
  // 監視盤は別経路（exec の関門越し）なので await しない（描画を止めない）
  renderMonitor().catch(() => { /* 監視が取れなくても他は描く */ });

  // 🚨 **何の差分かを見出しに書く。** ここが並べているのは `base...HEAD` の
  //    **コミット済み**差分で、worktree カードの「変更 N・未追跡 N」は
  //    **未コミット**の数。別のものを同じ見た目で並べていたので、
  //    「変更 10」と出ているのにファイラが「(差分なし)」になり、
  //    **どちらの数字も信じられなくなっていた**（#4）。
  const filer = ensurePane($('#left'), 'filer',
    `ファイラ（${s.base ?? 'base'}...HEAD の差分）`, []);
  const tree = el('div', 'tree');
  // ⚠️ ここは textContent なので Markdown 記法は書かない（そのまま文字として出る）
  tree.append(el('div', 'note',
    `コミット済みの差分です（${s.base ?? 'base'} と各 worktree の HEAD を比べたもの）。`
    + ' カードの「変更 N・未追跡 N」は未コミットの数なので、一致しません。'));
  for (const wt of s.worktrees) {
    const st = wt.status ?? {};
    const uncommitted = (st.changed ?? 0) + (st.untracked ?? 0);
    tree.append(el('div', 'd', `▾ ${wt.name}`));
    if (!wt.files?.length) {
      // ⚠️ 「差分なし」だけでは、未コミットの変更があるのに何も無いように見える。
      //    どちらの数字も出して食い違いを説明する
      tree.append(el('div', 'f', uncommitted
        ? `   (コミット済みの差分なし / 未コミット ${uncommitted} 件)`
        : '   (差分なし)'));
    }
    for (const f of (wt.files ?? []).slice(0, 12)) {
      const d = el('div', 'f');
      d.append(el('span', 'st', f.status), document.createTextNode(f.path.split('/').pop()));
      d.title = f.path;
      d.addEventListener('click', () => openDiff(wt, f.path));
      tree.append(d);
    }
  }
  filer.body.replaceChildren(tree);

  // 中央上: 差分。
  // ⚠️ ペインの id は**序数ではなく worktree path**。序数だと払い出し順が変わった
  //    ときに「ヘッダは agent-a なのに中身は agent-b」になり、同名ファイルなら
  //    黙って別 worktree の内容に差し替わる（レビューで実測）。
  const withFiles = s.worktrees.filter(w => w.files?.length);
  const picks = withFiles.slice(0, MAX_DIFF_PANES);
  if (!picks.length && s.worktrees.length) picks.push(s.worktrees[0]);
  const diffIds = new Set(picks.map(w => `diff-${w.path}`));
  dropPanes('diff-', diffIds);
  for (const wt of picks) {
    const id = `diff-${wt.path}`;
    const obj = ensurePane($('#diffs'), id, '差分', [['br', wt.branch ?? wt.name]]);
    obj.p.dataset.wt = wt.path;
    obj.wt = wt;
    const files = (wt.files ?? []).slice(0, 6);
    const tabs = el('div', 'tabs');
    const holder = el('div');
    obj.holder = holder;         // ⚠️ DOM を後から探さない（S1: セレクタが wrap を掴んでいた）
    // 復元キーは worktree+path。path だけだと同名ファイルで別 worktree に引き継がれる
    const prev = obj.selWt === wt.path ? obj.sel : null;
    const initial = files.find(f => f.path === prev)?.path ?? files[0]?.path;
    const openIn = path => {
      for (const o of tabs.children) o.classList.toggle('on', o.title === path);
      obj.sel = path; obj.selWt = wt.path;
      loadDiff(holder, s.base, wt.branch ?? wt.head, path);
    };
    obj.openIn = openIn;
    for (const f of files) {
      const b = el('button', f.path === initial ? 'on' : null, f.path.split('/').pop());
      b.title = f.path;
      b.addEventListener('click', () => openIn(f.path));
      tabs.append(b);
    }
    if (!files.length) tabs.append(el('button', 'on', '(差分なし)'));
    const wrap = el('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;height:100%';
    wrap.append(tabs, holder);
    obj.body.replaceChildren(wrap);
    if (initial) { obj.sel = initial; obj.selWt = wt.path; loadDiff(holder, s.base, wt.branch ?? wt.head, initial); }
    else holder.append(el('div', 'note', `${wt.branch ?? wt.name} は base と同じ内容です`));
  }
  // 🚨 **前回の告知を消してから足す。** 消していなかったので、自動更新のたびに
  //    「他 N 本は…」が1行ずつ増え続けていた（ペインを並べ直す側で告知を
  //    末尾へ回すようにして初めて気付いた）。
  clearNotices($('#diffs'));
  if (withFiles.length > MAX_DIFF_PANES) {
    $('#diffs').append(el('div', 'note',
      `他 ${withFiles.length - MAX_DIFF_PANES} 本の差分は表示していません（上限 ${MAX_DIFF_PANES}）。ファイラから開けます。`));
  }

  // 中央下: コンソール。**id 単位の差分更新**にする。
  // ⚠️ 以前は集合キー（path を | で連結）が変わると全ペインを作り直していた。
