<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kjp-edit v0</title>
<style>
  :root {
    --bg: #1e1e1e; --fg: #d4d4d4; --dim: #808080; --line: #333;
    --card: #252526; --accent: #4fc1ff; --danger: #f14c4c; --warn: #cca700;
    --row: 24px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #fff; --fg: #1f1f1f; --dim: #6a6a6a; --line: #e0e0e0; --card: #f6f6f6; --accent: #0066bf; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.5 ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace; }
  /* 別端末（スマホ）から見るので、ヘッダは常に届く位置に置く */
  header { padding: .75rem 1rem; border-bottom: 1px solid var(--line);
    display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 10; background: var(--bg); }
  /* ⚠️ ここから下の min-width: 0 / overflow-wrap / flex-wrap は**予防的**な宣言。
     grid・flex アイテムの min-width が既定 auto であることに備えている。
     いずれも外しても現行フィクスチャ（6レーン）では横溢れは再現しなかった
     ので、「これが無いと崩れる」とは書かない（v0/layout-check.mjs で確認）。
     実証済みで load-bearing なのは .grow のバッジ配置だけ（下記）。 */
  header > * { min-width: 0; }
  h1 { font-size: 14px; margin: 0; font-weight: 600; }
  .meta { color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
  main { padding: 1rem; display: grid; gap: 1rem; max-width: 1400px; }
  /* .graph の overflow: auto は幅が確定して初めて効く（レーン数が多い場合に備える）。 */
  main > *, .body { min-width: 0; }
  section > h2 { font-size: 13px; margin: 0 0 .5rem; color: var(--dim);
    text-transform: uppercase; letter-spacing: .05em; }
  /* 折り畳み。縦に並べて最小化・展開できるようにする（モバイルの運用イメージ）。
     <details> は静的マークアップに置き、中身だけを差し替えるので
     15秒ごとの再描画でも開閉状態が保たれる。 */
  details { border: 1px solid var(--line); border-radius: 4px; background: var(--card); }
  details > summary { cursor: pointer; list-style: none; padding: .6rem .7rem;
    display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap;
    font-size: 13px; color: var(--dim); text-transform: uppercase;
    letter-spacing: .05em; min-height: 40px; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: '▸'; color: var(--dim); font-size: 11px; }
  details[open] > summary::before { content: '▾'; }
  details > summary:hover { color: var(--fg); }
  /* 畳んだままでも状況が分かるように要約を出す */
  .sum-note { text-transform: none; letter-spacing: 0; color: var(--fg); font-size: 12px; }
  .sum-note .warn { color: var(--warn); }
  .sum-note .danger { color: var(--danger); }
  .body { padding: 0 .7rem .7rem; }
  .cards { display: grid; gap: .5rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: .6rem .7rem; }
  .card h3 { margin: 0 0 .3rem; font-size: 13px; display: flex; gap: .4rem;
    align-items: center; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 0 .35em; border-radius: 3px; border: 1px solid var(--line); color: var(--dim); }
  .badge.dirty { color: var(--warn); border-color: var(--warn); }
  .badge.danger { color: var(--danger); border-color: var(--danger); }
  .ab { color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
  .ab b { color: var(--fg); font-weight: 600; }
  .files { margin: .4rem 0 0; padding: 0; list-style: none; max-height: 8rem; overflow: auto; }
  .files li { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .files .st { display: inline-block; width: 1.2em; color: var(--accent); }
  .alert { border-left: 3px solid var(--warn); padding: .4rem .6rem; margin: .3rem 0;
    background: var(--card); font-size: 12px; overflow-wrap: anywhere; }
  .alert.danger { border-left-color: var(--danger); }
  .alert code { color: var(--accent); }
  /* グラフ: 行を1枚の SVG + テキストの grid で並べる */
  .graph { border: 1px solid var(--line); border-radius: 4px; overflow: auto; background: var(--card); }
  /* ⚠️ バッジ（worktree HEAD / ref）を .subject の中に入れてはいけない。
     .subject は overflow: hidden なので、狭い画面ではバッジが
     クリップされて**完全に見えなくなる**（横スクロールでも到達できない。
     .graph の scrollWidth にも寄与しないので溢れとして検出もされない）。
     「どのコミットがどのエージェントの HEAD か」はこのツールの核心情報なので、
     独立した列に置いて .subject 側を truncate させる。 */
  .grow { display: grid; grid-template-columns: auto auto auto 1fr auto;
    align-items: center; height: var(--row); gap: .4rem; padding-right: .6rem; }
  /* ⚠️ ここに max-width: <パーセント> を書かないこと。grid の `auto` 列に対する
     パーセント max-width は幅が循環参照になり、バッジが `a…` `HE…` のように
     1〜2文字へ潰れる（実測）。各バッジ側の max-width: 12em で足りる。
     行が詰まったときは 1fr の .subject が縮んで吸収する。 */
  .wtcell, .refcell { display: flex; gap: .2rem; align-items: center;
    overflow: hidden; white-space: nowrap; }
  .grow:hover { background: rgba(127,127,127,.12); }
  .grow svg { display: block; }
  /* grid の 1fr は minmax(auto, 1fr) なので、min-width: 0 で内容幅を下回れるようにする
     （これも上記と同じ予防的な宣言。外しても現行フィクスチャでは再現しない）。 */
  .subject { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .refs { color: var(--dim); font-size: 11px; }
  .ref { border: 1px solid var(--line); border-radius: 3px; padding: 0 .3em;
    font-size: 11px; max-width: 12em; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; flex: 0 1 auto; }
  .ref.wt { color: var(--accent); border-color: var(--accent); }
  .when { color: var(--dim); font-size: 11px; white-space: nowrap; }
  .empty { color: var(--dim); padding: .5rem; }
  /* タッチで押せる大きさを確保する（44px 目安） */
  button { font: inherit; background: var(--card); color: var(--fg);
    border: 1px solid var(--line); border-radius: 3px;
    padding: .35rem .8rem; min-height: 32px; cursor: pointer; }
  @media (max-width: 700px) {
    main { padding: .5rem; gap: .5rem; }
    .when { display: none; }
    /* カードは1列に積む（レイアウトの保持は諦めて縦に並べる方針） */
    .cards { grid-template-columns: 1fr; }
    /* グラフの行は縦に伸ばして指で追いやすくする */
    .grow { gap: .4rem; padding-right: .3rem; }
    header { padding: .5rem .6rem; gap: .5rem; }
    /* 変更ファイル一覧はスマホでは短く。展開はカードのスクロールで足りる */
    .files { max-height: 6rem; }
    /* ⚠️ ref バッジは 390px では 1〜2文字（`a…` `機…`）に潰れ、
       場所を取って何も伝えない。worktree HEAD バッジとグラフ形状を優先して落とす。
       ブランチ名は worktree カードと行の title に残るので失われない。 */
    .refcell { display: none; }
    details > summary { padding: .7rem .6rem; }
    .body { padding: 0 .6rem .6rem; }
  }
</style>

<header>
  <h1>kjp-edit <span class="meta">v0</span></h1>
  <span class="meta" id="repo"></span>
  <span class="meta" id="base"></span>
  <button id="refresh">再読込</button>
  <span class="meta" id="at"></span>
</header>

<main>
  <!-- 警告は畳めない。見落とすと壊れるのが目的の情報なので常に開く。 -->
  <section id="alerts"></section>

  <details id="d-wt" open>
    <summary>Worktrees <span class="sum-note" id="sum-wt"></span></summary>
    <div class="body"><div class="cards" id="worktrees"></div></div>
  </details>

  <details id="d-ov" hidden>
    <summary>同じファイルを触っている worktree <span class="sum-note" id="sum-ov"></span></summary>
    <div class="body" id="overlaps"></div>
  </details>

  <details id="d-graph" open>
    <summary>統合グラフ（全 worktree の HEAD を1枚に）<span class="sum-note" id="sum-graph"></span></summary>
    <div class="body"><div class="graph" id="graph"></div></div>
  </details>
</main>

<script type="module">
const LANE_W = 11, ROW_H = 24, DOT_R = 3.5;
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

/** 1行分のスイムレーンSVG。input/output のレーンから縦線と接続を描く。 */
function rowSvg(row) {
  const lanes = Math.max(row.input.length, row.output.length, row.lane + 1);
  const w = Math.max(lanes, 1) * LANE_W + LANE_W;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', w);
  svg.setAttribute('height', ROW_H);
  const x = i => i * LANE_W + LANE_W / 2 + 2;
  const add = (name, attrs) => {
    const e = document.createElementNS('http://www.w3.org/2000/svg', name);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    svg.appendChild(e);
    return e;
  };

  // 上半分: input レーンを行の中央まで引く。
  // どの output レーンが input から供給されているかも同時に記録する。
  const fedByInput = new Set();
  row.input.forEach((node, i) => {
    // 自分のコミットを指すレーンは点へ寄せる（合流）。それ以外は下の同じIDへ。
    const target = node.id === row.hash ? row.lane
      : row.output.findIndex(o => o.id === node.id);
    if (node.id !== row.hash && target !== -1) fedByInput.add(target);
    const x2 = target === -1 ? x(i) : x(target);
    add('path', {
      d: `M ${x(i)} 0 L ${x(i)} ${ROW_H / 2 - 5} L ${x2} ${ROW_H / 2}`,
      stroke: node.color, fill: 'none', 'stroke-width': 1.6,
    });
  });

  // 下半分: output レーンを行の中央から下へ。
  // 点 (row.lane) から引くのは第一親のレーンと、
  // このマージ行で新しく開いた第二親以降のレーン。
  // ⚠️ mergeParentLanes を見ていなかったため、マージの第二親レーンが
  //    行の途中から何にも繋がらずに突然生えていた（レビューで発覚）。
  const mergeLanes = new Set(row.mergeParentLanes ?? []);
  row.output.forEach((node, i) => {
    const fresh = mergeLanes.has(i) && !fedByInput.has(i);
    const from = (i === row.firstParentLane || fresh) ? row.lane : i;
    add('path', {
      d: `M ${x(from)} ${ROW_H / 2} L ${x(i)} ${ROW_H / 2 + 5} L ${x(i)} ${ROW_H}`,
      stroke: node.color, fill: 'none', 'stroke-width': 1.6,
    });
  });

  // 既に開いているレーンへのマージは、上の縦線とは別に点からの分岐線を足す。
  for (const i of mergeLanes) {
    if (!fedByInput.has(i) || i === row.firstParentLane) continue;
    add('path', {
      d: `M ${x(row.lane)} ${ROW_H / 2} L ${x(i)} ${ROW_H / 2 + 5}`,
      stroke: row.output[i]?.color ?? row.color, fill: 'none', 'stroke-width': 1.6,
    });
  }

  // コミットのドット。worktree の HEAD は塗りを抜いて強調する。
  const isHead = row.worktrees.length > 0;
  add('circle', {
    cx: x(row.lane), cy: ROW_H / 2, r: isHead ? DOT_R + 1.5 : DOT_R,
    fill: isHead ? 'var(--bg)' : row.color,
    stroke: row.color, 'stroke-width': isHead ? 2.5 : 1,
  });
  return svg;
}

function when(iso) {
  const d = new Date(iso), now = Date.now();
  const m = Math.round((now - d.getTime()) / 60000);
  if (m < 60) return `${m}分前`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h}時間前`;
  return `${Math.round(h / 24)}日前`;
}

function render(s) {
  $('#repo').textContent = s.repo;
  $('#base').textContent = `base: ${s.base}`;
  $('#at').textContent = when(s.generatedAt);

  // 収集そのものが部分的に失敗した場合（worktree 消失・ref 未解決など）。
  // これを出さないと、壊れた worktree が静かに一覧から消えるだけになる。
  const alerts = $('#alerts');
  alerts.replaceChildren();
  for (const e of s.errors ?? []) {
    const d = el('div', 'alert');
    d.append(el('b', null, `${e.scope}: `), document.createTextNode(e.message));
    alerts.append(d);
  }

  // 警告（シーケンサ乗っ取り / MERGE_HEAD）
  for (const wt of s.worktrees) {
    for (const w of wt.warnings) {
      const d = el('div', `alert ${w.level === 'danger' ? 'danger' : ''}`);
      d.append(el('b', null, `${wt.name}: `), document.createTextNode(w.message));
      alerts.append(d);
    }
  }

  // worktree カード
  const wts = $('#worktrees');
  wts.replaceChildren();
  for (const wt of s.worktrees) {
    const c = el('div', 'card');
    const h = el('h3');
    h.append(el('span', null, wt.name));
    if (wt.branch) h.append(el('span', 'badge', wt.branch));
    if (wt.detached) h.append(el('span', 'badge', 'detached'));
    if (wt.locked) h.append(el('span', 'badge', 'locked'));
    // ⚠️ prunable / bare / 進行中のシーケンサは payload に来ていたのに
    //    どのバッジも描いていなかった（レビューで発覚）。
    //    これが見えないと「なぜこの worktree の数字が 0 なのか」が分からない。
    if (wt.prunable) h.append(el('span', 'badge danger', 'prunable'));
    if (wt.bare) h.append(el('span', 'badge', 'bare'));
    const seq = wt.sequencer ?? {};
    for (const [flag, label] of [
      ['rebasing', 'rebasing'], ['merging', 'merging'],
      ['cherryPicking', 'cherry-pick'], ['reverting', 'revert'], ['bisecting', 'bisect'],
    ]) {
      if (seq[flag]) h.append(el('span', 'badge danger', label));
    }
    if (wt.status?.dirty) h.append(el('span', 'badge dirty', 'dirty'));
    c.append(h);

    const ab = el('div', 'ab');
    ab.innerHTML = `+<b>${wt.ahead}</b> / -<b>${wt.behind}</b>`
      + (wt.status ? ` · 変更 <b>${wt.status.changed}</b> · 未追跡 <b>${wt.status.untracked}</b>` : '')
      + (wt.status?.unmerged ? ` · <b>未解決 ${wt.status.unmerged}</b>` : '');
    c.append(ab);
    if (wt.prunable) {
      c.append(el('div', 'ab', `作業ツリーが失われています: ${wt.prunableReason ?? '理由不明'}`));
    }

    if (wt.files.length) {
      const ul = el('ul', 'files');
      for (const f of wt.files.slice(0, 40)) {
        const li = el('li');
        li.append(el('span', 'st', f.status), document.createTextNode(f.path));
        ul.append(li);
      }
      if (wt.files.length > 40) ul.append(el('li', null, `… 他 ${wt.files.length - 40} 件`));
      c.append(ul);
    }
    wts.append(c);
  }

  // ファイル重複
  const ovSec = $('#d-ov'), ov = $('#overlaps');
  ov.replaceChildren();
  if (s.overlaps.length) {
    ovSec.hidden = false;
    for (const o of s.overlaps) {
      const d = el('div', 'alert');
      d.append(el('b', null, o.path), document.createTextNode(` — ${o.worktrees.join(', ')}`));
      ov.append(d);
    }
  } else ovSec.hidden = true;

  // 畳んだままでも状況が分かる要約。スマホでは全部展開すると縦に長すぎる。
  const dirty = s.worktrees.filter(w => w.status?.dirty).length;
  const broken = s.worktrees.filter(w => w.prunable).length;
  const danger = s.worktrees.reduce(
    (n, w) => n + (w.warnings ?? []).filter(x => x.level === 'danger').length, 0);
  const wtNote = [`${s.worktrees.length} 本`];
  if (dirty) wtNote.push(`dirty ${dirty}`);
  if (broken) wtNote.push(`prunable ${broken}`);
  const sumWt = $('#sum-wt');
  sumWt.replaceChildren(document.createTextNode(wtNote.join(' · ')));
  if (danger) sumWt.append(el('span', 'danger', ` · 🚨 ${danger}`));

  $('#sum-ov').textContent = s.overlaps.length ? `${s.overlaps.length} ファイル` : '';
  $('#sum-graph').textContent = `${s.graph.length} コミット · base ${s.base}`;

  // グラフ
  const g = $('#graph');
  g.replaceChildren();
  if (!s.graph.length) { g.append(el('div', 'empty', 'コミットがありません')); return; }
  for (const row of s.graph) {
    const r = el('div', 'grow');
    r.append(rowSvg(row));
    // worktree の HEAD → ref → 件名 の順。狭い画面では件名から削る。
    const wtCell = el('div', 'wtcell');
    for (const name of row.worktrees) wtCell.append(el('span', 'ref wt', `⌂ ${name}`));
    r.append(wtCell);
    const refCell = el('div', 'refcell');
    for (const ref of row.refs) refCell.append(el('span', 'ref', ref));
    r.append(refCell);
    r.append(el('div', 'subject', row.subject));
    r.append(el('div', 'when', `${row.author} · ${when(row.date)}`));
    // バッジは truncate されうるので、全文は title で辿れるようにする
    r.title = [
        `${row.hash.slice(0, 8)}  ${row.subject}`,
        row.worktrees.length ? `worktree: ${row.worktrees.join(', ')}` : null,
        row.refs.length ? `refs: ${row.refs.join(', ')}` : null,
    ].filter(Boolean).join('\n');
    g.append(r);
  }
}

// force=true のときだけサーバの TTL キャッシュを無視する。
// 自動ポーリングはキャッシュに当てて git の spawn を抑える。
async function load(force = false) {
  try {
    const res = await fetch(force ? '/api/v0/state?fresh=1' : '/api/v0/state');
    const s = await res.json();
    if (s.error) throw new Error(s.error);
    render(s);
  } catch (e) {
    $('#alerts').replaceChildren(el('div', 'alert danger', String(e.message || e)));
  }
}
// 開閉状態を残す。スマホで毎回グラフを畳み直すのは使えないので。
// localStorage が使えない環境（プライベートモード等）でも落ちないようにする。
for (const d of document.querySelectorAll('details')) {
  const key = `kjp-open:${d.id}`;
  try {
    const saved = localStorage.getItem(key);
    if (saved !== null) d.open = saved === '1';
  } catch { /* 保存できなくても動く */ }
  d.addEventListener('toggle', () => {
    try { localStorage.setItem(key, d.open ? '1' : '0'); } catch { /* 同上 */ }
  });
}

$('#refresh').addEventListener('click', () => load(true));
load();
setInterval(() => load(), 15000);
</script>
