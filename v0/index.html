<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kjp-edit v0</title>
<style>
  :root {
    --bg: #1e1e1e; --fg: #d4d4d4; --dim: #808080; --line: #333;
    --card: #252526; --accent: #4fc1ff; --danger: #f14c4c; --warn: #cca700;
    --row: 24px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #fff; --fg: #1f1f1f; --dim: #6a6a6a; --line: #e0e0e0; --card: #f6f6f6; --accent: #0066bf; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.5 ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace; }
  header { padding: .75rem 1rem; border-bottom: 1px solid var(--line);
    display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 14px; margin: 0; font-weight: 600; }
  .meta { color: var(--dim); font-size: 12px; }
  main { padding: 1rem; display: grid; gap: 1rem; max-width: 1400px; }
  section > h2 { font-size: 13px; margin: 0 0 .5rem; color: var(--dim);
    text-transform: uppercase; letter-spacing: .05em; }
  .cards { display: grid; gap: .5rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: .6rem .7rem; }
  .card h3 { margin: 0 0 .3rem; font-size: 13px; display: flex; gap: .4rem; align-items: center; }
  .badge { font-size: 11px; padding: 0 .35em; border-radius: 3px; border: 1px solid var(--line); color: var(--dim); }
  .badge.dirty { color: var(--warn); border-color: var(--warn); }
  .ab { color: var(--dim); font-size: 12px; }
  .ab b { color: var(--fg); font-weight: 600; }
  .files { margin: .4rem 0 0; padding: 0; list-style: none; max-height: 8rem; overflow: auto; }
  .files li { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .files .st { display: inline-block; width: 1.2em; color: var(--accent); }
  .alert { border-left: 3px solid var(--warn); padding: .4rem .6rem; margin: .3rem 0;
    background: var(--card); font-size: 12px; }
  .alert.danger { border-left-color: var(--danger); }
  .alert code { color: var(--accent); }
  /* グラフ: 行を1枚の SVG + テキストの grid で並べる */
  .graph { border: 1px solid var(--line); border-radius: 4px; overflow: auto; background: var(--card); }
  .grow { display: grid; grid-template-columns: auto 1fr auto; align-items: center;
    height: var(--row); gap: .6rem; padding-right: .6rem; }
  .grow:hover { background: rgba(127,127,127,.12); }
  .grow svg { display: block; }
  .subject { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .refs { color: var(--dim); font-size: 11px; }
  .ref { border: 1px solid var(--line); border-radius: 3px; padding: 0 .3em; margin-left: .3em; }
  .ref.wt { color: var(--accent); border-color: var(--accent); }
  .when { color: var(--dim); font-size: 11px; white-space: nowrap; }
  .empty { color: var(--dim); padding: .5rem; }
  button { font: inherit; background: var(--card); color: var(--fg);
    border: 1px solid var(--line); border-radius: 3px; padding: .2rem .6rem; cursor: pointer; }
  @media (max-width: 700px) { main { padding: .5rem; } .when { display: none; } }
</style>

<header>
  <h1>kjp-edit <span class="meta">v0</span></h1>
  <span class="meta" id="repo"></span>
  <span class="meta" id="base"></span>
  <button id="refresh">再読込</button>
  <span class="meta" id="at"></span>
</header>

<main>
  <section id="alerts"></section>
  <section>
    <h2>Worktrees</h2>
    <div class="cards" id="worktrees"></div>
  </section>
  <section id="overlap-section" hidden>
    <h2>同じファイルを触っている worktree</h2>
    <div id="overlaps"></div>
  </section>
  <section>
    <h2>統合グラフ（全 worktree の HEAD を1枚に）</h2>
    <div class="graph" id="graph"></div>
  </section>
</main>

<script type="module">
const LANE_W = 11, ROW_H = 24, DOT_R = 3.5;
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

/** 1行分のスイムレーンSVG。input/output のレーンから縦線と接続を描く。 */
function rowSvg(row) {
  const lanes = Math.max(row.input.length, row.output.length, row.lane + 1);
  const w = Math.max(lanes, 1) * LANE_W + LANE_W;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', w);
  svg.setAttribute('height', ROW_H);
  const x = i => i * LANE_W + LANE_W / 2 + 2;
  const add = (name, attrs) => {
    const e = document.createElementNS('http://www.w3.org/2000/svg', name);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    svg.appendChild(e);
    return e;
  };

  // 上半分: input レーンを行の中央まで引く
  row.input.forEach((node, i) => {
    // 自分のコミットを指すレーンは点へ寄せる（合流）。それ以外は下の同じIDへ。
    const target = node.id === row.hash ? row.lane
      : row.output.findIndex(o => o.id === node.id);
    const x2 = target === -1 ? x(i) : x(target);
    add('path', {
      d: `M ${x(i)} 0 L ${x(i)} ${ROW_H / 2 - 5} L ${x2} ${ROW_H / 2}`,
      stroke: node.color, fill: 'none', 'stroke-width': 1.6,
    });
  });

  // 下半分: output レーンを行の中央から下へ。
  // 第一親のレーンだけは点 (row.lane) から引く。
  row.output.forEach((node, i) => {
    const from = i === row.firstParentLane ? row.lane : i;
    add('path', {
      d: `M ${x(from)} ${ROW_H / 2} L ${x(i)} ${ROW_H / 2 + 5} L ${x(i)} ${ROW_H}`,
      stroke: node.color, fill: 'none', 'stroke-width': 1.6,
    });
  });

  // コミットのドット。worktree の HEAD は塗りを抜いて強調する。
  const isHead = row.worktrees.length > 0;
  add('circle', {
    cx: x(row.lane), cy: ROW_H / 2, r: isHead ? DOT_R + 1.5 : DOT_R,
    fill: isHead ? 'var(--bg)' : row.color,
    stroke: row.color, 'stroke-width': isHead ? 2.5 : 1,
  });
  return svg;
}

function when(iso) {
  const d = new Date(iso), now = Date.now();
  const m = Math.round((now - d.getTime()) / 60000);
  if (m < 60) return `${m}分前`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h}時間前`;
  return `${Math.round(h / 24)}日前`;
}

function render(s) {
  $('#repo').textContent = s.repo;
  $('#base').textContent = `base: ${s.base}`;
  $('#at').textContent = when(s.generatedAt);

  // 警告（シーケンサ乗っ取り / MERGE_HEAD）
  const alerts = $('#alerts');
  alerts.replaceChildren();
  for (const wt of s.worktrees) {
    for (const w of wt.warnings) {
      const d = el('div', `alert ${w.level === 'danger' ? 'danger' : ''}`);
      d.append(el('b', null, `${wt.name}: `), document.createTextNode(w.message));
      alerts.append(d);
    }
  }

  // worktree カード
  const wts = $('#worktrees');
  wts.replaceChildren();
  for (const wt of s.worktrees) {
    const c = el('div', 'card');
    const h = el('h3');
    h.append(el('span', null, wt.name));
    if (wt.branch) h.append(el('span', 'badge', wt.branch));
    if (wt.detached) h.append(el('span', 'badge', 'detached'));
    if (wt.locked) h.append(el('span', 'badge', 'locked'));
    if (wt.status?.dirty) h.append(el('span', 'badge dirty', 'dirty'));
    c.append(h);

    const ab = el('div', 'ab');
    ab.innerHTML = `+<b>${wt.ahead}</b> / -<b>${wt.behind}</b>`
      + (wt.status ? ` · 変更 <b>${wt.status.changed}</b> · 未追跡 <b>${wt.status.untracked}</b>` : '');
    c.append(ab);

    if (wt.files.length) {
      const ul = el('ul', 'files');
      for (const f of wt.files.slice(0, 40)) {
        const li = el('li');
        li.append(el('span', 'st', f.status), document.createTextNode(f.path));
        ul.append(li);
      }
      if (wt.files.length > 40) ul.append(el('li', null, `… 他 ${wt.files.length - 40} 件`));
      c.append(ul);
    }
    wts.append(c);
  }

  // ファイル重複
  const ovSec = $('#overlap-section'), ov = $('#overlaps');
  ov.replaceChildren();
  if (s.overlaps.length) {
    ovSec.hidden = false;
    for (const o of s.overlaps) {
      const d = el('div', 'alert');
      d.append(el('b', null, o.path), document.createTextNode(` — ${o.worktrees.join(', ')}`));
      ov.append(d);
    }
  } else ovSec.hidden = true;

  // グラフ
  const g = $('#graph');
  g.replaceChildren();
  if (!s.graph.length) { g.append(el('div', 'empty', 'コミットがありません')); return; }
  for (const row of s.graph) {
    const r = el('div', 'grow');
    r.append(rowSvg(row));
    const mid = el('div', 'subject');
    mid.append(document.createTextNode(row.subject));
    for (const name of row.worktrees) mid.append(el('span', 'ref wt', `⌂ ${name}`));
    for (const ref of row.refs) mid.append(el('span', 'ref', ref));
    r.append(mid);
    r.append(el('div', 'when', `${row.author} · ${when(row.date)}`));
    r.title = `${row.hash.slice(0, 8)}  ${row.subject}`;
    g.append(r);
  }
}

async function load() {
  try {
    const res = await fetch('/api/v0/state');
    const s = await res.json();
    if (s.error) throw new Error(s.error);
    render(s);
  } catch (e) {
    $('#alerts').replaceChildren(el('div', 'alert danger', String(e.message || e)));
  }
}
$('#refresh').addEventListener('click', load);
load();
setInterval(load, 15000);
</script>
